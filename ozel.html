<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>
(function(){try{var t=localStorage.getItem('cetcety-theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#C96442">
<title>Laafle – Türkçe Canlı Sohbet</title>
<meta name="description" content="Laafle: Türkçe canlı sohbet, özel mesajlaşma, görüntülü ve sesli arama.">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">

<style>
/* ============ TEMEL DEĞİŞKENLER ============ */
:root{
  color-scheme: light;
  --surface-rgb:250,249,245;
  --ink-rgb:31,30,29;
  --shadow-rgb:31,30,29;
  --bg-primary:#FAF9F5;
  --bg-secondary:#F5F4ED;
  --bg-tertiary:#F0EEE6;
  --bg-hover:#EAE7DC;
  --bg-elevated:#FFFFFF;
  --bg-panel:#F5F4ED;
  --text-primary:#1F1E1D;
  --text-secondary:#3D3D3A;
  --text-muted:#73726C;
  --text-dim:#9C9A92;
  --border-color:#E6E3D8;
  --border-light:#ECE9DF;
  --border-strong:#D1CEC0;
  --input-bg:#FFFFFF;
  --input-focus-bg:#FFFFFF;
  --button-bg:#F0EEE6;
  --button-hover:#E8E5DA;
  --online:#4F8A5B;
  --idle:#B8893A;
  --accent:#C96442;
  --accent-hover:#B5573A;
  --accent-light:rgba(201,100,66,0.12);
  --ban:#B5452F;
  --ban-bg:rgba(181,69,47,0.08);
  --shadow-sm:0 1px 2px rgba(var(--shadow-rgb),0.06);
  --shadow:0 2px 8px rgba(var(--shadow-rgb),0.08);
  --shadow-lg:0 8px 24px rgba(var(--shadow-rgb),0.10);
  --shadow-xl:0 16px 40px rgba(var(--shadow-rgb),0.14);
  --glass-bg:rgba(var(--surface-rgb),0.92);
  --glass-border:rgba(var(--ink-rgb),0.08);
  --chat-bg:#FAF9F5;
  --chat-header-bg:#F5F4ED;
  --panel-blur:12px;
  --app-h:100vh;
  --app-top:0px;
  --hdr-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@supports (height:100dvh){:root{--app-h:100dvh;}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-rgb:38,38,36;
  --ink-rgb:250,249,245;
  --shadow-rgb:0,0,0;
  --bg-primary:#262624;
  --bg-secondary:#1F1E1D;
  --bg-tertiary:#30302E;
  --bg-hover:#3A3935;
  --bg-elevated:#30302E;
  --bg-panel:#1F1E1D;
  --text-primary:#FAF9F5;
  --text-secondary:#C2C0B6;
  --text-muted:#9C9A92;
  --text-dim:#73726C;
  --border-color:#3E3D39;
  --border-light:#343330;
  --border-strong:#52504A;
  --input-bg:#30302E;
  --input-focus-bg:#353432;
  --button-bg:#30302E;
  --button-hover:#3A3935;
  --online:#6DB57C;
  --idle:#D4A24C;
  --accent:#D97757;
  --accent-hover:#E38A6C;
  --accent-light:rgba(217,119,87,0.16);
  --ban:#D9644A;
  --ban-bg:rgba(217,100,74,0.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow:0 2px 8px rgba(0,0,0,0.35);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.4);
  --shadow-xl:0 16px 40px rgba(0,0,0,0.5);
  --glass-bg:rgba(38,38,36,0.92);
  --glass-border:rgba(250,249,245,0.08);
  --chat-bg:#262624;
  --chat-header-bg:#1F1E1D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:var(--bg-primary);}
body{font-family:'Roboto',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary);max-width:100%;overflow-x:hidden;}
::selection{background:rgba(201,100,66,0.22);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
[hidden]{display:none!important;}

/* ============ HEADER ============ */
.app-header{height:60px;background:rgba(var(--surface-rgb),0.85);backdrop-filter:blur(var(--panel-blur));-webkit-backdrop-filter:blur(var(--panel-blur));display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:1000;border-bottom:1px solid var(--border-color);padding:0 12px;gap:12px;height:var(--hdr-h);}
.header-left{display:flex;align-items:center;gap:12px;min-width:0;}
.header-right{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text-primary);font-size:22px;letter-spacing:-0.5px;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;}
.logo-icon{color:var(--accent);font-size:26px;}
.icon-btn{width:42px;height:42px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;position:relative;flex:0 0 auto;}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
.icon-btn.active{background:var(--accent-light);color:var(--accent);border-color:transparent;}
.icon-btn::after{content:attr(title);position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);background:var(--text-primary);color:var(--bg-primary);padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap;display:none;z-index:2000;font-weight:500;pointer-events:none;}
.icon-btn:hover::after{display:block;}
.profile-btn{width:42px;height:42px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;flex:0 0 auto;}
.profile-btn:hover{border-color:var(--accent);}
.profile-btn img{width:100%;height:100%;object-fit:cover;display:none;}
.profile-btn.has-image i{display:none;}
.profile-btn.has-image img{display:block;}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-primary);}
@media(max-width:768px){
  .app-header{padding:0 6px;gap:6px;}
  .logo{font-size:18px;}
  .logo-icon{font-size:22px;}
  .icon-btn,.profile-btn{width:40px;height:40px;font-size:16px;}
  .fs-toggle-btn,.theme-toggle-btn{display:none;}
}

/* ============ ANA YERLEŞİM ============ */
.main-container{display:flex;flex:1;overflow:hidden;margin-top:var(--hdr-h);height:calc(var(--app-h) - var(--hdr-h));position:relative;}
@media(min-width:769px){
  .main-container{max-width:1100px;margin-left:auto;margin-right:auto;width:100%;}
}
@media(max-width:768px){
  .main-container{flex-direction:column;}
}

/* ============ SOHBET ============ */
.chat-container{flex:1;background:var(--bg-primary);display:flex;flex-direction:column;min-width:0;height:100%;position:relative;}
.chat-header{height:60px;min-height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);flex-shrink:0;}
.chat-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.chat-title i{color:var(--accent);}
.chat-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.messages-area{flex:1;min-height:0;padding:20px 24px 16px;overflow-y:auto;background:var(--bg-primary);overflow-x:hidden;}
.messages-area::-webkit-scrollbar{width:8px;}
.messages-area::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
.messages-area::-webkit-scrollbar-track{background:transparent;}
.chat-input-area{padding:12px 20px 14px;background:var(--bg-secondary);border-top:1px solid var(--border-color);flex:0 0 auto;}
.input-wrapper{display:flex;align-items:flex-end;gap:8px;}
#message-input{flex:1;min-width:0;min-height:46px;max-height:120px;padding:11px 16px;color:var(--text-primary);background:var(--input-bg);border:1px solid var(--border-color);border-radius:24px;font-size:15px;outline:none;resize:none;line-height:1.5;font-family:inherit;transition:all .15s;}
#message-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light);}
#message-input::placeholder{color:var(--text-muted);}
.send-button{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all .15s;flex-shrink:0;}
.send-button:hover{background:var(--accent-hover);transform:scale(1.05);}
.send-button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
@media(max-width:768px){
  .chat-header{height:52px;min-height:52px;padding:0 14px;}
  .chat-title{font-size:15px;}
  .messages-area{padding:12px 14px 8px;}
  .chat-input-area{padding:8px 10px calc(8px + var(--safe-b));}
  #message-input{font-size:16px;padding:10px 14px;min-height:42px;}
  .send-button{width:42px;height:42px;font-size:16px;}
}

/* ============ MESAJLAR ============ */
.message-item{padding:6px 0;position:relative;min-width:0;max-width:100%;word-break:break-word;overflow-wrap:anywhere;}
.message-item:hover{background:transparent;}
.message-header{display:flex;align-items:flex-start;gap:12px;}
.message-avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-muted);font-size:14px;margin-top:1px;}
.message-avatar img{width:100%;height:100%;object-fit:cover;}
.message-body{min-width:0;flex:1;}
.message-content{padding:0;color:var(--text-primary);font-size:15px;line-height:1.55;overflow-wrap:anywhere;}
.message-user{display:inline;margin-right:6px;padding:1px 8px 2px;color:var(--bg-primary);background:var(--text-primary);border-radius:13px;font-size:13px;font-weight:600;cursor:pointer;vertical-align:baseline;}
.message-user:hover{opacity:.85;}
.message-text{color:var(--text-primary);}
.message-time{color:var(--text-muted);font-size:11px;display:none;margin-left:6px;}
.message-item:hover .message-time{display:inline;}
.message-image{display:block;max-width:min(280px,100%);max-height:240px;width:auto;height:auto;object-fit:cover;border-radius:10px;margin-top:6px;cursor:zoom-in;}
.message-video{max-width:min(280px,100%);max-height:220px;border-radius:10px;margin-top:6px;}
.message-audio{max-width:min(240px,100%);height:36px;margin-top:4px;}
.message-item.system{padding:10px 0;color:var(--text-muted);font-size:13px;font-style:italic;}
.message-item.system::before{content:"▸ ";color:var(--accent);}
@media(max-width:768px){
  .message-avatar{flex:0 0 30px;width:30px;height:30px;}
  .message-header{gap:8px;align-items:flex-end;}
  .message-body{flex:0 1 auto;min-width:0;max-width:calc(100% - 50px);}
  .message-content{display:inline-block;background:var(--bg-tertiary);padding:7px 13px 8px;border-radius:18px 18px 18px 6px;font-size:15px;line-height:1.45;max-width:100%;}
  .message-user{display:block;background:none;color:var(--accent);padding:0;margin:0 0 1px;font-size:12.5px;font-weight:700;border-radius:0;}
  .message-item.mine .message-header{flex-direction:row-reverse;}
  .message-item.mine .message-avatar{display:none;}
  .message-item.mine .message-user{display:none;}
  .message-item.mine .message-content{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px;}
  .message-item.mine .message-body{margin-left:auto;flex:0 1 auto;}
  .message-item.mine .message-text{color:#fff;}
}

/* ============ GİRİŞ EKRANI ============ */
#login-screen{position:fixed;inset:0;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;overflow-y:auto;}
.login-container{background:rgba(var(--surface-rgb),0.98);backdrop-filter:blur(24px);border-radius:20px;padding:40px;width:100%;max-width:420px;border:1px solid var(--border-strong);box-shadow:0 20px 50px rgba(var(--shadow-rgb),0.16);box-sizing:border-box;}
.login-title{text-align:center;margin-bottom:28px;color:var(--text-primary);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;}
.login-title i{color:var(--accent);font-size:32px;}
.login-input{width:100%;padding:14px 20px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:12px;color:var(--text-primary);font-size:16px;outline:none;transition:all .15s;margin-bottom:14px;font-family:inherit;box-sizing:border-box;}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.login-button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.05em;}
.login-button:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);}
.login-button:disabled{opacity:.6;cursor:not-allowed;}
.login-info{color:var(--text-muted);font-size:13px;text-align:center;margin-top:14px;line-height:1.5;}
.error-message{color:var(--ban);margin-top:14px;font-size:14px;display:none;background:var(--ban-bg);padding:12px;border-radius:8px;border:1px solid var(--ban);white-space:pre-line;}
@media(max-width:600px){
  .login-container{padding:26px 20px;border-radius:16px;}
  .login-title{font-size:22px;margin-bottom:20px;}
}

/* ============ ÖZEL SOHBET — AYNEN KORUNDU ============ */
.private-modal{position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;background:var(--bg-primary);height:var(--app-h,100%);top:var(--app-top,0px);max-height:100%;}
.private-modal.show{display:flex;}
.private-header{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-color);background:var(--bg-secondary);flex-shrink:0;gap:10px;}
.private-title{font-weight:600;color:var(--text-primary);font-size:16px;display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.private-title > i{color:var(--accent);flex-shrink:0;}
.private-title > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.private-typing-indicator{font-size:12px;color:var(--online);margin-left:8px;font-weight:normal;}
.private-actions{display:flex;gap:6px;flex:0 0 auto;}
.private-btn{width:40px;height:40px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.private-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.05);}
.private-btn:active{transform:scale(.95);}
.private-messages{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg-primary);min-height:0;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.private-messages::-webkit-scrollbar{width:6px;}
.private-messages::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
.private-input-area{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-color);background:var(--bg-secondary);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;flex-wrap:wrap;position:relative;}
#private-input{flex:1;min-width:0;padding:11px 16px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:24px;color:var(--text-primary);font-size:15px;outline:none;resize:none;max-height:120px;line-height:1.5;font-family:inherit;transition:all .15s;}
#private-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light);}
.attach-btn{width:46px;height:46px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.attach-btn:hover{background:var(--bg-hover);color:var(--accent);}
.attach-btn.recording{background:var(--accent-light)!important;border-color:var(--ban)!important;}
.mic-btn{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(201,100,66,.25);transition:all .15s;}
.mic-btn:hover{background:var(--accent-hover);transform:scale(1.05);}
.private-input-area.has-text .mic-btn{display:none;}
.private-input-area:not(.has-text) #privateSendBtn{display:none;}
.private-input-area.recording-active #private-input,
.private-input-area.recording-active .mic-btn,
.private-input-area.recording-active #privateSendBtn,
.private-input-area.recording-active .private-attach-container{display:none!important;}
.private-input-area.recording-active .recording-bar{display:flex;order:0;flex:1 1 auto;width:auto;}
.private-input-area.recording-active{align-items:center;}

/* Ek dosya menüsü */
.private-attach-container{position:relative;display:inline-block;flex-shrink:0;}
.attach-menu{position:absolute;bottom:60px;left:0;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:14px;padding:6px;z-index:10;display:none;box-shadow:var(--shadow-xl);min-width:220px;}
.attach-menu.open{display:block;}
.attach-item{padding:11px 14px;display:flex;align-items:center;gap:12px;color:var(--text-primary);cursor:pointer;border-radius:10px;font-size:14px;transition:all .15s;}
.attach-item:hover{background:var(--bg-hover);color:var(--accent);}
.attach-item i{width:20px;text-align:center;color:var(--text-muted);}
.attach-item:hover i{color:var(--accent);}

/* Ses kaydı */
.recording-bar{display:none;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--accent-light);border:1px solid var(--accent);border-radius:24px;flex:1;box-sizing:border-box;min-width:0;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:blink 1s infinite;flex-shrink:0;}
@keyframes blink{50%{opacity:.3;}}
.rec-timer{font-family:monospace;font-size:14px;font-weight:700;color:var(--accent);min-width:44px;flex-shrink:0;}
.rec-waveform{display:flex;align-items:center;gap:2px;height:24px;flex:1;overflow:hidden;min-width:0;}
.rec-waveform .wave-bar{width:3px;border-radius:2px;background:var(--accent);animation:wave 0.8s ease-in-out infinite;}
.rec-waveform .wave-bar:nth-child(1){animation-delay:0s;height:8px;}
.rec-waveform .wave-bar:nth-child(2){animation-delay:0.1s;height:16px;}
.rec-waveform .wave-bar:nth-child(3){animation-delay:0.2s;height:22px;}
.rec-waveform .wave-bar:nth-child(4){animation-delay:0.3s;height:14px;}
.rec-waveform .wave-bar:nth-child(5){animation-delay:0.4s;height:20px;}
.rec-waveform .wave-bar:nth-child(6){animation-delay:0.5s;height:10px;}
@keyframes wave{0%,100%{transform:scaleY(1);}50%{transform:scaleY(0.3);}}
.rec-stop{width:auto;min-width:84px;height:42px;padding:0 14px;border-radius:21px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;touch-action:manipulation;}
.rec-stop:hover{background:var(--accent-hover);}
.rec-stop::after{content:'Bitir';font-size:13px;}
.rec-cancel{width:42px;height:42px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-muted);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}

/* Özel sohbet baloncukları (WhatsApp tarzı) */
.pm-msg{display:flex;width:100%;padding:0;margin:0;position:relative;}
.pm-msg.pm-out{justify-content:flex-end;}
.pm-msg.pm-in{justify-content:flex-start;}
.pm-bubble{position:relative;max-width:78%;min-width:64px;padding:7px 10px 5px;border-radius:14px;box-shadow:0 1px 1px rgba(0,0,0,.08);word-break:break-word;}
.pm-msg.pm-out .pm-bubble{background:var(--accent-light);border-bottom-right-radius:4px;max-width:min(78%,calc(100% - 44px));}
.pm-msg.pm-in .pm-bubble{background:var(--bg-tertiary);border-bottom-left-radius:4px;}
.pm-content{font-size:15px;line-height:1.45;white-space:pre-wrap;}
.pm-content:empty{display:none;}
.pm-content .message-image{margin-top:0;max-width:100%;max-height:240px;border-radius:10px;}
.pm-content audio{display:block;width:240px;max-width:100%;height:40px;margin-top:4px;}
.pm-video{position:relative;width:220px;max-width:100%;min-height:120px;border-radius:10px;overflow:hidden;background:#111;cursor:pointer;margin-top:4px;}
.pm-video img{display:block;width:100%;height:auto;max-height:300px;object-fit:cover;}
.pm-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px;}
.pm-vdur{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:8px;}
.pm-video-player{display:block;width:220px;max-width:100%;max-height:320px;border-radius:10px;background:#000;}
.pm-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;line-height:1;user-select:none;}
.pm-time{font-size:11px;color:var(--text-muted);}
.pm-ticks{font-size:12px;color:var(--text-muted);opacity:.85;display:inline-flex;}
.pm-ticks.read{color:#34B7F1;opacity:1;}
.pm-del{flex:0 0 auto;align-self:center;width:32px;height:32px;margin-right:6px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--ban);font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;touch-action:manipulation;}
.pm-del:hover,.pm-del:active{background:var(--ban);color:#fff;border-color:transparent;}
.pm-system{justify-content:center;margin:6px 0;}
.pm-system-text{font-size:12px;color:var(--text-muted);background:var(--bg-tertiary);padding:4px 12px;border-radius:12px;text-align:center;max-width:85%;}
.pm-quote{border-left:3px solid var(--accent);background:rgba(0,0,0,.07);border-radius:8px;padding:4px 8px;margin:0 0 5px;font-size:12.5px;cursor:pointer;max-width:100%;overflow:hidden;}
.pm-quote b{display:block;color:var(--accent);font-size:12px;}
.pm-quote span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85;word-break:break-word;}
.pm-rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.pm-rx:empty{display:none;}
.pm-rx .rx{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:12px;padding:1px 7px;font-size:13px;cursor:pointer;line-height:1.5;-webkit-tap-highlight-color:transparent;}
.pm-rx .rx.mine{border-color:var(--accent);background:var(--accent-light);}
.pm-notes{margin-top:5px;}
.pm-notes:empty{display:none;}
.pm-notes .pm-note{font-size:12.5px;margin-top:3px;padding:4px 8px;border-radius:8px;background:rgba(224,168,0,.16);border-left:3px solid #e0a800;word-break:break-word;cursor:pointer;}
.pm-notes .pm-note b{margin-right:4px;}
.pm-more{position:absolute;top:2px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;}
@media(hover:hover){.pm-bubble:hover .pm-more{display:flex;}}
.pm-swipe-ic{position:absolute;left:8px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;pointer-events:none;z-index:0;}
.pm-flash .pm-bubble{animation:pmFlash 1.2s ease;}
@keyframes pmFlash{0%,60%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:0 1px 1px rgba(0,0,0,.08);}}
#privateMessages .private-empty-state{margin:auto;text-align:center;padding:20px;color:var(--text-muted);font-size:14px;}
.pm-notice{display:flex;gap:10px;align-items:flex-start;align-self:center;max-width:94%;margin:2px 0 12px;padding:10px 12px;border-radius:12px;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-secondary);font-size:12.5px;line-height:1.5;}
.pm-notice i{color:var(--accent);margin-top:2px;flex:0 0 auto;}

/* Gizlilik kalkanı */
#pmShield{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:#0c0c0c;color:#fff;}
#pmShield.show{display:flex;}
#pmShield i{font-size:34px;color:#e5484d;}
#pmShield b{font-size:16px;}
#pmShield span{font-size:13px;opacity:.75;max-width:300px;line-height:1.5;}
#privateModal .private-messages,#privateModal .private-messages *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#privateModal img,#privateModal video{-webkit-user-drag:none;user-drag:none;}

/* Özel sohbet yanıt çubuğu */
#pmReplyBar{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-secondary);border-top:1px solid var(--border-color);flex:0 0 auto;width:100%;box-sizing:border-box;}
#pmReplyBar.show{display:flex;}
#pmReplyBar .rb{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;}
#pmReplyBar b{display:block;font-size:12.5px;color:var(--accent);}
#pmReplyBar span{display:block;font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pmReplyBar button{width:32px;height:32px;border-radius:50%;border:0;background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;flex-shrink:0;}

/* Özel sohbet menüsü */
#pmMenu{position:fixed;z-index:3300;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:18px;box-shadow:var(--shadow-xl);padding:6px;min-width:210px;max-width:calc(100vw - 16px);}
.pm-emorow{display:flex;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--border-color);margin-bottom:4px;}
.pm-emorow button{font-size:24px;line-height:1;background:none;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;padding:0;}
.pm-emorow button.sel,.pm-emorow button:active{background:var(--bg-hover);}
.pm-act{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--text-primary);}
.pm-act:active,.pm-act:hover{background:var(--bg-hover);}
.pm-act i{width:18px;text-align:center;color:var(--text-muted);}
.pm-act.danger,.pm-act.danger i{color:#e5484d;}

/* Özel sohbet not */
#pmNote{position:fixed;left:0;right:0;bottom:0;z-index:3300;background:var(--bg-primary);border-top:1px solid var(--border-color);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);}
#pmNote textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--border-color);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--bg-tertiary);color:var(--text-primary);resize:none;font-family:inherit;}
#pmNote .nb{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
#pmNote .nb button{border:0;border-radius:20px;padding:9px 18px;font-size:14px;cursor:pointer;background:var(--bg-tertiary);color:var(--text-primary);font-family:inherit;}
#pmNote .nb .pri{background:var(--accent);color:#fff;}
#pmNote .nt{font-size:13px;color:var(--text-muted);margin-bottom:8px;}
@media(min-width:769px){#pmNote{left:50%;right:auto;width:420px;transform:translateX(-50%);bottom:24px;border-radius:20px;border:1px solid var(--border-color);}}

/* ============ GÖRÜNTÜLÜ ARAMA — AYNEN KORUNDU ============ */
#vcall{position:fixed;inset:0;z-index:2147483000;background:#0b141a;color:#fff;display:none;flex-direction:column;font-family:inherit;-webkit-user-select:none;user-select:none;}
#vcall.show{display:flex;}
#vcRemote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b141a;}
#vcLocal{position:absolute;top:max(16px,env(safe-area-inset-top));right:14px;width:104px;height:150px;object-fit:cover;border-radius:14px;background:#222;box-shadow:0 4px 18px rgba(0,0,0,.5);transform:scaleX(-1);z-index:3;touch-action:none;}
#vcLocal.back{transform:none;}
#vcTop{position:absolute;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 130px 40px 18px;background:linear-gradient(#000a,#0000);z-index:2;pointer-events:none;}
#vcName{font-size:20px;font-weight:600;text-shadow:0 1px 4px #0008;}
#vcSt{font-size:14px;opacity:.85;margin-top:2px;}
#vcAvatar{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;background:#2a3942;display:none;align-items:center;justify-content:center;font-size:48px;font-weight:600;z-index:1;}
#vcBar{position:absolute;left:0;right:0;bottom:0;padding:26px 20px max(26px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:18px;background:linear-gradient(#0000,#000b);z-index:4;}
.vcb{width:58px;height:58px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.vcb.off{background:#fff;color:#111;}
.vcb.end{background:#e53935;width:66px;height:66px;}
.vcb.acc{background:#25d366;width:66px;height:66px;}
.vcb:active{transform:scale(.94);}
#vcData{position:absolute;left:18px;bottom:max(104px,calc(env(safe-area-inset-bottom) + 96px));font-size:12px;opacity:.7;z-index:4;}
#vcMin{position:absolute;top:max(16px,env(safe-area-inset-top));left:12px;width:40px;height:40px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:16px;z-index:5;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#vcMiniEnd{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;border:0;background:#e53935;color:#fff;font-size:15px;z-index:6;align-items:center;justify-content:center;}
#vcall.mini{inset:auto;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));width:132px;height:190px;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.6);border:2px solid #ffffff55;touch-action:none;cursor:pointer;}
#vcall.mini #vcLocal,#vcall.mini #vcTop,#vcall.mini #vcData,#vcall.mini #vcBar,#vcall.mini #vcMin{display:none!important;}
#vcall.mini #vcMiniEnd{display:flex;}
#vcall.mini #vcRemote{object-fit:cover;}
#vcall.mini #vcAvatar{width:56px;height:56px;font-size:24px;}
@media(min-width:700px){#vcLocal{width:170px;height:120px;}#vcRemote{object-fit:contain;}}

/* ============ BİLDİRİM PANELİ ============ */
.notification-panel{position:absolute;top:calc(100% + 8px);right:0;width:350px;max-width:calc(100vw - 16px);max-height:500px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow-xl);z-index:1500;display:none;flex-direction:column;overflow:hidden;animation:slideDown .2s ease;}
.notification-panel.active{display:flex;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.notification-header{padding:14px 16px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;background:var(--bg-secondary);}
.notification-header span{font-weight:600;font-size:15px;}
.notification-header button{background:transparent;border:0;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px;}
.notification-list{flex:1;overflow-y:auto;padding:8px;}
.notification-item{padding:12px;border-radius:10px;margin-bottom:6px;background:var(--bg-secondary);cursor:pointer;border-left:4px solid var(--accent);transition:all .15s;}
.notification-item:hover{background:var(--bg-hover);}
.notification-item.unread{background:rgba(201,100,66,.05);}
.notification-item:not(.unread){opacity:.6;border-left-color:var(--border-strong);}
.notification-footer{padding:10px;border-top:1px solid var(--border-color);display:flex;justify-content:center;}
.clear-notifications-btn{background:transparent;color:var(--text-primary);border:1px solid var(--border-color);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;}
.clear-notifications-btn:hover{background:var(--bg-hover);border-color:var(--accent);}
.notif-sender{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.notif-icon{width:24px;height:24px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:12px;}
.notif-sender strong{flex:1;font-size:14px;}
.notif-sender small{color:var(--text-muted);font-size:11px;}
.notif-text{font-size:14px;line-height:1.4;}
@media(max-width:768px){
  .notification-panel{position:fixed;top:calc(var(--hdr-h) + 6px);left:8px;right:8px;width:auto;max-width:none;}
}

/* ============ KULLANICI PANELİ (SADECE ÇEVRİMİÇİ + ÖZEL) ============ */
.users-sidebar{width:280px;min-width:280px;height:100%;background:var(--bg-panel);border-left:1px solid var(--border-color);display:none;flex-direction:column;overflow-y:auto;padding:14px;gap:4px;z-index:5;}
.users-sidebar.active{display:flex;}
.users-title{font-size:15px;color:var(--text-primary);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border-color);}
.users-title button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.users-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:12px;}
.users-tab-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border:0;border-radius:9px;font-size:11px;font-weight:600;color:var(--text-muted);background:transparent;cursor:pointer;}
.users-tab-btn i{font-size:14px;}
.users-tab-btn.active{background:var(--bg-panel);color:var(--text-primary);box-shadow:0 1px 4px rgba(0,0,0,.15);}
.users-tab-btn.active i{color:var(--accent);}
.user-list-container{flex:1;overflow-y:auto;}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;cursor:pointer;background:transparent;margin-bottom:2px;border:1px solid transparent;transition:all .15s;gap:8px;}
.user-item:hover{background:var(--bg-hover);border-color:var(--border-color);}
.user-item.has-unread{background:rgba(181,69,47,.08)!important;border-left:3px solid var(--ban);}
.user-status{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg-secondary);border:1.5px solid var(--border-light);display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden;color:var(--text-muted);flex-shrink:0;position:relative;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg-panel);background:var(--text-dim);}
.user-dot.online{background:var(--online);}
.user-info{min-width:0;display:flex;flex-direction:column;gap:2px;}
.user-name{font-size:14px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-sub{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-unread{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;flex-shrink:0;}
.users-empty{color:var(--text-muted);text-align:center;padding:24px 16px;font-size:13px;}
@media(max-width:1023px){
  .users-sidebar{position:fixed;right:0;top:var(--hdr-h);bottom:0;width:min(88vw,340px);z-index:999;display:none;box-shadow:-8px 0 32px rgba(var(--shadow-rgb),0.13);}
  .users-sidebar.active{display:flex;}
}

/* ============ MODAL ORTAK ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3500;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:16px;width:min(440px,100%);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;background:var(--bg-secondary);border-radius:16px 16px 0 0;}
.modal-header span{font-weight:600;font-size:16px;color:var(--text-primary);}
.modal-header button{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-primary);font-size:16px;cursor:pointer;}
.modal-body{padding:20px;}
.modal-body p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:12px;}
.modal-body label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin:10px 0 6px;}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border-color);background:var(--input-bg);color:var(--text-primary);font-family:inherit;font-size:14px;box-sizing:border-box;outline:none;}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--accent);}
.modal-body textarea{min-height:72px;resize:vertical;}
.modal-buttons{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.modal-btn{padding:10px 18px;border-radius:10px;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;}
.modal-btn:hover{background:var(--bg-hover);}
.modal-btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.modal-btn.pri:hover{background:var(--accent-hover);}
.avatar-big{width:100px;height:100px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--text-muted);overflow:hidden;margin:0 auto 12px;border:3px solid var(--accent);cursor:pointer;}
.avatar-big img{width:100%;height:100%;object-fit:cover;}
.avatar-upload-btn{display:block;margin:0 auto 16px;background:transparent;color:var(--text-primary);border:1px solid var(--border-color);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;}

/* ============ TOAST ============ */
#privateMessageToastStack{position:fixed;top:calc(var(--hdr-h) + 12px);right:16px;z-index:4000;display:flex;width:min(360px,calc(100vw - 28px));flex-direction:column;gap:8px;pointer-events:none;}
.private-message-toast{display:block;width:100%;padding:13px 15px;color:var(--text-primary);background:var(--bg-elevated);border:1px solid var(--border-strong);border-left:4px solid var(--accent);border-radius:10px;box-shadow:var(--shadow-lg);text-align:left;cursor:pointer;pointer-events:auto;}
.toast-sender{display:block;margin-bottom:4px;color:var(--accent);font-size:14px;font-weight:700;}
.toast-preview{display:block;overflow:hidden;color:var(--text-secondary);font-size:13px;text-overflow:ellipsis;white-space:nowrap;}

/* ============ MOBİL UYUM ============ */
@media(max-width:768px){
  body.mobile-chat-keyboard-open .video-container{display:none;}
}

/* Yardımcı */
.hidden{display:none!important;}
.loading{display:inline-block;width:18px;height:18px;border:2px solid rgba(var(--ink-rgb),.2);border-radius:50%;border-top-color:var(--accent);animation:spin 1s infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
