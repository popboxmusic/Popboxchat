<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>
(function(){try{var t=localStorage.getItem('cetcety-theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#C96442">
<title>Laafle – Türkçe Canlı Sohbet</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">

<style>
/* ============ TEMEL DEĞİŞKENLER ============ */
:root{
  color-scheme: light;
  --surface-rgb:250,249,245;
  --ink-rgb:31,30,29;
  --shadow-rgb:31,30,29;
  --bg-primary:#FAF9F5;
  --bg-secondary:#F5F4ED;
  --bg-tertiary:#F0EEE6;
  --bg-hover:#EAE7DC;
  --bg-elevated:#FFFFFF;
  --bg-panel:#F5F4ED;
  --text-primary:#1F1E1D;
  --text-secondary:#3D3D3A;
  --text-muted:#73726C;
  --text-dim:#9C9A92;
  --border-color:#E6E3D8;
  --border-light:#ECE9DF;
  --border-strong:#D1CEC0;
  --input-bg:#FFFFFF;
  --button-bg:#F0EEE6;
  --button-hover:#E8E5DA;
  --online:#4F8A5B;
  --accent:#C96442;
  --accent-hover:#B5573A;
  --accent-light:rgba(201,100,66,0.12);
  --ban:#B5452F;
  --ban-bg:rgba(181,69,47,0.08);
  --shadow-sm:0 1px 2px rgba(var(--shadow-rgb),0.06);
  --shadow:0 2px 8px rgba(var(--shadow-rgb),0.08);
  --shadow-lg:0 8px 24px rgba(var(--shadow-rgb),0.10);
  --shadow-xl:0 16px 40px rgba(var(--shadow-rgb),0.14);
  --chat-bg:#FAF9F5;
  --chat-header-bg:#F5F4ED;
  --panel-blur:12px;
  --app-h:100vh;
  --app-top:0px;
  --hdr-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@supports (height:100dvh){:root{--app-h:100dvh;}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-rgb:38,38,36;
  --ink-rgb:250,249,245;
  --shadow-rgb:0,0,0;
  --bg-primary:#262624;
  --bg-secondary:#1F1E1D;
  --bg-tertiary:#30302E;
  --bg-hover:#3A3935;
  --bg-elevated:#30302E;
  --bg-panel:#1F1E1D;
  --text-primary:#FAF9F5;
  --text-secondary:#C2C0B6;
  --text-muted:#9C9A92;
  --text-dim:#73726C;
  --border-color:#3E3D39;
  --border-light:#343330;
  --border-strong:#52504A;
  --input-bg:#30302E;
  --button-bg:#30302E;
  --button-hover:#3A3935;
  --online:#6DB57C;
  --accent:#D97757;
  --accent-hover:#E38A6C;
  --accent-light:rgba(217,119,87,0.16);
  --ban:#D9644A;
  --shadow-lg:0 8px 24px rgba(0,0,0,0.4);
  --shadow-xl:0 16px 40px rgba(0,0,0,0.5);
  --chat-bg:#262624;
  --chat-header-bg:#1F1E1D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:var(--bg-primary);}
body{font-family:'Roboto',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary);max-width:100%;}
::selection{background:rgba(201,100,66,0.22);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
[hidden]{display:none!important;}

/* HEADER */
.app-header{height:60px;background:rgba(var(--surface-rgb),0.85);backdrop-filter:blur(var(--panel-blur));-webkit-backdrop-filter:blur(var(--panel-blur));display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:1000;border-bottom:1px solid var(--border-color);padding:0 12px;gap:12px;height:var(--hdr-h);}
.header-left{display:flex;align-items:center;gap:12px;min-width:0;}
.header-right{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text-primary);font-size:22px;letter-spacing:-0.5px;font-family:Georgia,serif;}
.logo-icon{color:var(--accent);font-size:26px;}
.icon-btn{width:42px;height:42px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
.profile-btn{width:42px;height:42px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;flex:0 0 auto;}
.profile-btn img{width:100%;height:100%;object-fit:cover;display:none;}
.profile-btn.has-image i{display:none;}
.profile-btn.has-image img{display:block;}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-primary);}
@media(max-width:768px){.app-header{padding:0 6px;gap:6px;}.logo{font-size:18px;}.logo-icon{font-size:22px;}.icon-btn,.profile-btn{width:40px;height:40px;}.fs-toggle-btn,.theme-toggle-btn{display:none;}}

/* ANA YERLEŞİM */
.main-container{display:flex;flex:1;overflow:hidden;margin-top:var(--hdr-h);height:calc(var(--app-h) - var(--hdr-h));position:relative;}
@media(min-width:769px){.main-container{max-width:1100px;margin-left:auto;margin-right:auto;width:100%;}}
@media(max-width:768px){.main-container{flex-direction:column;}}

/* SOHBET */
.chat-container{flex:1;background:var(--bg-primary);display:flex;flex-direction:column;min-width:0;height:100%;position:relative;}
.chat-header{height:60px;min-height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);flex-shrink:0;}
.chat-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.chat-title i{color:var(--accent);}
.messages-area{flex:1;min-height:0;padding:20px 24px 16px;overflow-y:auto;background:var(--bg-primary);}
.chat-input-area{padding:12px 20px 14px;background:var(--bg-secondary);border-top:1px solid var(--border-color);flex:0 0 auto;}
.input-wrapper{display:flex;align-items:flex-end;gap:8px;}
#message-input{flex:1;min-width:0;min-height:46px;max-height:120px;padding:11px 16px;color:var(--text-primary);background:var(--input-bg);border:1px solid var(--border-color);border-radius:24px;font-size:15px;outline:none;resize:none;line-height:1.5;font-family:inherit;}
#message-input:focus{border-color:var(--accent);}
.send-button{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0;}
.send-button:hover{background:var(--accent-hover);}
@media(max-width:768px){.chat-header{height:52px;min-height:52px;padding:0 14px;}.chat-title{font-size:15px;}.messages-area{padding:12px 14px 8px;}.chat-input-area{padding:8px 10px calc(8px + var(--safe-b));}#message-input{font-size:16px;padding:10px 14px;min-height:42px;}.send-button{width:42px;height:42px;}}

/* MESAJLAR */
.message-item{padding:6px 0;position:relative;min-width:0;max-width:100%;word-break:break-word;}
.message-header{display:flex;align-items:flex-start;gap:12px;}
.message-avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-muted);font-size:14px;margin-top:1px;}
.message-avatar img{width:100%;height:100%;object-fit:cover;}
.message-body{min-width:0;flex:1;}
.message-content{padding:0;color:var(--text-primary);font-size:15px;line-height:1.55;}
.message-user{display:inline;margin-right:6px;padding:1px 8px 2px;color:var(--bg-primary);background:var(--text-primary);border-radius:13px;font-size:13px;font-weight:600;cursor:pointer;vertical-align:baseline;}
.message-text{color:var(--text-primary);}
.message-image{display:block;max-width:min(280px,100%);max-height:240px;border-radius:10px;margin-top:6px;cursor:zoom-in;}
.message-video{max-width:min(280px,100%);max-height:220px;border-radius:10px;margin-top:6px;}
.message-audio{max-width:min(240px,100%);height:36px;margin-top:4px;}
.message-item.system{padding:10px 0;color:var(--text-muted);font-size:13px;font-style:italic;}
.message-item.system::before{content:"▸ ";color:var(--accent);}
@media(max-width:768px){
  .message-avatar{flex:0 0 30px;width:30px;height:30px;}
  .message-header{gap:8px;align-items:flex-end;}
  .message-body{flex:0 1 auto;min-width:0;max-width:calc(100% - 50px);}
  .message-content{display:inline-block;background:var(--bg-tertiary);padding:7px 13px 8px;border-radius:18px 18px 18px 6px;font-size:15px;line-height:1.45;max-width:100%;}
  .message-user{display:block;background:none;color:var(--accent);padding:0;margin:0 0 1px;font-size:12.5px;font-weight:700;}
  .message-item.mine .message-header{flex-direction:row-reverse;}
  .message-item.mine .message-avatar{display:none;}
  .message-item.mine .message-user{display:none;}
  .message-item.mine .message-content{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px;}
  .message-item.mine .message-body{margin-left:auto;flex:0 1 auto;}
  .message-item.mine .message-text{color:#fff;}
}

/* GİRİŞ EKRANI */
#login-screen{position:fixed;inset:0;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.login-container{background:var(--bg-secondary);border-radius:20px;padding:40px;width:100%;max-width:420px;border:1px solid var(--border-strong);box-shadow:var(--shadow-xl);box-sizing:border-box;}
.login-title{text-align:center;margin-bottom:28px;color:var(--text-primary);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;font-family:Georgia,serif;}
.login-title i{color:var(--accent);font-size:32px;}
.login-input{width:100%;padding:14px 20px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:12px;color:var(--text-primary);font-size:16px;outline:none;margin-bottom:14px;box-sizing:border-box;}
.login-input:focus{border-color:var(--accent);}
.login-button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;}
.login-button:hover{background:var(--accent-hover);}
.login-info{color:var(--text-muted);font-size:13px;text-align:center;margin-top:14px;}
.error-message{color:var(--ban);margin-top:14px;font-size:14px;display:none;background:var(--ban-bg);padding:12px;border-radius:8px;border:1px solid var(--ban);white-space:pre-line;}
@media(max-width:600px){.login-container{padding:26px 20px;}.login-title{font-size:22px;margin-bottom:20px;}}

/* ÖZEL SOHBET */
.private-modal{position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;background:var(--bg-primary);height:var(--app-h,100%);top:var(--app-top,0px);}
.private-modal.show{display:flex;}
.private-header{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-color);background:var(--bg-secondary);flex-shrink:0;}
.private-title{font-weight:600;color:var(--text-primary);font-size:16px;display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.private-title > i{color:var(--accent);}
.private-title > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.private-actions{display:flex;gap:6px;}
.private-btn{width:40px;height:40px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.private-btn:hover{color:var(--accent);}
.private-messages{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg-primary);min-height:0;display:flex;flex-direction:column;gap:4px;}
.private-input-area{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-color);background:var(--bg-secondary);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;flex-wrap:wrap;position:relative;}
#private-input{flex:1;min-width:0;padding:11px 16px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:24px;color:var(--text-primary);font-size:15px;outline:none;resize:none;max-height:120px;line-height:1.5;}
#private-input:focus{border-color:var(--accent);}
.attach-btn{width:46px;height:46px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mic-btn{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.private-input-area.has-text .mic-btn{display:none;}
.private-input-area:not(.has-text) #privateSendBtn{display:none;}
.attach-menu{position:absolute;bottom:60px;left:16px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:12px;padding:8px;z-index:10;display:none;box-shadow:var(--shadow-lg);min-width:200px;}
.attach-menu.open{display:block;}
.attach-item{padding:12px 16px;display:flex;align-items:center;gap:12px;color:var(--text-primary);cursor:pointer;border-radius:8px;font-size:14px;}
.attach-item:hover{background:var(--bg-hover);color:var(--accent);}
.recording-bar{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--accent-light);border:1px solid var(--accent);border-radius:24px;flex:1;}
.recording-bar.show{display:flex;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:blink 1s infinite;flex-shrink:0;}
@keyframes blink{50%{opacity:.3;}}
.rec-timer{font-family:monospace;font-size:14px;font-weight:700;color:var(--accent);min-width:44px;}
.rec-stop{width:auto;min-width:84px;height:42px;padding:0 14px;border-radius:21px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.rec-stop::after{content:'Bitir';}
.rec-cancel{width:42px;height:42px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-muted);cursor:pointer;}
.private-input-area.recording-active #private-input, .private-input-area.recording-active .mic-btn, .private-input-area.recording-active #privateSendBtn, .private-input-area.recording-active .private-attach-container{display:none!important;}

.pm-msg{display:flex;width:100%;padding:0;margin:0;}
.pm-msg.pm-out{justify-content:flex-end;}
.pm-msg.pm-in{justify-content:flex-start;}
.pm-bubble{position:relative;max-width:78%;min-width:64px;padding:7px 10px 5px;border-radius:14px;box-shadow:0 1px 1px rgba(0,0,0,.08);word-break:break-word;}
.pm-msg.pm-out .pm-bubble{background:var(--accent-light);border-bottom-right-radius:4px;}
.pm-msg.pm-in .pm-bubble{background:var(--bg-tertiary);border-bottom-left-radius:4px;}
.pm-content{font-size:15px;line-height:1.45;white-space:pre-wrap;}
.pm-content:empty{display:none;}
.pm-content .message-image{margin-top:0;max-width:100%;max-height:240px;border-radius:10px;}
.pm-content audio{display:block;width:240px;max-width:100%;height:40px;margin-top:4px;}
.pm-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;}
.pm-time{font-size:11px;color:var(--text-muted);}
.pm-ticks{font-size:12px;color:var(--text-muted);opacity:.85;}
.pm-ticks.read{color:#34B7F1;opacity:1;}
.pm-del{flex:0 0 auto;align-self:center;width:32px;height:32px;margin-right:6px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--ban);font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.pm-system{justify-content:center;margin:6px 0;}
.pm-system-text{font-size:12px;color:var(--text-muted);background:var(--bg-tertiary);padding:4px 12px;border-radius:12px;text-align:center;}
.pm-quote{border-left:3px solid var(--accent);background:rgba(0,0,0,.07);border-radius:8px;padding:4px 8px;margin:0 0 5px;font-size:12.5px;cursor:pointer;}
.pm-quote b{display:block;color:var(--accent);font-size:12px;}
.pm-quote span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pm-rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.pm-rx:empty{display:none;}
.pm-rx .rx{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:12px;padding:1px 7px;font-size:13px;cursor:pointer;}
.pm-rx .rx.mine{border-color:var(--accent);background:var(--accent-light);}
.pm-notes{margin-top:5px;}
.pm-notes .pm-note{font-size:12.5px;margin-top:3px;padding:4px 8px;border-radius:8px;background:rgba(224,168,0,.16);border-left:3px solid #e0a800;}
.pm-more{position:absolute;top:2px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer;}
@media(hover:hover){.pm-bubble:hover .pm-more{display:flex;}}
.pm-swipe-ic{position:absolute;left:8px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;pointer-events:none;z-index:0;}

#pmReplyBar{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-secondary);border-top:1px solid var(--border-color);flex:0 0 auto;width:100%;box-sizing:border-box;}
#pmReplyBar.show{display:flex;}
#pmReplyBar .rb{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;}
#pmReplyBar b{display:block;font-size:12.5px;color:var(--accent);}
#pmReplyBar span{display:block;font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pmReplyBar button{width:32px;height:32px;border-radius:50%;border:0;background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;flex-shrink:0;}

#pmMenu{position:fixed;z-index:3300;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:18px;box-shadow:var(--shadow-xl);padding:6px;min-width:210px;}
.pm-emorow{display:flex;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--border-color);margin-bottom:4px;}
.pm-emorow button{font-size:24px;background:none;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;}
.pm-act{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--text-primary);}
.pm-act.danger{color:#e5484d;}

#pmNote{position:fixed;left:0;right:0;bottom:0;z-index:3300;background:var(--bg-primary);border-top:1px solid var(--border-color);border-radius:20px 20px 0 0;padding:16px;}
#pmNote textarea{width:100%;min-height:70px;border:1px solid var(--border-color);border-radius:12px;padding:10px;font-size:16px;background:var(--bg-tertiary);color:var(--text-primary);resize:none;}
#pmNote .nb{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
#pmNote .nb button{border:0;border-radius:20px;padding:9px 18px;font-size:14px;cursor:pointer;background:var(--bg-tertiary);color:var(--text-primary);}
#pmNote .nb .pri{background:var(--accent);color:#fff;}

/* ARAMA */
#vcall{position:fixed;inset:0;z-index:2147483000;background:#0b141a;color:#fff;display:none;flex-direction:column;}
#vcall.show{display:flex;}
#vcRemote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b141a;}

#vcTop{position:absolute;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 130px 40px 18px;background:linear-gradient(#000a,#0000);z-index:2;}

#vcBar{position:absolute;left:0;right:0;bottom:0;padding:26px 20px max(26px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:18px;background:linear-gradient(#0000,#000b);z-index:4;}
.vcb{width:58px;height:58px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.vcb.end{background:#e53935;width:66px;height:66px;}
.vcb.acc{background:#25d366;width:66px;height:66px;}
#vcMin{position:absolute;top:max(16px,env(safe-area-inset-top));left:12px;width:40px;height:40px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:16px;z-index:5;cursor:pointer;}

.notification-panel{position:absolute;top:calc(100% + 8px);right:0;width:350px;max-width:calc(100vw - 16px);max-height:500px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow-xl);z-index:1500;display:none;flex-direction:column;}
.notification-panel.active{display:flex;}
.notification-header{padding:14px 16px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;background:var(--bg-secondary);}
.notification-list{flex:1;overflow-y:auto;padding:8px;}
.notification-item{padding:12px;border-radius:10px;margin-bottom:6px;background:var(--bg-secondary);cursor:pointer;border-left:4px solid var(--accent);}
.notification-item.unread{background:rgba(201,100,66,.05);}

/* KULLANICI PANELİ */
.users-sidebar{width:280px;min-width:280px;height:100%;background:var(--bg-panel);border-left:1px solid var(--border-color);display:none;flex-direction:column;overflow-y:auto;padding:14px;z-index:5;}
.users-sidebar.active{display:flex;}
.users-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;border-bottom:1px solid var(--border-color);padding-bottom:10px;}
.users-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;background:var(--bg-tertiary);border-radius:12px;}
.users-tab-btn{padding:8px;border:0;border-radius:9px;font-size:11px;font-weight:600;color:var(--text-muted);background:transparent;cursor:pointer;}

.user-list-container{flex:1;overflow-y:auto;}
.user-item{display:flex;align-items:center;padding:10px;border-radius:10px;cursor:pointer;gap:8px;}

.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-name{font-size:14px;font-weight:600;}
.user-unread{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3500;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--bg-elevated);border-radius:16px;width:min(440px,100%);max-height:90vh;overflow-y:auto;}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;background:var(--bg-secondary);}
.modal-body{padding:20px;}
.modal-body input,.modal-body textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border-color);background:var(--input-bg);color:var(--text-primary);margin-bottom:10px;}
.avatar-big{width:100px;height:100px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin:0 auto 12px;border:3px solid var(--accent);cursor:pointer;}

/* TOAST */
#privateMessageToastStack{position:fixed;top:calc(var(--hdr-h) + 12px);right:16px;z-index:4000;display:flex;width:min(360px,calc(100vw - 28px));flex-direction:column;gap:8px;pointer-events:none;}

function normalizeNick(nick) { return nick ? String(nick).normalize('NFKC').toLowerCase().replace(/\u0307/g,'').replace(/ı/g,'i').trim() : ''; }
function secEsc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function secUrl(u){u=String(u==null?'':u).trim();if(!/^(https?:\/\/|blob:|data:(image|audio|video)\/[a-z0-9.+-]+[^,]*;base64,)/i.test(u))return '';return secEsc(u.replace(/['"<>\s\\`]/g,c=>encodeURIComponent(c)));}
function secNick(n){return String(n==null?'':n).replace(/[^\w.\-\sçğıöşüÇĞİÖŞÜ]/g,'').slice(0,40);}
function autoResize(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
function handleEnter(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}
function handlePrivateEnter(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendPrivateMessage();}}
function showLoginError(msg){const e=document.getElementById('loginError');e.textContent=msg;e.style.display='block';}
function generateChatId(a,b){const u=[a,b].sort();return `chat_${u[0]}_${u[1]}`;}

function readBlobAsDataUrl(blob){
  if(!blob)return Promise.reject(new Error('Boş dosya'));
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Okunamadı'));r.readAsDataURL(blob);});
}
async function compressImageForChat(file, wantBlob){
  if(!file||file.size===undefined)throw new Error('Geçersiz resim');
  if(file.size>20*1024*1024)throw new Error('Resim 20 MB sınırını aşıyor');
  let source,objUrl=null;
  try{objUrl=URL.createObjectURL(file);source=objUrl;}catch(e){source=await readBlobAsDataUrl(file);}
  const image=new Image();
  await new Promise((res,rej)=>{image.onload=res;image.onerror=()=>rej(new Error('Resim açılamadı'));image.src=source;});
  if(objUrl){try{URL.revokeObjectURL(objUrl);}catch(e){}}
  const scale=Math.min(1,1280/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
  canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('Resim dönüştürülemedi');
  ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.72));
  if(!blob)throw new Error('Resim sıkıştırılamadı');
  if(wantBlob)return blob;
  return readBlobAsDataUrl(blob);
}
function isVideoFile(f){return !!f&&((f.type||'').toLowerCase().startsWith('video/')||/\.(mp4|m4v|mov|webm|3gp|mkv|avi|ogv)$/i.test(f.name||''));}
function isImageFile(f){if(!f)return false;const n=(f.name||'').toLowerCase(),m=(f.type||'').toLowerCase();return m.startsWith('image/')||/\.(png|jpe?g|gif|bmp|webp|heic|heif|ico)$/i.test(n);}

function updateNotifBadge(){
  notificationCount = notifications.filter(n=>!n.read).length;
  const b=document.getElementById('notifBadge');
  if(!b)return;
  if(notificationCount>0){b.textContent=notificationCount>99?'99+':notificationCount;b.style.display='flex';}
  else{b.style.display='none';}
  if(notificationCount>0)document.title=`(${notificationCount}) ${originalTitle}`;
  else document.title=originalTitle;
}
function addNotification(sender,message,type='private'){
  notifications.unshift({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),sender,message,type,time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),timestamp:Date.now(),read:false});
  updateNotifBadge();
  try{const s=document.getElementById('notificationSound');s.currentTime=0;s.play().catch(()=>{});}catch(e){}
  if(notificationPanelOpen)renderNotifPanel();
  if(notifications.length>100)notifications.pop();
  if(type==='private')showPrivateToast(sender,message);
}
function showPrivateToast(sender,message){
  if(!sender||sender==='System')return;
  let stack=document.getElementById('privateMessageToastStack');
  if(!stack){stack=document.createElement('div');stack.id='privateMessageToastStack';document.body.appendChild(stack);}
  const t=document.createElement('button');
  t.type='button';t.className='private-message-toast';
  t.innerHTML='<span style="display:block;color:var(--accent);font-weight:700;margin-bottom:4px;">'+secEsc(sender)+'</span><span style="display:block;color:var(--text-secondary);font-size:13px;">'+secEsc(message)+'</span>';
  t.onclick=()=>{t.remove();openPrivateChat(sender);};
  stack.appendChild(t);
  while(stack.children.length>3)stack.firstElementChild.remove();
  setTimeout(()=>t.remove(),7000);
}
function renderNotifPanel(){
  const c=document.getElementById('notifList');
  if(!notifications.length){c.innerHTML='<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">Henüz bildirim yok.</div>';return;}
  c.innerHTML=notifications.slice(0,20).map(n=>`
    <div class="notification-item ${n.read?'':'unread'}" onclick="handleNotifClick('${n.id}')">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <strong>${secEsc(n.sender)}</strong><small>${n.time}</small>
      </div>
      <div>${secEsc(n.message)}</div>
    </div>
  `).join('');
}
function handleNotifClick(id){
  const n=notifications.find(x=>x.id===id);if(!n)return;
  n.read=true;updateNotifBadge();renderNotifPanel();closeNotifications();
  if(n.type==='private')openPrivateChat(n.sender);
}
function toggleNotifications(e){
  if(e)e.stopPropagation();
  const p=document.getElementById('notifPanel');
  if(p.classList.contains('active')){closeNotifications();return;}
  document.querySelectorAll('.users-sidebar.active').forEach(el=>el.classList.remove('active'));
  p.classList.add('active');notificationPanelOpen=true;renderNotifPanel();
}
function closeNotifications(){
  const p=document.getElementById('notifPanel');
  p.classList.remove('active');notificationPanelOpen=false;
  notifications.forEach(n=>n.read=true);updateNotifBadge();
}

function getTheme(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
function applyTheme(t,save){
  document.documentElement.setAttribute('data-theme',t);
  if(save)try{localStorage.setItem('cetcety-theme',t);}catch(e){}
  document.querySelectorAll('[data-theme-icon]').forEach(i=>{i.className='fas '+(t==='dark'?'fa-sun':'fa-moon');});
}
function toggleTheme(){applyTheme(getTheme()==='dark'?'light':'dark',true);}
applyTheme(getTheme(),false);

function toggleFullscreen(){
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{const de=document.documentElement;const r=de.requestFullscreen||de.webkitRequestFullscreen;if(r){const p=r.call(de);if(p&&p.catch)p.catch(()=>{});}}
  }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{
  const b=document.getElementById('fsBtn');if(!b)return;
  const on=!!(document.fullscreenElement||document.webkitFullscreenElement);
  const i=b.querySelector('i');if(i)i.className='fas '+(on?'fa-compress':'fa-expand');
});

function initializeFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    database=firebase.database();
    window.database=database;
    try{database.setPersistenceEnabled(false);}catch(e){}
    startPrivateWipeService();
    database.ref('.info/connected').on('value',snap=>{
      if(snap.val()===true){
        isFirebaseConnected=true;
        usersRef=database.ref('onlineUsers');
        messagesRef=database.ref('messages');
        privateChatsRef=database.ref('privateChats');
        privateContactsRef=database.ref('privateContacts');
        typingRef=database.ref('typing');
        profilesRef=database.ref('profiles');
        setupGlobalListeners();
        if(currentUser){loadUserProfile(currentUser.name);}
      }
    });
  }catch(err){console.error('Firebase init:',err);}
}

function setupGlobalListeners(){
  usersRef.on('value',snap=>{cachedOnlineUsers=snap.val()||{};updateOnlineCounts();if(currentUserListTab==='online')renderOnlineUsers();});
  messagesRef.limitToLast(MESSAGE_LIMIT).on('child_added',snap=>{
    const msg={id:snap.key,...snap.val()};
    cachedMessages.push(msg);
    if(cachedMessages.length>MESSAGE_LIMIT)cachedMessages.shift();
    if(!document.getElementById(`msg_${snap.key}`))appendMessageUI(msg);
  });
}

function updateOnlineCounts(){
  const now=Date.now();
  let n=0;
  Object.values(cachedOnlineUsers).forEach(u=>{if(u&&u.isOnline!==false&&now-(u.lastSeen||0)<ONLINE_THRESHOLD)n++;});
  const a=document.getElementById('onlineCount');if(a)a.textContent=n;
  const b=document.getElementById('chatOnlineCount');if(b)b.textContent=n+' çevrimiçi';
}

async function login(){
  const nickInput=document.getElementById('login-nick');
  const rawNick=nickInput.value.trim();
  const btn=document.getElementById('loginBtn');
  document.getElementById('loginError').style.display='none';
  if(rawNick.length<2||rawNick.length>20){showLoginError('Kullanıcı adı 2-20 karakter olmalı');return;}
  if(!/^[\p{L}\p{N}_ -]+$/u.test(rawNick)){showLoginError('Sadece harf, rakam, boşluk, _ ve - kullanılabilir');return;}
  if(!isFirebaseConnected){showLoginError('Sunucuya bağlanılamadı, biraz sonra tekrar deneyin');return;}
  btn.disabled=true;btn.innerHTML='<span class="loading"></span> Giriş...';
  try{
    const snap=await usersRef.once('value');
    const all=snap.val()||{};
    const conflict=Object.entries(all).find(([k,u])=>normalizeNick(k)===normalizeNick(rawNick)&&k!==rawNick&&u&&u.isOnline!==false&&Date.now()-(u.lastSeen||0)<ONLINE_THRESHOLD);
    if(conflict){showLoginError(`"${conflict[0]}" nicki şu an kullanımda`);btn.disabled=false;btn.innerHTML='GİRİŞ YAP';return;}
    await usersRef.child(rawNick).set({name:rawNick,lastSeen:Date.now(),isOnline:true,joinedAt:Date.now()});
    usersRef.child(rawNick).onDisconnect().update({isOnline:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
    currentUser={name:rawNick};
    window.currentUser=currentUser;
    privateAlertedMessageIds.clear();
    try{await sweepPrivateWipes();}catch(e){}
    armPrivateWipe(rawNick);
    document.getElementById('login-screen').style.display='none';
    addSystemMessage(`🎉 Hoş geldin, ${rawNick}!`);
    loadUserProfile(rawNick);
    loadPrivateContacts();
    setInterval(()=>{if(currentUser)usersRef.child(currentUser.name).update({lastSeen:Date.now(),isOnline:true});},PING_INTERVAL);
  }catch(err){
    showLoginError('Giriş başarısız: '+(err.message||'bilinmeyen hata'));
  }finally{btn.disabled=false;btn.innerHTML='GİRİŞ YAP';}
}

function appendMessageUI(msg){
  const c=document.getElementById('messages');if(!c||!msg)return;
  const wasAtBottom=c.scrollHeight-c.scrollTop-c.clientHeight<80;
  const d=document.createElement('div');
  d.className='message-item'+(currentUser&&msg.sender===currentUser.name?' mine':'');
  d.id='msg_'+msg.id;
  const av=secUrl(msg.avatar);
  let content=secEsc(msg.text).replace(/\n/g,'<br>');
  if(secUrl(msg.image))content+=`<img src="${secUrl(msg.image)}" class="message-image" onclick="showImage(this.src)">`;
  if(secUrl(msg.video))content+=`<video src="${secUrl(msg.video)}" controls class="message-video"></video>`;
  if(secUrl(msg.audio))content+=`<audio src="${secUrl(msg.audio)}" controls class="message-audio"></audio>`;
  d.innerHTML=`
    <div class="message-header">
      <div class="message-avatar">${av?`<img src="${av}">`:'<i class="far fa-user"></i>'}</div>
      <div class="message-body">
        <div class="message-content">
          <span class="message-user" onclick="openPrivateChat('${secNick(msg.sender)}')">${secEsc(msg.sender)}</span>
          <span class="message-text">${content}</span>
        </div>
      </div>
    </div>`;
  c.appendChild(d);
  while(c.children.length>MESSAGE_LIMIT)c.firstElementChild.remove();
  if(wasAtBottom)c.scrollTop=c.scrollHeight;
}

function renderOnlineUsers(){

function renderPrivateContacts(){
  const c=document.getElementById('userList');if(!c)return;
  const now=Date.now();
  const list=[...new Set(privateContacts)].filter(n=>n!==currentUser?.name).map(nick=>{
      const u=cachedOnlineUsers[nick]||{};
      const isOnline=u.isOnline!==false&&now-(u.lastSeen||0)<ONLINE_THRESHOLD;
      const unread=privateUnreadCounts[nick]||0;
      return {nick,unread,isOnline};
    }).sort((a,b)=>b.unread-a.unread||Number(b.isOnline)-Number(a.isOnline)).map(x=>`

async function openPrivateChat(nick){
  if(!nick||nick===currentUser?.name||!isFirebaseConnected)return;
  const prev=privateChatWith;
  if(prev&&currentPrivateChatId&&privateChatsRef){
    privateChatsRef.child(currentPrivateChatId).off();
    if(typingRef)typingRef.child(currentPrivateChatId).off();
  }
  stopPrivateContactListener(nick);
  privateChatWith=nick;
  currentPrivateChatId=generateChatId(currentUser.name,nick);
  document.getElementById('privateTitle').innerHTML=`<i class="fas fa-lock"></i><span>${secEsc(nick)}</span>`;
  document.getElementById('privateModal').classList.add('show');
  privateUnreadCounts[nick]=0;
  if(currentUserListTab==='private')renderPrivateContacts();
  rememberPrivateContact(nick,false);
  if(prev&&prev!==nick)startPrivateContactListener(prev);
  loadPrivateMessages();
  listenForTyping();
}

function loadPrivateMessages(){
  if(!currentPrivateChatId||!privateChatsRef)return;
  const chatId=currentPrivateChatId;
  const chatRef=privateChatsRef.child(chatId);
  const container=document.getElementById('privateMessages');
  container.innerHTML='<div style="margin:auto;color:var(--text-muted);">Yükleniyor...</div>';

  chatRef.limitToLast(PRIVATE_MESSAGE_LIMIT).once('value').then(snap=>{
    if(currentPrivateChatId!==chatId)return;
    const messages=snap.val();
    const existing=new Set(Object.keys(messages||{}));
    updatePrivateMessages(messages);
    chatRef.off();
    chatRef.on('child_removed',s=>{
      if(currentPrivateChatId!==chatId)return;
      const el=document.getElementById(`private_msg_${s.key}`);if(el)el.remove();
    });
    chatRef.on('child_changed',s=>{
      if(currentPrivateChatId!==chatId)return;
      const m=s.val();
      if(m&&window.pmRefresh){try{window.pmRefresh(s.key,m);}catch(e){}}
    });
    chatRef.on('child_added',s=>{
      if(currentPrivateChatId!==chatId||existing.has(s.key))return;
      existing.add(s.key);
      const m=s.val();if(!m)return;
      if(!document.getElementById(`private_msg_${s.key}`)){
        if(m.sender!==currentUser.name&&!m.isRead){
          chatRef.child(s.key).update({isRead:true,readAt:Date.now()});m.isRead=true;
        }
        appendPrivateMessageUI({id:s.key,...m});
        if(m.sender!==currentUser.name)notifyIncomingPrivateMessage(privateChatWith,m,s.key);
      }
    });
  }).catch(err=>{
    container.innerHTML='<div style="margin:auto;color:var(--ban);">Mesajlar yüklenemedi</div>';
  });
}

function updatePrivateMessages(messages){
  const c=document.getElementById('privateMessages');
  if(!messages){c.innerHTML='<div style="margin:auto;color:var(--text-muted);">Henüz mesaj yok.</div>';return;}
  const arr=Object.entries(messages).map(([id,v])=>({id,...v})).sort((a,b)=>a.timestamp-b.timestamp);
  c.innerHTML='';
  const now=Date.now();const reads=[];
  arr.forEach(m=>{
    if(m.sender!==currentUser.name&&!m.isRead){
      reads.push(privateChatsRef.child(currentPrivateChatId).child(m.id).update({isRead:true,readAt:now}));
      m.isRead=true;
    }
    appendPrivateMessageUI(m);
  });
}

function appendPrivateMessageUI(m){
  const c=document.getElementById('privateMessages');
  if(!c||document.getElementById(`private_msg_${m.id}`))return;
  const isMine=!!(currentUser&&m.sender===currentUser.name);
  const isSystem=m.sender==='System'||m.isNotification;
  const d=document.createElement('div');
  d.id=`private_msg_${m.id}`;
  if(isSystem){
    d.className='pm-msg pm-system';
    d.innerHTML=`<div class="pm-system-text">${m.text||''}</div>`;
    c.appendChild(d);c.scrollTop=c.scrollHeight;return;
  }
  d.className=`pm-msg ${isMine?'pm-out':'pm-in'}`;
  let delBtn=isMine?`<button type="button" class="pm-del" onclick="deletePrivateMessage('${secNick(m.id)}','${currentPrivateChatId}')"><i class="fas fa-trash-alt"></i></button>`:'';
  const hasMedia=!!(m.image||m.audio||m.video);
  let content=hasMedia?'':secEsc(m.text||'').replace(/\n/g,'<br>');
  if(secUrl(m.image))content+=`<img src="${secUrl(m.image)}" class="message-image" onclick="showImage(this.src)">`;
  else if(secUrl(m.audio))content+=`<audio src="${secUrl(m.audio)}" controls></audio>`;
  const readStatus=isMine?`<span class="pm-ticks${m.isRead?' read':''}"><i class="fas fa-check-double"></i></span>`:'';
  d.innerHTML=`
    ${delBtn}
    <div class="pm-bubble">
      <div class="pm-content">${content}</div>
      <div class="pm-meta"><span class="pm-time">${m.time||'--:--'}</span>${readStatus}</div>
    </div>`;
  if(window.pmDecorate)window.pmDecorate(d,m);
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function privateContactsStorageKey(){return currentUser?`cetcety_pc_${currentUser.name}`:null;}
function savePrivateContactsLocally(){const k=privateContactsStorageKey();if(!k)return;try{localStorage.setItem(k,JSON.stringify(privateContacts));}catch(e){}}
function addPrivateContactToList(nick){
  if(!currentUser||!nick||nick===currentUser.name)return false;
  if(privateContacts.includes(nick))return false;
  privateContacts.unshift(nick);savePrivateContactsLocally();
  if(currentUserListTab==='private')renderPrivateContacts();
  return true;
}
function loadPrivateContacts(){
  if(!currentUser)return;
  privateContacts=[];
  try{const saved=JSON.parse(localStorage.getItem(privateContactsStorageKey())||'[]');if(Array.isArray(saved))privateContacts=[...new Set(saved.filter(n=>n&&n!==currentUser.name))];}catch(e){}
  if(privateContactsRef){
    const ref=privateContactsRef.child(currentUser.name);
    if(privateContactsListListener)ref.off('child_added',privateContactsListListener);
    privateContactsListListener=s=>{
      if(!s.key||!s.val()||s.key===currentUser.name)return;
      addPrivateContactToList(s.key);
      if(privateChatWith!==s.key)startPrivateContactListener(s.key);
    };
    ref.on('child_added',privateContactsListListener,()=>{});
  }
  privateContacts.forEach(startPrivateContactListener);
  if(currentUserListTab==='private')renderPrivateContacts();
}
async function rememberPrivateContact(nick,addToOther){
  if(!currentUser||!nick||nick===currentUser.name)return;
  addPrivateContactToList(nick);
  if(!privateContactsRef)return;
  const ts=Date.now();
  const jobs=[privateContactsRef.child(currentUser.name).child(nick).update({createdAt:ts})];
  if(addToOther)jobs.push(privateContactsRef.child(nick).child(currentUser.name).update({createdAt:ts}));
  await Promise.allSettled(jobs);
}
async function notifyIncomingPrivateMessage(sender,msg,msgId){
  if(!currentUser||!msg||!msgId||msg.sender===currentUser.name||msg.isNotification)return;
  const alertId=`${generateChatId(currentUser.name,sender)}/${msgId}`;
  if(privateAlertedMessageIds.has(alertId))return;
  privateAlertedMessageIds.add(alertId);
  if(privateChatWith!==sender)privateUnreadCounts[sender]=(privateUnreadCounts[sender]||0)+1;
  addNotification(sender,msg.text||'Yeni mesaj','private');
  if(currentUserListTab==='private')renderPrivateContacts();
}
function startPrivateContactListener(nick){
  if(!currentUser||!privateChatsRef||!nick||nick===currentUser.name||nick===privateChatWith||privateContactListeners[nick])return;
  const chatId=generateChatId(currentUser.name,nick);
  const q=privateChatsRef.child(chatId).limitToLast(1);
  const entry={q,l:null};privateContactListeners[nick]=entry;
  q.once('value').then(s=>{
    if(privateContactListeners[nick]!==entry||privateChatWith===nick)return;
    const initial=new Set(Object.keys(s.val()||{}));
    entry.l=ms=>{
      if(initial.has(ms.key)){initial.delete(ms.key);return;}
      const m=ms.val();if(m)notifyIncomingPrivateMessage(nick,m,ms.key);
    };
    q.on('child_added',entry.l);
  }).catch(()=>{delete privateContactListeners[nick];});
}
function stopPrivateContactListener(nick){
  const e=privateContactListeners[nick];if(!e)return;
  if(e.l)e.q.off('child_added',e.l);
  delete privateContactListeners[nick];
}

  }
}

async function startAudioRecording(){
  if(!privateChatWith)return;
  if(isAudioRecording){stopAudioRecording();return;}
  if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){addSystemMessage('❌ Ses kaydı desteklenmiyor');return;}
  try{
    audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
    try{mediaRecorderAudio=new MediaRecorder(audioStream);}catch(e){mediaRecorderAudio=new MediaRecorder(audioStream);}
    audioChunks=[];audioRecordingSeconds=0;
    document.getElementById('privateInputArea').classList.add('recording-active');
    document.getElementById('recordingBar').style.display='flex';
    const timer=document.getElementById('recTimer');timer.textContent='0:00';
    if(audioRecordingInterval)clearInterval(audioRecordingInterval);
    audioRecordingInterval=setInterval(()=>{
      audioRecordingSeconds++;
      const m=Math.floor(audioRecordingSeconds/60),s=audioRecordingSeconds%60;
      timer.textContent=`${m}:${String(s).padStart(2,'0')}`;
    },1000);
    mediaRecorderAudio.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data);};
    mediaRecorderAudio.onstop=async()=>{
      const type=mediaRecorderAudio.mimeType||audioChunks[0]?.type||'audio/webm';
      const blob=new Blob(audioChunks,{type});
      try{
        if(blob.size>0)await sendPrivateAttachment({audio:await readBlobAsDataUrl(blob)},'🎤 Sesli mesaj');
      }catch(err){addSystemMessage('❌ '+err.message);}
      finally{
        if(audioStream)audioStream.getTracks().forEach(t=>t.stop());
        audioStream=null;isAudioRecording=false;
        document.getElementById('recordingBar').style.display='none';
        document.getElementById('privateInputArea').classList.remove('recording-active');
        if(audioRecordingInterval){clearInterval(audioRecordingInterval);audioRecordingInterval=null;}
      }
    };
    mediaRecorderAudio.start(250);
    isAudioRecording=true;
    setTimeout(()=>{if(isAudioRecording)stopAudioRecording();},60000);
  }catch(err){addSystemMessage('❌ Mikrofon açılamadı');if(audioStream)audioStream.getTracks().forEach(t=>t.stop());audioStream=null;}
}
function stopAudioRecording(){if(mediaRecorderAudio&&mediaRecorderAudio.state!=='inactive')mediaRecorderAudio.stop();}
function cancelAudioRecording(){
  if(mediaRecorderAudio&&mediaRecorderAudio.state!=='inactive'){mediaRecorderAudio.onstop=null;mediaRecorderAudio.stop();}
  if(audioStream){audioStream.getTracks().forEach(t=>t.stop());audioStream=null;}
  isAudioRecording=false;
  document.getElementById('recordingBar').style.display='none';
  document.getElementById('privateInputArea').classList.remove('recording-active');
  if(audioRecordingInterval){clearInterval(audioRecordingInterval);audioRecordingInterval=null;}
}

const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}],iceCandidatePoolSize:2};
const RING_MS=45000;
let S=null,inboxRef=null,inboxFor=null,ringTimer=null,ui=null,incoming=null;

function buildVC(){
  if(ui)return ui;
  ui={root:document.getElementById('vcall'),remote:document.getElementById('vcRemote'),local:document.getElementById('vcLocal'),name:document.getElementById('vcName'),st:document.getElementById('vcSt'),bar:document.getElementById('vcBar'),avatar:document.getElementById('vcAvatar')};
  return ui;
}
function vcBtn(cls,icon,title,fn){const b=document.createElement('button');b.type='button';b.className='vcb '+cls;b.title=title;b.innerHTML=`<i class="fas ${icon}"></i>`;b.onclick=fn;return b;}
function vcShow(peer,status){
  buildVC();ui.name.textContent=peer;ui.st.textContent=status||'';
  ui.avatar.textContent=(peer||'?').charAt(0).toUpperCase();
  ui.root.style.removeProperty('display');ui.root.classList.add('show');
}
function vcBarSet(kind){
  ui.bar.innerHTML='';
  if(kind==='incoming'){
    ui.bar.appendChild(vcBtn('end','fa-phone-slash','Reddet',declineCall));
    ui.bar.appendChild(vcBtn('acc','fa-phone','Cevapla',acceptCall));
  } else {
    ui.bar.appendChild(vcBtn('','fa-microphone','Mikrofon',()=>{if(S&&S.local)S.local.getAudioTracks().forEach(t=>t.enabled=!t.enabled);}));
    ui.bar.appendChild(vcBtn('end','fa-phone-slash','Kapat',()=>endCall('Arama bitti')));
  }
}
async function getMedia(audioOnly){
  if(audioOnly)return await navigator.mediaDevices.getUserMedia({audio:true,video:false});
  return await navigator.mediaDevices.getUserMedia({audio:true,video:{width:320,height:240}});
}
function makePC(stream){
  const pc=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  const rs=new MediaStream();
  pc.ontrack=e=>{
    if(e.streams&&e.streams[0])ui.remote.srcObject=e.streams[0];
    else{rs.addTrack(e.track);ui.remote.srcObject=rs;}
    ui.remote.play&&ui.remote.play().catch(()=>{});
  };
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==='connected'&&S&&!S.connectedAt){S.connectedAt=Date.now();clearTimeout(ringTimer);stopRing();ui.st.textContent='Bağlandı';}
    else if(pc.connectionState==='failed')endCall('Bağlantı koptu');
  };
  return pc;
}
function watch(ref,ev,fn){ref.on(ev,fn);S.refs.push([ref,ev,fn]);}
function listenCommon(){
  const base=database.ref('calls/'+S.id);
  const otherCand=S.role==='caller'?'calleeCand':'callerCand';
  watch(base.child(otherCand),'child_added',sn=>{const c=sn.val();if(c&&S&&S.pc)S.pc.addIceCandidate(c).catch(()=>{});});
  watch(base.child('state'),'value',sn=>{const v=sn.val();if(v==='declined')endCall('Reddedildi');else if(v==='ended')endCall('Bitti');});
}
function wireIce(path){S.pc.onicecandidate=e=>{if(e.candidate&&S)database.ref('calls/'+S.id+'/'+path).push(e.candidate.toJSON());};}

async function startVideoCall(audioArg){
  if(!database||!currentUser||!privateChatWith||S)return;
  if(!window.RTCPeerConnection||!navigator.mediaDevices){alert('Desteklenmiyor');return;}
  const audioOnly=audioArg===true;
  const id=database.ref('calls').push().key;
  S={id,peer:privateChatWith,role:'caller',refs:[],audio:audioOnly};
  buildVC();vcShow(privateChatWith,audioOnly?'Sesli aranıyor...':'Aranıyor...');vcBarSet('call');
  try{
    S.local=await getMedia(audioOnly);
    ui.local.srcObject=S.local;ui.local.style.display=audioOnly?'none':'';
    S.pc=makePC(S.local);wireIce('callerCand');
    const offer=await S.pc.createOffer();await S.pc.setLocalDescription(offer);
    const base=database.ref('calls/'+id);
    await base.set({caller:currentUser.name,callee:privateChatWith,mode:audioOnly?'audio':'video',state:'ringing',ts:Date.now(),offer:{type:offer.type,sdp:offer.sdp}});
    base.child('state').onDisconnect().set('ended');
    await database.ref('callInbox/'+normalizeNick(privateChatWith)).set({id,from:currentUser.name,ts:Date.now()});
    database.ref('callInbox/'+normalizeNick(privateChatWith)).onDisconnect().remove();
    listenCommon();
    watch(base.child('answer'),'value',sn=>{
      const a=sn.val();if(a&&S&&S.pc&&!S.pc.remoteDescription)S.pc.setRemoteDescription(a).catch(()=>{});
    });
    startRing();
    ringTimer=setTimeout(()=>{if(S&&!S.connectedAt)endCall('Cevap yok');},RING_MS);
  }catch(e){endCall(e.message);}
}
async function startVoiceCall(){return startVideoCall(true);}

function listenInbox(){
  if(!database||!currentUser)return;
  if(inboxFor===normalizeNick(currentUser.name))return;
  if(inboxRef){try{inboxRef.off();}catch(e){}}
  inboxFor=normalizeNick(currentUser.name);
  inboxRef=database.ref('callInbox/'+inboxFor);
  inboxRef.on('value',async sn=>{
    const v=sn.val();if(!v||!v.id)return;
    try{
      if(S||incoming){database.ref('calls/'+v.id+'/state').set('busy');inboxRef.remove();return;}
      const c=(await database.ref('calls/'+v.id).once('value')).val();
      if(!c||c.state!=='ringing'){inboxRef.remove();return;}
      incoming={id:v.id,from:c.caller,offer:c.offer};
      S={id:v.id,peer:c.caller,role:'callee',refs:[],ringing:true,audio:c.mode==='audio'};
      vcShow(c.caller,'Gelen arama...');vcBarSet('incoming');startRing();
      watch(database.ref('calls/'+v.id+'/state'),'value',s2=>{if(S&&S.ringing&&s2.val()!=='ringing')endCall('Bitti');});
    }catch(e){}
  });
}
async function acceptCall(){
  if(!S||!incoming)return;
  const inc=incoming;S.ringing=false;stopRing();ui.st.textContent='Bağlanıyor...';vcBarSet('call');
  try{
    S.local=await getMedia(S.audio);
    ui.local.srcObject=S.local;
    S.pc=makePC(S.local);wireIce('calleeCand');
    await S.pc.setRemoteDescription(inc.offer);
    const ans=await S.pc.createAnswer();await S.pc.setLocalDescription(ans);
    const base=database.ref('calls/'+S.id);
    listenCommon();
    await base.child('answer').set({type:ans.type,sdp:ans.sdp});
    await base.child('state').set('accepted');
    base.child('state').onDisconnect().set('ended');
    inboxRef.remove();
  }catch(e){endCall(e.message);}
}
function declineCall(){if(S){database.ref('calls/'+S.id+'/state').set('declined');inboxRef&&inboxRef.remove();endCall('',true);}}

function endCall(msg){
  const s=S;if(!s){incoming=null;vcHide();return;}
  S=null;incoming=null;clearTimeout(ringTimer);stopRing();
  s.refs.forEach(r=>r[0].off(r[1],r[2]));
  s.local&&s.local.getTracks().forEach(t=>t.stop());
  s.pc&&s.pc.close();
  if(database&&!msg)database.ref('calls/'+s.id+'/state').set('ended');
  vcHide();
}
function vcHide(){if(ui){ui.root.style.display='none';ui.root.classList.remove('show');ui.remote.srcObject=null;ui.local.srcObject=null;}}
let actx=null,ringIv=null;
function startRing(){
  stopRing();
  const beep=()=>{
    try{const AC=window.AudioContext||window.webkitAudioContext;actx=actx||new AC();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=425;g.gain.value=.07;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+1);}catch(e){}
  };
  beep();ringIv=setInterval(beep,2400);
}
function stopRing(){if(ringIv){clearInterval(ringIv);ringIv=null;}}

document.addEventListener('click',e=>{
  if(!e.target.closest('.notification-panel')&&!e.target.closest('#notifBtn'))closeNotifications();
  if(!e.target.closest('.users-sidebar')&&!e.target.closest('#usersBtn'))document.getElementById('usersSidebar').classList.remove('active');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNotifications();closeProfile();document.getElementById('usersSidebar').classList.remove('active');}});
document.getElementById('private-input').addEventListener('input',()=>{if(privateChatWith&&typingRef)emitTyping();});

(function(){
  const vv=window.visualViewport;
  if(!vv)return;
  function sync(){const h=Math.round(vv.height),t=Math.round(vv.offsetTop);document.documentElement.style.setProperty('--app-h',h+'px');document.documentElement.style.setProperty('--app-top',t+'px');window.scrollTo(0,0);}
  sync();vv.addEventListener('resize',sync,{passive:true});vv.addEventListener('scroll',sync,{passive:true});
})();

window.addEventListener('load',()=>{
  originalTitle=document.title;
  initializeFirebase();
  document.getElementById('login-nick').focus();
  setInterval(()=>{if(currentUser&&isFirebaseConnected)listenInbox();},2000);
});
