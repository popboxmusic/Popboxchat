<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>
(function(){try{var t=localStorage.getItem('cetcety-theme');if(t!=='dark'&&t!=='light'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<meta name="theme-color" content="#C96442">
<title>Laafle – Türkçe Canlı Sohbet</title>
<meta name="description" content="Laafle: Türkçe canlı sohbet, özel mesajlaşma, görüntülü ve sesli arama.">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">

<style>
/* ============ TEMEL DEĞİŞKENLER ============ */
:root{
  color-scheme: light;
  --surface-rgb:250,249,245;
  --ink-rgb:31,30,29;
  --shadow-rgb:31,30,29;
  --bg-primary:#FAF9F5;
  --bg-secondary:#F5F4ED;
  --bg-tertiary:#F0EEE6;
  --bg-hover:#EAE7DC;
  --bg-elevated:#FFFFFF;
  --bg-panel:#F5F4ED;
  --text-primary:#1F1E1D;
  --text-secondary:#3D3D3A;
  --text-muted:#73726C;
  --text-dim:#9C9A92;
  --border-color:#E6E3D8;
  --border-light:#ECE9DF;
  --border-strong:#D1CEC0;
  --input-bg:#FFFFFF;
  --input-focus-bg:#FFFFFF;
  --button-bg:#F0EEE6;
  --button-hover:#E8E5DA;
  --online:#4F8A5B;
  --idle:#B8893A;
  --accent:#C96442;
  --accent-hover:#B5573A;
  --accent-light:rgba(201,100,66,0.12);
  --ban:#B5452F;
  --ban-bg:rgba(181,69,47,0.08);
  --shadow-sm:0 1px 2px rgba(var(--shadow-rgb),0.06);
  --shadow:0 2px 8px rgba(var(--shadow-rgb),0.08);
  --shadow-lg:0 8px 24px rgba(var(--shadow-rgb),0.10);
  --shadow-xl:0 16px 40px rgba(var(--shadow-rgb),0.14);
  --glass-bg:rgba(var(--surface-rgb),0.92);
  --glass-border:rgba(var(--ink-rgb),0.08);
  --chat-bg:#FAF9F5;
  --chat-header-bg:#F5F4ED;
  --panel-blur:12px;
  --app-h:100vh;
  --app-top:0px;
  --hdr-h:60px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@supports (height:100dvh){:root{--app-h:100dvh;}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-rgb:38,38,36;
  --ink-rgb:250,249,245;
  --shadow-rgb:0,0,0;
  --bg-primary:#262624;
  --bg-secondary:#1F1E1D;
  --bg-tertiary:#30302E;
  --bg-hover:#3A3935;
  --bg-elevated:#30302E;
  --bg-panel:#1F1E1D;
  --text-primary:#FAF9F5;
  --text-secondary:#C2C0B6;
  --text-muted:#9C9A92;
  --text-dim:#73726C;
  --border-color:#3E3D39;
  --border-light:#343330;
  --border-strong:#52504A;
  --input-bg:#30302E;
  --input-focus-bg:#353432;
  --button-bg:#30302E;
  --button-hover:#3A3935;
  --online:#6DB57C;
  --idle:#D4A24C;
  --accent:#D97757;
  --accent-hover:#E38A6C;
  --accent-light:rgba(217,119,87,0.16);
  --ban:#D9644A;
  --ban-bg:rgba(217,100,74,0.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow:0 2px 8px rgba(0,0,0,0.35);
  --shadow-lg:0 8px 24px rgba(0,0,0,0.4);
  --shadow-xl:0 16px 40px rgba(0,0,0,0.5);
  --glass-bg:rgba(38,38,36,0.92);
  --glass-border:rgba(250,249,245,0.08);
  --chat-bg:#262624;
  --chat-header-bg:#1F1E1D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;background:var(--bg-primary);}
body{font-family:'Roboto',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif;color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary);max-width:100%;overflow-x:hidden;}
::selection{background:rgba(201,100,66,0.22);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
[hidden]{display:none!important;}

/* ============ HEADER ============ */
.app-header{height:60px;background:rgba(var(--surface-rgb),0.85);backdrop-filter:blur(var(--panel-blur));-webkit-backdrop-filter:blur(var(--panel-blur));display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:1000;border-bottom:1px solid var(--border-color);padding:0 12px;gap:12px;height:var(--hdr-h);}
.header-left{display:flex;align-items:center;gap:12px;min-width:0;}
.header-right{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text-primary);font-size:22px;letter-spacing:-0.5px;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;}
.logo-icon{color:var(--accent);font-size:26px;}
.icon-btn{width:42px;height:42px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-secondary);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s ease;position:relative;flex:0 0 auto;}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
.icon-btn.active{background:var(--accent-light);color:var(--accent);border-color:transparent;}
.icon-btn::after{content:attr(title);position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);background:var(--text-primary);color:var(--bg-primary);padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap;display:none;z-index:2000;font-weight:500;pointer-events:none;}
.icon-btn:hover::after{display:block;}
.profile-btn{width:42px;height:42px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;flex:0 0 auto;}
.profile-btn:hover{border-color:var(--accent);}
.profile-btn img{width:100%;height:100%;object-fit:cover;display:none;}
.profile-btn.has-image i{display:none;}
.profile-btn.has-image img{display:block;}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg-primary);}
@media(max-width:768px){
  .app-header{padding:0 6px;gap:6px;}
  .logo{font-size:18px;}
  .logo-icon{font-size:22px;}
  .icon-btn,.profile-btn{width:40px;height:40px;font-size:16px;}
  .fs-toggle-btn,.theme-toggle-btn{display:none;}
}

/* ============ ANA YERLEŞİM ============ */
.main-container{display:flex;flex:1;overflow:hidden;margin-top:var(--hdr-h);height:calc(var(--app-h) - var(--hdr-h));position:relative;}
@media(min-width:769px){
  .main-container{max-width:1100px;margin-left:auto;margin-right:auto;width:100%;}
}
@media(max-width:768px){
  .main-container{flex-direction:column;}
}

/* ============ SOHBET ============ */
.chat-container{flex:1;background:var(--bg-primary);display:flex;flex-direction:column;min-width:0;height:100%;position:relative;}
.chat-header{height:60px;min-height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg-secondary);border-bottom:1px solid var(--border-color);flex-shrink:0;}
.chat-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;}
.chat-title i{color:var(--accent);}
.chat-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.messages-area{flex:1;min-height:0;padding:20px 24px 16px;overflow-y:auto;background:var(--bg-primary);overflow-x:hidden;}
.messages-area::-webkit-scrollbar{width:8px;}
.messages-area::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
.messages-area::-webkit-scrollbar-track{background:transparent;}
.chat-input-area{padding:12px 20px 14px;background:var(--bg-secondary);border-top:1px solid var(--border-color);flex:0 0 auto;}
.input-wrapper{display:flex;align-items:flex-end;gap:8px;}
#message-input{flex:1;min-width:0;min-height:46px;max-height:120px;padding:11px 16px;color:var(--text-primary);background:var(--input-bg);border:1px solid var(--border-color);border-radius:24px;font-size:15px;outline:none;resize:none;line-height:1.5;font-family:inherit;transition:all .15s;}
#message-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light);}
#message-input::placeholder{color:var(--text-muted);}
.send-button{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all .15s;flex-shrink:0;}
.send-button:hover{background:var(--accent-hover);transform:scale(1.05);}
.send-button:disabled{opacity:.5;cursor:not-allowed;transform:none;}
@media(max-width:768px){
  .chat-header{height:52px;min-height:52px;padding:0 14px;}
  .chat-title{font-size:15px;}
  .messages-area{padding:12px 14px 8px;}
  .chat-input-area{padding:8px 10px calc(8px + var(--safe-b));}
  #message-input{font-size:16px;padding:10px 14px;min-height:42px;}
  .send-button{width:42px;height:42px;font-size:16px;}
}

/* ============ MESAJLAR ============ */
.message-item{padding:6px 0;position:relative;min-width:0;max-width:100%;word-break:break-word;overflow-wrap:anywhere;}
.message-item:hover{background:transparent;}
.message-header{display:flex;align-items:flex-start;gap:12px;}
.message-avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-muted);font-size:14px;margin-top:1px;}
.message-avatar img{width:100%;height:100%;object-fit:cover;}
.message-body{min-width:0;flex:1;}
.message-content{padding:0;color:var(--text-primary);font-size:15px;line-height:1.55;overflow-wrap:anywhere;}
.message-user{display:inline;margin-right:6px;padding:1px 8px 2px;color:var(--bg-primary);background:var(--text-primary);border-radius:13px;font-size:13px;font-weight:600;cursor:pointer;vertical-align:baseline;}
.message-user:hover{opacity:.85;}
.message-text{color:var(--text-primary);}
.message-time{color:var(--text-muted);font-size:11px;display:none;margin-left:6px;}
.message-item:hover .message-time{display:inline;}
.message-image{display:block;max-width:min(280px,100%);max-height:240px;width:auto;height:auto;object-fit:cover;border-radius:10px;margin-top:6px;cursor:zoom-in;}
.message-video{max-width:min(280px,100%);max-height:220px;border-radius:10px;margin-top:6px;}
.message-audio{max-width:min(240px,100%);height:36px;margin-top:4px;}
.message-item.system{padding:10px 0;color:var(--text-muted);font-size:13px;font-style:italic;}
.message-item.system::before{content:"▸ ";color:var(--accent);}
@media(max-width:768px){
  .message-avatar{flex:0 0 30px;width:30px;height:30px;}
  .message-header{gap:8px;align-items:flex-end;}
  .message-body{flex:0 1 auto;min-width:0;max-width:calc(100% - 50px);}
  .message-content{display:inline-block;background:var(--bg-tertiary);padding:7px 13px 8px;border-radius:18px 18px 18px 6px;font-size:15px;line-height:1.45;max-width:100%;}
  .message-user{display:block;background:none;color:var(--accent);padding:0;margin:0 0 1px;font-size:12.5px;font-weight:700;border-radius:0;}
  .message-item.mine .message-header{flex-direction:row-reverse;}
  .message-item.mine .message-avatar{display:none;}
  .message-item.mine .message-user{display:none;}
  .message-item.mine .message-content{background:var(--accent);color:#fff;border-radius:18px 18px 6px 18px;}
  .message-item.mine .message-body{margin-left:auto;flex:0 1 auto;}
  .message-item.mine .message-text{color:#fff;}
}

/* ============ GİRİŞ EKRANI ============ */
#login-screen{position:fixed;inset:0;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;overflow-y:auto;}
.login-container{background:rgba(var(--surface-rgb),0.98);backdrop-filter:blur(24px);border-radius:20px;padding:40px;width:100%;max-width:420px;border:1px solid var(--border-strong);box-shadow:0 20px 50px rgba(var(--shadow-rgb),0.16);box-sizing:border-box;}
.login-title{text-align:center;margin-bottom:28px;color:var(--text-primary);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;}
.login-title i{color:var(--accent);font-size:32px;}
.login-input{width:100%;padding:14px 20px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:12px;color:var(--text-primary);font-size:16px;outline:none;transition:all .15s;margin-bottom:14px;font-family:inherit;box-sizing:border-box;}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.login-button{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.05em;}
.login-button:hover:not(:disabled){background:var(--accent-hover);transform:translateY(-1px);}
.login-button:disabled{opacity:.6;cursor:not-allowed;}
.login-info{color:var(--text-muted);font-size:13px;text-align:center;margin-top:14px;line-height:1.5;}
.error-message{color:var(--ban);margin-top:14px;font-size:14px;display:none;background:var(--ban-bg);padding:12px;border-radius:8px;border:1px solid var(--ban);white-space:pre-line;}
@media(max-width:600px){
  .login-container{padding:26px 20px;border-radius:16px;}
  .login-title{font-size:22px;margin-bottom:20px;}
}

/* ============ ÖZEL SOHBET — AYNEN KORUNDU ============ */
.private-modal{position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;background:var(--bg-primary);height:var(--app-h,100%);top:var(--app-top,0px);max-height:100%;}
.private-modal.show{display:flex;}
.private-header{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-color);background:var(--bg-secondary);flex-shrink:0;gap:10px;}
.private-title{font-weight:600;color:var(--text-primary);font-size:16px;display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.private-title > i{color:var(--accent);flex-shrink:0;}
.private-title > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.private-typing-indicator{font-size:12px;color:var(--online);margin-left:8px;font-weight:normal;}
.private-actions{display:flex;gap:6px;flex:0 0 auto;}
.private-btn{width:40px;height:40px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.private-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.05);}
.private-btn:active{transform:scale(.95);}
.private-messages{flex:1;overflow-y:auto;padding:16px 20px;background:var(--bg-primary);min-height:0;display:flex;flex-direction:column;gap:4px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.private-messages::-webkit-scrollbar{width:6px;}
.private-messages::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
.private-input-area{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-color);background:var(--bg-secondary);display:flex;gap:8px;align-items:flex-end;flex-shrink:0;flex-wrap:wrap;position:relative;}
#private-input{flex:1;min-width:0;padding:11px 16px;background:var(--input-bg);border:1px solid var(--border-color);border-radius:24px;color:var(--text-primary);font-size:15px;outline:none;resize:none;max-height:120px;line-height:1.5;font-family:inherit;transition:all .15s;}
#private-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light);}
.attach-btn{width:46px;height:46px;border-radius:50%;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-primary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.attach-btn:hover{background:var(--bg-hover);color:var(--accent);}
.attach-btn.recording{background:var(--accent-light)!important;border-color:var(--ban)!important;}
.mic-btn{width:46px;height:46px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px rgba(201,100,66,.25);transition:all .15s;}
.mic-btn:hover{background:var(--accent-hover);transform:scale(1.05);}
.private-input-area.has-text .mic-btn{display:none;}
.private-input-area:not(.has-text) #privateSendBtn{display:none;}
.private-input-area.recording-active #private-input,
.private-input-area.recording-active .mic-btn,
.private-input-area.recording-active #privateSendBtn,
.private-input-area.recording-active .private-attach-container{display:none!important;}
.private-input-area.recording-active .recording-bar{display:flex;order:0;flex:1 1 auto;width:auto;}
.private-input-area.recording-active{align-items:center;}

/* Ek dosya menüsü */
.private-attach-container{position:relative;display:inline-block;flex-shrink:0;}
.attach-menu{position:absolute;bottom:60px;left:0;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:14px;padding:6px;z-index:10;display:none;box-shadow:var(--shadow-xl);min-width:220px;}
.attach-menu.open{display:block;}
.attach-item{padding:11px 14px;display:flex;align-items:center;gap:12px;color:var(--text-primary);cursor:pointer;border-radius:10px;font-size:14px;transition:all .15s;}
.attach-item:hover{background:var(--bg-hover);color:var(--accent);}
.attach-item i{width:20px;text-align:center;color:var(--text-muted);}
.attach-item:hover i{color:var(--accent);}

/* Ses kaydı */
.recording-bar{display:none;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--accent-light);border:1px solid var(--accent);border-radius:24px;flex:1;box-sizing:border-box;min-width:0;}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:blink 1s infinite;flex-shrink:0;}
@keyframes blink{50%{opacity:.3;}}
.rec-timer{font-family:monospace;font-size:14px;font-weight:700;color:var(--accent);min-width:44px;flex-shrink:0;}
.rec-waveform{display:flex;align-items:center;gap:2px;height:24px;flex:1;overflow:hidden;min-width:0;}
.rec-waveform .wave-bar{width:3px;border-radius:2px;background:var(--accent);animation:wave 0.8s ease-in-out infinite;}
.rec-waveform .wave-bar:nth-child(1){animation-delay:0s;height:8px;}
.rec-waveform .wave-bar:nth-child(2){animation-delay:0.1s;height:16px;}
.rec-waveform .wave-bar:nth-child(3){animation-delay:0.2s;height:22px;}
.rec-waveform .wave-bar:nth-child(4){animation-delay:0.3s;height:14px;}
.rec-waveform .wave-bar:nth-child(5){animation-delay:0.4s;height:20px;}
.rec-waveform .wave-bar:nth-child(6){animation-delay:0.5s;height:10px;}
@keyframes wave{0%,100%{transform:scaleY(1);}50%{transform:scaleY(0.3);}}
.rec-stop{width:auto;min-width:84px;height:42px;padding:0 14px;border-radius:21px;background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;touch-action:manipulation;}
.rec-stop:hover{background:var(--accent-hover);}
.rec-stop::after{content:'Bitir';font-size:13px;}
.rec-cancel{width:42px;height:42px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-muted);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}

/* Özel sohbet baloncukları (WhatsApp tarzı) */
.pm-msg{display:flex;width:100%;padding:0;margin:0;position:relative;}
.pm-msg.pm-out{justify-content:flex-end;}
.pm-msg.pm-in{justify-content:flex-start;}
.pm-bubble{position:relative;max-width:78%;min-width:64px;padding:7px 10px 5px;border-radius:14px;box-shadow:0 1px 1px rgba(0,0,0,.08);word-break:break-word;}
.pm-msg.pm-out .pm-bubble{background:var(--accent-light);border-bottom-right-radius:4px;max-width:min(78%,calc(100% - 44px));}
.pm-msg.pm-in .pm-bubble{background:var(--bg-tertiary);border-bottom-left-radius:4px;}
.pm-content{font-size:15px;line-height:1.45;white-space:pre-wrap;}
.pm-content:empty{display:none;}
.pm-content .message-image{margin-top:0;max-width:100%;max-height:240px;border-radius:10px;}
.pm-content audio{display:block;width:240px;max-width:100%;height:40px;margin-top:4px;}
.pm-video{position:relative;width:220px;max-width:100%;min-height:120px;border-radius:10px;overflow:hidden;background:#111;cursor:pointer;margin-top:4px;}
.pm-video img{display:block;width:100%;height:auto;max-height:300px;object-fit:cover;}
.pm-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;padding-left:3px;}
.pm-vdur{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:8px;}
.pm-video-player{display:block;width:220px;max-width:100%;max-height:320px;border-radius:10px;background:#000;}
.pm-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:2px;line-height:1;user-select:none;}
.pm-time{font-size:11px;color:var(--text-muted);}
.pm-ticks{font-size:12px;color:var(--text-muted);opacity:.85;display:inline-flex;}
.pm-ticks.read{color:#34B7F1;opacity:1;}
.pm-del{flex:0 0 auto;align-self:center;width:32px;height:32px;margin-right:6px;border-radius:50%;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--ban);font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;touch-action:manipulation;}
.pm-del:hover,.pm-del:active{background:var(--ban);color:#fff;border-color:transparent;}
.pm-system{justify-content:center;margin:6px 0;}
.pm-system-text{font-size:12px;color:var(--text-muted);background:var(--bg-tertiary);padding:4px 12px;border-radius:12px;text-align:center;max-width:85%;}
.pm-quote{border-left:3px solid var(--accent);background:rgba(0,0,0,.07);border-radius:8px;padding:4px 8px;margin:0 0 5px;font-size:12.5px;cursor:pointer;max-width:100%;overflow:hidden;}
.pm-quote b{display:block;color:var(--accent);font-size:12px;}
.pm-quote span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85;word-break:break-word;}
.pm-rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.pm-rx:empty{display:none;}
.pm-rx .rx{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:12px;padding:1px 7px;font-size:13px;cursor:pointer;line-height:1.5;-webkit-tap-highlight-color:transparent;}
.pm-rx .rx.mine{border-color:var(--accent);background:var(--accent-light);}
.pm-notes{margin-top:5px;}
.pm-notes:empty{display:none;}
.pm-notes .pm-note{font-size:12.5px;margin-top:3px;padding:4px 8px;border-radius:8px;background:rgba(224,168,0,.16);border-left:3px solid #e0a800;word-break:break-word;cursor:pointer;}
.pm-notes .pm-note b{margin-right:4px;}
.pm-more{position:absolute;top:2px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);font-size:11px;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;}
@media(hover:hover){.pm-bubble:hover .pm-more{display:flex;}}
.pm-swipe-ic{position:absolute;left:8px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:var(--bg-hover);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;pointer-events:none;z-index:0;}
.pm-flash .pm-bubble{animation:pmFlash 1.2s ease;}
@keyframes pmFlash{0%,60%{box-shadow:0 0 0 3px var(--accent);}100%{box-shadow:0 1px 1px rgba(0,0,0,.08);}}
#privateMessages .private-empty-state{margin:auto;text-align:center;padding:20px;color:var(--text-muted);font-size:14px;}
.pm-notice{display:flex;gap:10px;align-items:flex-start;align-self:center;max-width:94%;margin:2px 0 12px;padding:10px 12px;border-radius:12px;background:var(--bg-tertiary);border:1px solid var(--border-color);color:var(--text-secondary);font-size:12.5px;line-height:1.5;}
.pm-notice i{color:var(--accent);margin-top:2px;flex:0 0 auto;}

/* Gizlilik kalkanı */
#pmShield{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:#0c0c0c;color:#fff;}
#pmShield.show{display:flex;}
#pmShield i{font-size:34px;color:#e5484d;}
#pmShield b{font-size:16px;}
#pmShield span{font-size:13px;opacity:.75;max-width:300px;line-height:1.5;}
#privateModal .private-messages,#privateModal .private-messages *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#privateModal img,#privateModal video{-webkit-user-drag:none;user-drag:none;}

/* Özel sohbet yanıt çubuğu */
#pmReplyBar{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-secondary);border-top:1px solid var(--border-color);flex:0 0 auto;width:100%;box-sizing:border-box;}
#pmReplyBar.show{display:flex;}
#pmReplyBar .rb{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px;}
#pmReplyBar b{display:block;font-size:12.5px;color:var(--accent);}
#pmReplyBar span{display:block;font-size:13px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pmReplyBar button{width:32px;height:32px;border-radius:50%;border:0;background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;flex-shrink:0;}

/* Özel sohbet menüsü */
#pmMenu{position:fixed;z-index:3300;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:18px;box-shadow:var(--shadow-xl);padding:6px;min-width:210px;max-width:calc(100vw - 16px);}
.pm-emorow{display:flex;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--border-color);margin-bottom:4px;}
.pm-emorow button{font-size:24px;line-height:1;background:none;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;padding:0;}
.pm-emorow button.sel,.pm-emorow button:active{background:var(--bg-hover);}
.pm-act{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer;color:var(--text-primary);}
.pm-act:active,.pm-act:hover{background:var(--bg-hover);}
.pm-act i{width:18px;text-align:center;color:var(--text-muted);}
.pm-act.danger,.pm-act.danger i{color:#e5484d;}

/* Özel sohbet not */
#pmNote{position:fixed;left:0;right:0;bottom:0;z-index:3300;background:var(--bg-primary);border-top:1px solid var(--border-color);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25);}
#pmNote textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--border-color);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--bg-tertiary);color:var(--text-primary);resize:none;font-family:inherit;}
#pmNote .nb{display:flex;gap:8px;margin-top:10px;justify-content:flex-end;}
#pmNote .nb button{border:0;border-radius:20px;padding:9px 18px;font-size:14px;cursor:pointer;background:var(--bg-tertiary);color:var(--text-primary);font-family:inherit;}
#pmNote .nb .pri{background:var(--accent);color:#fff;}
#pmNote .nt{font-size:13px;color:var(--text-muted);margin-bottom:8px;}
@media(min-width:769px){#pmNote{left:50%;right:auto;width:420px;transform:translateX(-50%);bottom:24px;border-radius:20px;border:1px solid var(--border-color);}}

/* ============ GÖRÜNTÜLÜ ARAMA — AYNEN KORUNDU ============ */
#vcall{position:fixed;inset:0;z-index:2147483000;background:#0b141a;color:#fff;display:none;flex-direction:column;font-family:inherit;-webkit-user-select:none;user-select:none;}
#vcall.show{display:flex;}
#vcRemote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0b141a;}
#vcLocal{position:absolute;top:max(16px,env(safe-area-inset-top));right:14px;width:104px;height:150px;object-fit:cover;border-radius:14px;background:#222;box-shadow:0 4px 18px rgba(0,0,0,.5);transform:scaleX(-1);z-index:3;touch-action:none;}
#vcLocal.back{transform:none;}
#vcTop{position:absolute;top:0;left:0;right:0;padding:max(18px,env(safe-area-inset-top)) 130px 40px 18px;background:linear-gradient(#000a,#0000);z-index:2;pointer-events:none;}
#vcName{font-size:20px;font-weight:600;text-shadow:0 1px 4px #0008;}
#vcSt{font-size:14px;opacity:.85;margin-top:2px;}
#vcAvatar{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:112px;height:112px;border-radius:50%;background:#2a3942;display:none;align-items:center;justify-content:center;font-size:48px;font-weight:600;z-index:1;}
#vcBar{position:absolute;left:0;right:0;bottom:0;padding:26px 20px max(26px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:18px;background:linear-gradient(#0000,#000b);z-index:4;}
.vcb{width:58px;height:58px;border-radius:50%;border:0;background:#ffffff26;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.vcb.off{background:#fff;color:#111;}
.vcb.end{background:#e53935;width:66px;height:66px;}
.vcb.acc{background:#25d366;width:66px;height:66px;}
.vcb:active{transform:scale(.94);}
#vcData{position:absolute;left:18px;bottom:max(104px,calc(env(safe-area-inset-bottom) + 96px));font-size:12px;opacity:.7;z-index:4;}
#vcMin{position:absolute;top:max(16px,env(safe-area-inset-top));left:12px;width:40px;height:40px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:16px;z-index:5;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#vcMiniEnd{display:none;position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;border:0;background:#e53935;color:#fff;font-size:15px;z-index:6;align-items:center;justify-content:center;}
#vcall.mini{inset:auto;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));width:132px;height:190px;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.6);border:2px solid #ffffff55;touch-action:none;cursor:pointer;}
#vcall.mini #vcLocal,#vcall.mini #vcTop,#vcall.mini #vcData,#vcall.mini #vcBar,#vcall.mini #vcMin{display:none!important;}
#vcall.mini #vcMiniEnd{display:flex;}
#vcall.mini #vcRemote{object-fit:cover;}
#vcall.mini #vcAvatar{width:56px;height:56px;font-size:24px;}
@media(min-width:700px){#vcLocal{width:170px;height:120px;}#vcRemote{object-fit:contain;}}

/* ============ BİLDİRİM PANELİ ============ */
.notification-panel{position:absolute;top:calc(100% + 8px);right:0;width:350px;max-width:calc(100vw - 16px);max-height:500px;background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow-xl);z-index:1500;display:none;flex-direction:column;overflow:hidden;animation:slideDown .2s ease;}
.notification-panel.active{display:flex;}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.notification-header{padding:14px 16px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;background:var(--bg-secondary);}
.notification-header span{font-weight:600;font-size:15px;}
.notification-header button{background:transparent;border:0;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px;}
.notification-list{flex:1;overflow-y:auto;padding:8px;}
.notification-item{padding:12px;border-radius:10px;margin-bottom:6px;background:var(--bg-secondary);cursor:pointer;border-left:4px solid var(--accent);transition:all .15s;}
.notification-item:hover{background:var(--bg-hover);}
.notification-item.unread{background:rgba(201,100,66,.05);}
.notification-item:not(.unread){opacity:.6;border-left-color:var(--border-strong);}
.notification-footer{padding:10px;border-top:1px solid var(--border-color);display:flex;justify-content:center;}
.clear-notifications-btn{background:transparent;color:var(--text-primary);border:1px solid var(--border-color);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;}
.clear-notifications-btn:hover{background:var(--bg-hover);border-color:var(--accent);}
.notif-sender{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.notif-icon{width:24px;height:24px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:12px;}
.notif-sender strong{flex:1;font-size:14px;}
.notif-sender small{color:var(--text-muted);font-size:11px;}
.notif-text{font-size:14px;line-height:1.4;}
@media(max-width:768px){
  .notification-panel{position:fixed;top:calc(var(--hdr-h) + 6px);left:8px;right:8px;width:auto;max-width:none;}
}

/* ============ KULLANICI PANELİ (SADECE ÇEVRİMİÇİ + ÖZEL) ============ */
.users-sidebar{width:280px;min-width:280px;height:100%;background:var(--bg-panel);border-left:1px solid var(--border-color);display:none;flex-direction:column;overflow-y:auto;padding:14px;gap:4px;z-index:5;}
.users-sidebar.active{display:flex;}
.users-title{font-size:15px;color:var(--text-primary);font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--border-color);}
.users-title button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.users-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;background:var(--bg-tertiary);border:1px solid var(--border-color);border-radius:12px;}
.users-tab-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border:0;border-radius:9px;font-size:11px;font-weight:600;color:var(--text-muted);background:transparent;cursor:pointer;}
.users-tab-btn i{font-size:14px;}
.users-tab-btn.active{background:var(--bg-panel);color:var(--text-primary);box-shadow:0 1px 4px rgba(0,0,0,.15);}
.users-tab-btn.active i{color:var(--accent);}
.user-list-container{flex:1;overflow-y:auto;}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;cursor:pointer;background:transparent;margin-bottom:2px;border:1px solid transparent;transition:all .15s;gap:8px;}
.user-item:hover{background:var(--bg-hover);border-color:var(--border-color);}
.user-item.has-unread{background:rgba(181,69,47,.08)!important;border-left:3px solid var(--ban);}
.user-status{display:flex;align-items:center;gap:10px;min-width:0;flex:1;}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg-secondary);border:1.5px solid var(--border-light);display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden;color:var(--text-muted);flex-shrink:0;position:relative;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg-panel);background:var(--text-dim);}
.user-dot.online{background:var(--online);}
.user-info{min-width:0;display:flex;flex-direction:column;gap:2px;}
.user-name{font-size:14px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-sub{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-unread{background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;flex-shrink:0;}
.users-empty{color:var(--text-muted);text-align:center;padding:24px 16px;font-size:13px;}
@media(max-width:1023px){
  .users-sidebar{position:fixed;right:0;top:var(--hdr-h);bottom:0;width:min(88vw,340px);z-index:999;display:none;box-shadow:-8px 0 32px rgba(var(--shadow-rgb),0.13);}
  .users-sidebar.active{display:flex;}
}

/* ============ MODAL ORTAK ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:3500;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:16px;width:min(440px,100%);max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;background:var(--bg-secondary);border-radius:16px 16px 0 0;}
.modal-header span{font-weight:600;font-size:16px;color:var(--text-primary);}
.modal-header button{width:36px;height:36px;border-radius:50%;background:transparent;border:1px solid var(--border-color);color:var(--text-primary);font-size:16px;cursor:pointer;}
.modal-body{padding:20px;}
.modal-body p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:12px;}
.modal-body label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin:10px 0 6px;}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border-color);background:var(--input-bg);color:var(--text-primary);font-family:inherit;font-size:14px;box-sizing:border-box;outline:none;}
.modal-body input:focus,.modal-body textarea:focus{border-color:var(--accent);}
.modal-body textarea{min-height:72px;resize:vertical;}
.modal-buttons{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.modal-btn{padding:10px 18px;border-radius:10px;border:1px solid var(--border-color);background:var(--bg-tertiary);color:var(--text-primary);cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;}
.modal-btn:hover{background:var(--bg-hover);}
.modal-btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);}
.modal-btn.pri:hover{background:var(--accent-hover);}
.avatar-big{width:100px;height:100px;border-radius:50%;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--text-muted);overflow:hidden;margin:0 auto 12px;border:3px solid var(--accent);cursor:pointer;}
.avatar-big img{width:100%;height:100%;object-fit:cover;}
.avatar-upload-btn{display:block;margin:0 auto 16px;background:transparent;color:var(--text-primary);border:1px solid var(--border-color);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px;}

/* ============ TOAST ============ */
#privateMessageToastStack{position:fixed;top:calc(var(--hdr-h) + 12px);right:16px;z-index:4000;display:flex;width:min(360px,calc(100vw - 28px));flex-direction:column;gap:8px;pointer-events:none;}
.private-message-toast{display:block;width:100%;padding:13px 15px;color:var(--text-primary);background:var(--bg-elevated);border:1px solid var(--border-strong);border-left:4px solid var(--accent);border-radius:10px;box-shadow:var(--shadow-lg);text-align:left;cursor:pointer;pointer-events:auto;}
.toast-sender{display:block;margin-bottom:4px;color:var(--accent);font-size:14px;font-weight:700;}
.toast-preview{display:block;overflow:hidden;color:var(--text-secondary);font-size:13px;text-overflow:ellipsis;white-space:nowrap;}

/* ============ MOBİL UYUM ============ */
@media(max-width:768px){
  body.mobile-chat-keyboard-open .video-container{display:none;}
}

/* Yardımcı */
.hidden{display:none!important;}
.loading{display:inline-block;width:18px;height:18px;border:2px solid rgba(var(--ink-rgb),.2);border-radius:50%;border-top-color:var(--accent);animation:spin 1s infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="app-header">
  <div class="header-left">
    <div class="logo">
      <i class="fas fa-comments logo-icon"></i>
      <span>Laafle</span>
    </div>
  </div>
  <div class="header-right">
    <div style="position:relative;">
      <button class="icon-btn" id="notifBtn" onclick="toggleNotifications(event)" title="Bildirimler">
        <i class="far fa-bell"></i>
        <span class="notif-badge" id="notifBadge">0</span>
      </button>
      <div class="notification-panel" id="notifPanel">
        <div class="notification-header">
          <span>Bildirimler</span>
          <button onclick="closeNotifications()"><i class="fas fa-times"></i></button>
        </div>
        <div class="notification-list" id="notifList"></div>
        <div class="notification-footer">
          <button class="clear-notifications-btn" onclick="clearNotifications()">Tümünü Temizle</button>
        </div>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Gece / Gündüz">

function secUrl(u){u=String(u==null?'':u).trim();if(!/^(https?:\/\/|blob:|data:(image|audio|video)\/[a-z0-9.+-]+[^,]*;base64,)/i.test(u))return '';return secEsc(u.replace(/['"<>\s\\`]/g,c=>encodeURIComponent(c)));}

function readBlobAsDataUrl(blob){
  if(!blob)return Promise.reject(new Error('Boş dosya'));
  if(typeof FileReader!=='undefined'){
    return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('Okunamadı'));r.readAsDataURL(blob);});
  }
  return new Promise((res,rej)=>{try{blob.arrayBuffer().then(buf=>{const bytes=new Uint8Array(buf);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));res(`data:${blob.type||'application/octet-stream'};base64,${btoa(bin)}`);}).catch(rej);}catch(e){rej(e);}});
}
async function compressImageForChat(file, wantBlob){
  if(!file||file.size===undefined)throw new Error('Geçersiz resim');
  if(file.size>20*1024*1024)throw new Error('Resim 20 MB sınırını aşıyor');
  let source,objUrl=null;
  try{objUrl=URL.createObjectURL(file);source=objUrl;}catch(e){source=await readBlobAsDataUrl(file);}
  const image=new Image();
  await new Promise((res,rej)=>{image.onload=res;image.onerror=()=>rej(new Error('Resim açılamadı'));image.src=source;});
  if(objUrl){try{URL.revokeObjectURL(objUrl);}catch(e){}}
  const scale=Math.min(1,1280/Math.max(image.naturalWidth,image.naturalHeight));
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
  canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('Resim dönüştürülemedi');
  ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.72));
  if(!blob)throw new Error('Resim sıkıştırılamadı');
  if(wantBlob)return blob;
  return readBlobAsDataUrl(blob);
}

function isImageFile(f){if(!f)return false;const n=(f.name||'').toLowerCase(),m=(f.type||'').toLowerCase();return m.startsWith('image/')||/\.(png|jpe?g|gif|bmp|webp|heic|heif|ico)$/i.test(n);}

async function login(){
  const nickInput=document.getElementById('login-nick');
  const rawNick=nickInput.value.trim();
  const btn=document.getElementById('loginBtn');
  document.getElementById('loginError').style.display='none';
  if(rawNick.length<2||rawNick.length>20){showLoginError('Kullanıcı adı 2-20 karakter olmalı');return;}
  if(!/^[\p{L}\p{N}_ -]+$/u.test(rawNick)){showLoginError('Sadece harf, rakam, boşluk, _ ve - kullanılabilir');return;}
  if(!isFirebaseConnected){showLoginError('Sunucuya bağlanılamadı, biraz sonra tekrar deneyin');return;}
  btn.disabled=true;btn.innerHTML='<span class="loading"></span> Giriş...';
  try{
    // Anonim auth (Firebase kuralları için gerekli)
    try{ if(!firebase.auth().currentUser){ await firebase.auth().signInAnonymously(); } }catch(e){console.warn('anonim giriş',e);}
    // Nick çakışma kontrolü
    const snap=await usersRef.once('value');
    const all=snap.val()||{};
    const conflict=Object.entries(all).find(([k,u])=>
      normalizeNick(k)===normalizeNick(rawNick)&&
      k!==rawNick &&
      u&&u.isOnline!==false&&Date.now()-(u.lastSeen||0)<ONLINE_THRESHOLD
    );
    if(conflict){showLoginError(`"${conflict[0]}" nicki şu an kullanımda`);btn.disabled=false;btn.innerHTML='GİRİŞ YAP';return;}
    // Kaydet
    await usersRef.child(rawNick).set({name:rawNick,lastSeen:Date.now(),isOnline:true,joinedAt:Date.now()});
    usersRef.child(rawNick).onDisconnect().update({isOnline:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
    currentUser={name:rawNick};
    window.currentUser=currentUser;
    userSessionStartedAt=Date.now();
    privateAlertedMessageIds.clear();
    try{await sweepPrivateWipes();}catch(e){}
    armPrivateWipe(rawNick);
    document.getElementById('login-screen').style.display='none';
    addSystemMessage(`🎉 Hoş geldin, ${rawNick}!`);
    loadUserProfile(rawNick);
    loadPrivateContacts();
    checkPendingMessagesForUser(rawNick);
    setInterval(()=>{if(currentUser)usersRef.child(currentUser.name).update({lastSeen:Date.now(),isOnline:true});},PING_INTERVAL);
  }catch(err){
    console.error('login',err);
    showLoginError('Giriş başarısız: '+(err.message||'bilinmeyen hata'));
  }finally{btn.disabled=false;btn.innerHTML='GİRİŞ YAP';}
}

  if(isSendingMessage||!currentUser||!isFirebaseConnected)return;
  isSendingMessage=true;
  try{
    const inp=document.getElementById('message-input');
    const text=inp.value.trim();
    if(!text)return;
    const data={sender:currentUser.name,text,type:'user',timestamp:Date.now(),time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),avatar:currentProfileAvatar||null};
    await messagesRef.push(data);
    inp.value='';autoResize(inp);
    usersRef.child(currentUser.name).update({lastSeen:Date.now()});
    setTimeout(()=>trimServerMessages(),2000);
  }catch(err){console.error('send',err);addSystemMessage('❌ Mesaj gönderilemedi');}
  finally{setTimeout(()=>{isSendingMessage=false;},250);}
}
async function trimServerMessages(){
  try{
    const snap=await messagesRef.once('value');
    const entries=Object.entries(snap.val()||{});
    if(entries.length<=MESSAGE_LIMIT)return;
    entries.sort((a,b)=>(a[1].timestamp||0)-(b[1].timestamp||0));
    const toDel=entries.slice(0,entries.length-MESSAGE_LIMIT);
    const updates={};toDel.forEach(([k])=>updates[k]=null);
    await messagesRef.update(updates);
  }catch(e){}
}

  const prev=privateChatWith;
  if(prev&&currentPrivateChatId&&privateChatsRef){
    privateChatsRef.child(currentPrivateChatId).off('child_added');

    privateChatsRef.child(currentPrivateChatId).off('child_removed');
    if(typingRef)typingRef.child(currentPrivateChatId).off('value');
  }

function loadPrivateMessages(){
  if(!currentPrivateChatId||!privateChatsRef)return;
  const chatId=currentPrivateChatId;
  const chatRef=privateChatsRef.child(chatId);
  const container=document.getElementById('privateMessages');
  container.innerHTML='<div class="private-empty-state">Yükleniyor...</div>';

  chatRef.limitToLast(PRIVATE_MESSAGE_LIMIT).once('value').then(snap=>{
    if(currentPrivateChatId!==chatId)return;
    const messages=snap.val();
    const existing=new Set(Object.keys(messages||{}));
    updatePrivateMessages(messages);

    chatRef.off('child_added');
    chatRef.off('child_changed');
    chatRef.off('child_removed');
    chatRef.on('child_removed',s=>{
      if(currentPrivateChatId!==chatId)return;
      const el=document.getElementById(`private_msg_${s.key}`);
      if(el)el.remove();
    });
    chatRef.on('child_changed',s=>{
      if(currentPrivateChatId!==chatId)return;
      const m=s.val();
      if(m){
        if(window.pmRefresh){try{window.pmRefresh(s.key,m);}catch(e){}}
        if(m.sender===currentUser.name)updatePrivateTick(s.key,!!m.isRead);
      }
    });
    chatRef.on('child_added',s=>{
      if(currentPrivateChatId!==chatId||existing.has(s.key))return;
      existing.add(s.key);
      const m=s.val();if(!m)return;
      if(!document.getElementById(`private_msg_${s.key}`)){
        if(m.sender!==currentUser.name&&!m.isRead){
          chatRef.child(s.key).update({isRead:true,readAt:Date.now()});
          m.isRead=true;
        }
        appendPrivateMessageUI({id:s.key,...m});
        if(existing.size>PRIVATE_MESSAGE_LIMIT){
          clearTimeout(window._ccTrimT);
          window._ccTrimT=setTimeout(()=>archiveAndTrimPrivateChat(chatId),5000);
        }
        if(m.sender!==currentUser.name&&!m.isNotification&&m.sender!=='System'){
          notifyIncomingPrivateMessage(privateChatWith,m,s.key);
        }
      }
    });
  }).catch(err=>{
    console.error('özel mesaj',err);
    container.innerHTML='<div class="private-empty-state">Mesajlar yüklenemedi</div>';
  });
}

function privateVideoHtml(m){

}
function fmtVideoDur(sec){sec=Math.max(0,Math.round(sec||0));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}
async function playPrivateVideo(el){
  if(el.dataset.loading)return;
  el.dataset.loading='1';el.classList.add('loading');
  const label=el.querySelector('.pm-vdur');
  try{
    const v=document.createElement('video');
    v.className='pm-video-player';
    if(el.dataset.url&&/^https:\/\//.test(el.dataset.url)){v.src=el.dataset.url;v.preload='auto';}
    else{const r=mediaRef(el.dataset.db,el.dataset.chat,el.dataset.vid);if(!r)throw new Error('yok');const data=(await r.child('data').once('value')).val();if(!data)throw new Error('silinmiş');v.src=URL.createObjectURL(dataUrlToVideoBlob(data));}
    v.controls=true;v.autoplay=true;v.playsInline=true;
    const img=el.querySelector('img');if(img)v.poster=img.src;
    el.replaceWith(v);v.play().catch(()=>{});
  }catch(e){el.classList.remove('loading');delete el.dataset.loading;if(label)label.textContent='Video bulunamadı';}
}
function dataUrlToVideoBlob(data){
  const i=data.indexOf(';base64,');if(i<0)throw new Error('bozuk');
  const mime=(data.slice(5,i).split(';')[0])||'video/webm';
  const bin=atob(data.slice(i+8));const bytes=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++)bytes[k]=bin.charCodeAt(k);
  return new Blob([bytes],{type:mime});
}
function mediaRef(which,chatId,videoId){
  if(!database)return null;
  return database.ref('privateMedia/'+chatId+(videoId?'/'+videoId:''));
}
async function removePrivateMedia(chatId,videoIds){
  if(!database)return;
  const jobs=[];
  if(!videoIds){const r=mediaRef('main',chatId);if(r)jobs.push(r.remove());}
  else videoIds.forEach(id=>{const r=mediaRef('main',chatId,id);if(r)jobs.push(r.remove());});
  await Promise.allSettled(jobs);
}
async function storePrivateVideo(chatId,videoId,payload){
  await mediaRef('main',chatId,videoId).set(payload);
  return 'main';
}

async function sendPrivateMessage(){
  if(!privateChatWith||!currentPrivateChatId||isSendingPrivateMessage)return;
  isSendingPrivateMessage=true;
  try{
    const inp=document.getElementById('private-input');
    const text=inp.value.trim();
    if(!text)return;
    const data={
      sender:currentUser.name,receiver:privateChatWith,text,timestamp:Date.now(),
      time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),
      avatar:currentProfileAvatar||null,isRead:false
    };
    if(window.__pmReply&&window.__pmReply.id){
      data.replyTo={id:String(window.__pmReply.id),sender:String(window.__pmReply.sender||''),text:String(window.__pmReply.text||'').slice(0,100)};
      if(window.pmClearReply)window.pmClearReply();
    }
    const ok=await sendPendingMessage(privateChatWith,data);
    if(ok){
      inp.value='';autoResize(inp);updateMicBtn();
      if(typingRef)typingRef.child(currentPrivateChatId).child(currentUser.name).remove();
      usersRef.child(currentUser.name).update({lastSeen:Date.now()});
    }
  }catch(e){console.error('private send',e);}
  finally{setTimeout(()=>{isSendingPrivateMessage=false;},250);}
}

async function sendPendingMessage(toUser,data){
  try{
    rememberPrivateContact(toUser,true).catch(()=>{});
    const snap=await usersRef.child(toUser).once('value');
    const u=snap.val();
    const isOnline=u&&u.isOnline!==false&&(Date.now()-(u.lastSeen||0)<ONLINE_THRESHOLD);
    if(isOnline){
      const chatId=generateChatId(currentUser.name,toUser);
      const ref=privateChatsRef.child(chatId).push();
      ref.set(data).then(()=>updatePrivateContactMessageIndex(toUser,ref.key,data)).catch(err=>console.error('set',err));
      return true;
    } else {
      await pendingMessagesRef.child(toUser).child(currentUser.name).push({...data,originalTimestamp:data.timestamp,isPending:true});
      return true;
    }
  }catch(e){console.error('pending',e);return false;}
}

async function sendPrivateAttachment(content,text){
  if(!privateChatWith||!currentPrivateChatId)return false;
  const data={sender:currentUser.name,receiver:privateChatWith,text,...content,timestamp:Date.now(),time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),avatar:currentProfileAvatar||null,isRead:false};
  try{
    const ok=await sendPendingMessage(privateChatWith,data);
    if(ok)setTimeout(()=>archiveAndTrimPrivateChat(currentPrivateChatId),1500);
    return ok;
  }catch(e){console.error(e);return false;}
}

function emitTyping(){
  if(!currentPrivateChatId||!typingRef)return;
  const id=currentPrivateChatId;
  typingRef.child(id).child(currentUser.name).set(true);
  clearTimeout(window._typingT);
  window._typingT=setTimeout(()=>{typingRef.child(id).child(currentUser.name).remove();},TYPING_TIMEOUT_DURATION);
}

function listenForTyping(){
  if(!currentPrivateChatId||!typingRef)return;
  const title=document.getElementById('privateTitle');
  typingRef.child(currentPrivateChatId).off('value');
  typingRef.child(currentPrivateChatId).on('value',snap=>{
    const t=snap.val()||{};
    const isTyping=Object.keys(t).some(u=>u!==currentUser.name);
    const ex=title.querySelector('.private-typing-indicator');
    if(isTyping&&!ex){const s=document.createElement('span');s.className='private-typing-indicator';s.innerHTML='<i class="fas fa-ellipsis-h"></i> yazıyor';title.appendChild(s);}
    else if(!isTyping&&ex){ex.remove();}
  });
}

function closePrivateChat(){
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
  if(isAudioRecording)stopAudioRecording();
  if(privateChatsRef&&currentPrivateChatId){
    privateChatsRef.child(currentPrivateChatId).off('child_added');
    privateChatsRef.child(currentPrivateChatId).off('child_changed');
    privateChatsRef.child(currentPrivateChatId).off('child_removed');
  }
  if(typingRef&&currentPrivateChatId)typingRef.child(currentPrivateChatId).off('value');
  const closed=privateChatWith;
  privateChatWith=null;currentPrivateChatId=null;
  document.getElementById('privateModal').classList.remove('show');
  document.getElementById('private-input').value='';
  updateMicBtn();
  if(closed)startPrivateContactListener(closed);
  if(currentUserListTab==='private')renderPrivateContacts();
  pmClearReply();
}

async function archiveAndTrimPrivateChat(chatId){
  if(!privateChatsRef||!chatId)return;
  try{
    const ref=privateChatsRef.child(chatId);
    const snap=await ref.orderByKey().limitToLast(PRIVATE_MESSAGE_LIMIT+1).once('value');
    const keys=[];snap.forEach(c=>keys.push(c.key));
    if(keys.length<=PRIVATE_MESSAGE_LIMIT)return;
    const oldSnap=await ref.orderByKey().endAt(keys[0]).once('value');
    const updates={};const vids=[];
    oldSnap.forEach(c=>{updates[c.key]=null;const v=c.val();if(v&&v.videoId)vids.push(v.videoId);});
    await ref.update(updates);

function privateContactsStorageKey(){return currentUser?`cetcety_private_contacts_${currentUser.name}`:null;}
function savePrivateContactsLocally(){const k=privateContactsStorageKey();if(!k)return;try{localStorage.setItem(k,JSON.stringify(privateContacts));}catch(e){}}
function addPrivateContactToList(nick){
  if(!currentUser||!nick||nick===currentUser.name)return false;
  if(privateContacts.includes(nick))return false;
  privateContacts.unshift(nick);savePrivateContactsLocally();
  if(currentUserListTab==='private')renderPrivateContacts();
  return true;
}
function loadPrivateContacts(){
  if(!currentUser)return;
  privateContacts=[];
  try{const saved=JSON.parse(localStorage.getItem(privateContactsStorageKey())||'[]');if(Array.isArray(saved))privateContacts=[...new Set(saved.filter(n=>typeof n==='string'&&n&&n!==currentUser.name))];}catch(e){}
  if(privateContactsRef){
    const ref=privateContactsRef.child(currentUser.name);
    if(privateContactsListListener)ref.off('child_added',privateContactsListListener);
    privateContactsListListener=s=>{
      if(!s.key||!s.val()||s.key===currentUser.name)return;
      addPrivateContactToList(s.key);
      if(privateChatWith!==s.key)startPrivateContactListener(s.key);
    };

  }
  privateContacts.forEach(startPrivateContactListener);

async function rememberPrivateContact(nick,addToOther){

  addPrivateContactToList(nick);
  if(!privateContactsRef)return;
  const ts=Date.now();
  const jobs=[privateContactsRef.child(currentUser.name).child(nick).update({createdAt:ts})];
  if(addToOther)jobs.push(privateContactsRef.child(nick).child(currentUser.name).update({createdAt:ts}));

}
async function updatePrivateContactMessageIndex(nick,msgId,msg){
  if(!privateContactsRef||!currentUser||!nick||!msgId)return;
  const a={lastMessageId:msgId,lastMessageAt:msg.timestamp||Date.now()};

    privateContactsRef.child(currentUser.name).child(nick).update(a),

  ]);
}
function privateMessagePreview(m){
  if(m.image)return '📷 Fotoğraf';
  if(m.audio)return '🎤 Sesli mesaj';
  if(m.video)return '🎬 Video';
  return m.text||'Yeni mesaj';
}
async function notifyIncomingPrivateMessage(sender,msg,msgId){
  if(!currentUser||!msg||!msgId||msg.sender===currentUser.name||msg.isNotification||msg.sender==='System')return;
  const alertId=`${generateChatId(currentUser.name,sender)}/${msgId}`;
  if(privateAlertedMessageIds.has(alertId))return;
  privateAlertedMessageIds.add(alertId);
  if(privateChatWith!==sender)privateUnreadCounts[sender]=(privateUnreadCounts[sender]||0)+1;
  addNotification(sender,privateMessagePreview(msg),'private');
  if(privateChatWith===sender){privateUnreadCounts[sender]=0;}
  if(currentUserListTab==='private')renderPrivateContacts();
}
function startPrivateContactListener(nick){
  if(!currentUser||!privateChatsRef||!nick||nick===currentUser.name||nick===privateChatWith||privateContactListeners[nick])return;
  const chatId=generateChatId(currentUser.name,nick);
  const q=privateChatsRef.child(chatId).limitToLast(1);
  const entry={q,l:null};privateContactListeners[nick]=entry;
  q.once('value').then(s=>{
    if(privateContactListeners[nick]!==entry||privateChatWith===nick)return;
    const initial=new Set(Object.keys(s.val()||{}));
    entry.l=ms=>{
      if(initial.has(ms.key)){initial.delete(ms.key);return;}
      const m=ms.val();if(m)notifyIncomingPrivateMessage(nick,m,ms.key);
    };
    q.on('child_added',entry.l);
  }).catch(()=>{delete privateContactListeners[nick];});
}
function stopPrivateContactListener(nick){
  const e=privateContactListeners[nick];if(!e)return;
  if(e.l)e.q.off('child_added',e.l);
  delete privateContactListeners[nick];
}
async function checkPendingMessagesForUser(nick){
  if(!pendingMessagesRef||!nick)return;
  try{
    const snap=await pendingMessagesRef.child(nick).once('value');
    const data=snap.val();if(!data)return;
    for(const [sender,msgs] of Object.entries(data)){
      for(const [id,m] of Object.entries(msgs||{})){
        const chatId=generateChatId(nick,sender);
        const ref=privateChatsRef.child(chatId).push();
        await ref.set({...m,isPendingDelivered:true,deliveredAt:Date.now()});
        await pendingMessagesRef.child(nick).child(sender).child(id).remove();
        await rememberPrivateContact(sender,false);
        notifyIncomingPrivateMessage(sender,m,ref.key);
      }
    }
  }catch(e){}
}

async function startAudioRecording(){
  if(!privateChatWith){addSystemMessage('❌ Önce bir sohbet açın');return;}
  if(isAudioRecording){stopAudioRecording();return;}
  if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){addSystemMessage('❌ Ses kaydı desteklenmiyor');return;}
  try{
    audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mimes=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];
    const mime=mimes.find(t=>MediaRecorder.isTypeSupported(t));
    try{mediaRecorderAudio=new MediaRecorder(audioStream,mime?{mimeType:mime}:undefined);}
    catch(e){mediaRecorderAudio=new MediaRecorder(audioStream);}
    audioChunks=[];audioRecordingSeconds=0;
    const area=document.getElementById('privateInputArea');
    if(area)area.classList.add('recording-active');
    const bar=document.getElementById('recordingBar');
    if(bar)bar.style.display='flex';

    if(audioRecordingInterval)clearInterval(audioRecordingInterval);
    audioRecordingInterval=setInterval(()=>{
      audioRecordingSeconds++;
      const m=Math.floor(audioRecordingSeconds/60),s=audioRecordingSeconds%60;
      if(timer)timer.textContent=`${m}:${String(s).padStart(2,'0')}`;
    },1000);
    mediaRecorderAudio.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data);};
    mediaRecorderAudio.onstop=async()=>{
      const type=mediaRecorderAudio.mimeType||audioChunks[0]?.type||'audio/webm';
      const blob=new Blob(audioChunks,{type});
      try{
        if(!blob.size)throw new Error('Ses kaydı boş');
        if(blob.size>3*1024*1024)throw new Error('Ses 3 MB sınırını aşıyor');
        await sendPrivateAttachment({audio:await readBlobAsDataUrl(blob)},'🎤 Sesli mesaj');
      }catch(err){console.error(err);addSystemMessage('❌ '+err.message);}
      finally{
        if(audioStream)audioStream.getTracks().forEach(t=>t.stop());
        audioStream=null;isAudioRecording=false;
        if(bar)bar.style.display='none';
        if(area)area.classList.remove('recording-active');
        if(audioRecordingInterval){clearInterval(audioRecordingInterval);audioRecordingInterval=null;}
      }
    };
    mediaRecorderAudio.start(250);
    isAudioRecording=true;
    setTimeout(()=>{if(isAudioRecording){stopAudioRecording();addSystemMessage('⏱️ 60 saniye sınırı');}},60000);
  }catch(err){console.error(err);addSystemMessage('❌ Mikrofon açılamadı');
    if(audioStream)audioStream.getTracks().forEach(t=>t.stop());
    audioStream=null;}
}
function stopAudioRecording(){

}

    mediaRecorderAudio.onstop=null;mediaRecorderAudio.stop();
  }

  });
  watch(base.child('state'),'value',sn=>{
    const v=sn.val();if(!S||!v)return;
    if(v==='declined')endCall('Arama reddedildi',true);
    else if(v==='busy')endCall('Kullanıcı başka aramada',true);
    else if(v==='missed')endCall('Cevap yok',true);
    else if(v==='ended')endCall('Arama bitti',true);
  });
}
function flushPending(){if(!S)return;const p=S.pending.splice(0);p.forEach(c=>S.pc.addIceCandidate(c).catch(()=>{}));}
function wireIce(path){
  S.pc.onicecandidate=e=>{if(e.candidate&&S)database.ref('calls/'+S.id+'/'+path).push(e.candidate.toJSON());};
}

async function startVoiceCall(){return startVideoCall(true);}
async function startVideoCall(audioArg){
  if(!database||!currentUser||!privateChatWith)return;
  if(S)return;
  if(!window.RTCPeerConnection||!navigator.mediaDevices){alert('Bu tarayıcı aramayı desteklemiyor');return;}
  const audioOnly=audioArg===true;
  const id=database.ref('calls').push().key;
  S={id,peer:privateChatWith,role:'caller',refs:[],pending:[],facing:'user',audio:audioOnly};
  buildVC();vcShow(privateChatWith,audioOnly?'Sesli aranıyor...':'Aranıyor...');
  ui.avatar.style.display='flex';vcBarSet('call');
  try{
    S.local=await getMedia('user',audioOnly);
    ui.local.srcObject=S.local;ui.local.classList.remove('back');
    if(!S.local.getVideoTracks().length)ui.local.style.display='none';else ui.local.style.display='';
    S.pc=makePC(S.local);limitSenders(S.pc);wireIce('callerCand');
    const offer=await S.pc.createOffer();await S.pc.setLocalDescription(offer);
    const base=database.ref('calls/'+id);
    await base.set({caller:currentUser.name,callee:privateChatWith,mode:audioOnly?'audio':'video',state:'ringing',ts:Date.now(),offer:{type:offer.type,sdp:offer.sdp}});
    base.child('state').onDisconnect().set('ended');
    await database.ref('callInbox/'+wipeKey(privateChatWith)).set({id,from:currentUser.name,ts:Date.now(),mode:audioOnly?'audio':'video'});
    database.ref('callInbox/'+wipeKey(privateChatWith)).onDisconnect().remove();
    listenCommon();
    watch(base.child('answer'),'value',sn=>{
      const a=sn.val();if(!a||!S||S.pc.remoteDescription)return;
      S.pc.setRemoteDescription(a).then(flushPending).catch(()=>{});
      ui.st.textContent='Bağlanıyor...';stopRing();
    });
    startRing(false);
    ringTimer=setTimeout(()=>{if(S&&!S.connectedAt){try{database.ref('calls/'+id+'/state').set('missed');}catch(e){}endCall('Cevap yok',true);}},RING_MS);
  }catch(e){endCall(e.message||'Arama başlatılamadı');}
}

function listenInbox(){
  if(!database||!currentUser)return;
  if(inboxFor===wipeKey(currentUser.name))return;
  if(inboxRef){try{inboxRef.off();}catch(e){}}
  inboxFor=wipeKey(currentUser.name);
  inboxRef=database.ref('callInbox/'+inboxFor);
  inboxRef.on('value',async sn=>{
    const v=sn.val();if(!v||!v.id)return;
    try{
      if(Date.now()-(v.ts||0)>60000){inboxRef.remove();return;}
      if(S||incoming){
        if(!(incoming&&incoming.id===v.id)){database.ref('calls/'+v.id+'/state').set('busy');inboxRef.remove();}
        return;
      }
      const c=(await database.ref('calls/'+v.id).once('value')).val();
      if(!c||c.state!=='ringing'||wipeKey(c.callee)!==wipeKey(currentUser.name)){inboxRef.remove();return;}
      incoming={id:v.id,from:c.caller,offer:c.offer};
      S={id:v.id,peer:c.caller,role:'callee',refs:[],pending:[],facing:'user',ringing:true,audio:(c.mode||v.mode)==='audio'};
      vcShow(c.caller,(c.mode||v.mode)==='audio'?'Sesli arama':'Görüntülü arama');
      ui.avatar.style.display='flex';ui.local.style.display='none';ui.local.srcObject=null;vcBarSet('incoming');
      startRing(true);
      const base=database.ref('calls/'+v.id);
      watch(base.child('state'),'value',s2=>{
        const x=s2.val();
        if(S&&S.ringing&&x&&x!=='ringing')endCall('Cevapsız arama',true);
      });
    }catch(e){}
  });
}

async function acceptCall(){
  if(!S||!incoming)return;
  const inc=incoming;S.ringing=false;stopRing();
  ui.st.textContent='Bağlanıyor...';vcBarSet('call');
  try{
    S.local=await getMedia('user',!!S.audio);
    ui.local.srcObject=S.local;ui.local.style.display=S.local.getVideoTracks().length?'':'none';
    S.pc=makePC(S.local);limitSenders(S.pc);wireIce('calleeCand');
    await S.pc.setRemoteDescription(inc.offer);flushPending();
    const ans=await S.pc.createAnswer();await S.pc.setLocalDescription(ans);
    const base=database.ref('calls/'+S.id);
    listenCommon();
    await base.child('answer').set({type:ans.type,sdp:ans.sdp});
    await base.child('state').set('accepted');
    base.child('state').onDisconnect().set('ended');
    try{inboxRef.remove();}catch(e){}
  }catch(e){endCall(e.message||'Arama cevaplanamadı');}
}
function declineCall(){
  if(!S)return;
  try{database.ref('calls/'+S.id+'/state').set('declined');inboxRef&&inboxRef.remove();}catch(e){}
  endCall('',true);
}

function endCall(msg,remote){
  const s=S;if(!s){incoming=null;vcHide();return;}
  S=null;incoming=null;clearTimeout(ringTimer);stopRing();
  try{s.refs.forEach(r=>r[0].off(r[1],r[2]));}catch(e){}
  clearInterval(s.tick);clearInterval(s.stats);clearTimeout(s.dc);
  try{s.wl&&s.wl.release();}catch(e){}
  try{s.local&&s.local.getTracks().forEach(t=>t.stop());}catch(e){}
  try{s.pc&&s.pc.close();}catch(e){}
  const dur=s.connectedAt?Math.round((Date.now()-s.connectedAt)/1000):0;
  if(database){
    try{
      if(!remote)database.ref('calls/'+s.id+'/state').set(s.ringing?'declined':'ended');
      if(s.role==='caller'){database.ref('callInbox/'+wipeKey(s.peer)).remove();setTimeout(()=>{try{database.ref('calls/'+s.id).remove();}catch(e){}},4000);}
    }catch(e){}
  }
  if(ui){
    if(msg){ui.st.textContent=msg+(dur?' · '+fmt(dur):'');ui.root.classList.remove('mini');setTimeout(()=>{if(!S)vcHide();},1400);}
    else vcHide();
  }
}
function vcHide(){
  try{
    if(!ui)return;
    ui.root.style.setProperty('display','none','important');
    ui.root.classList.remove('show');ui.root.classList.remove('mini');
    ui.remote.srcObject=null;ui.local.srcObject=null;ui.data.textContent='';
  }catch(e){}
}

(function(){
  const EMO=['👍','❤️','😂','😮','😢','🙏'];
  let reply=null,menuEl=null,noteEl=null,replyChat=null;
  function meN(){return currentUser&&currentUser.name;}
  function msgRef(id){return privateChatsRef&&currentPrivateChatId?privateChatsRef.child(currentPrivateChatId).child(id):null;}
  function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function plain(s){const d=document.createElement('div');d.innerHTML=String(s||'');return (d.textContent||'').trim();}
  function preview(m){if(m.image)return '📷 Fotoğraf';if(m.audio)return '🎤 Ses mesajı';if(m.video)return '🎬 Video';return plain(m.text).slice(0,100);}

  function bar(){let b=document.getElementById('pmReplyBar');return b;}
  function setReply(m){
    const b=bar();if(!b)return;
    reply={id:m.id,sender:m.sender,text:preview(m).slice(0,100)};
    window.__pmReply=reply;replyChat=currentPrivateChatId;
    b.querySelector('b').textContent=m.sender===meN()?'Kendine yanıt':m.sender+' kişisine yanıt';
    b.querySelector('span').textContent=reply.text;b.classList.add('show');
    const inp=document.getElementById('private-input');if(inp)try{inp.focus();}catch(e){}
  }
  window.pmClearReply=function(){reply=null;window.__pmReply=null;replyChat=null;const b=document.getElementById('pmReplyBar');if(b)b.classList.remove('show');};
  setInterval(()=>{if(reply&&currentPrivateChatId!==replyChat)window.pmClearReply();},800);

  function scrollTo(id){
    const el=document.getElementById('private_msg_'+id);if(!el)return;
    el.scrollIntoView({block:'center',behavior:'smooth'});
    el.classList.add('pm-flash');setTimeout(()=>el.classList.remove('pm-flash'),1300);
  }
  function render(div){
    const m=div._pm||{},me=(meN()||'').toLowerCase().replace(/[.#$\[\]\/]/g,'_');
    const rx=div.querySelector('.pm-rx'),nt=div.querySelector('.pm-notes');
    if(rx){
      rx.innerHTML='';const by={};let mine=null;
      Object.keys(m.reactions||{}).forEach(k=>{const r=m.reactions[k];if(!r||!r.e)return;(by[r.e]=by[r.e]||[]).push(r.u||k);if(k===me)mine=r.e;});
      Object.keys(by).forEach(e=>{const s=mk('span','rx'+(mine===e?' mine':''),e+(by[e].length>1?' '+by[e].length:''));s.title=by[e].join(', ');s.onclick=ev=>{ev.stopPropagation();react(div,e);};rx.appendChild(s);});
    }
    if(nt){
      nt.innerHTML='';
      Object.keys(m.notes||{}).forEach(k=>{const n=m.notes[k];if(!n||!n.t)return;const d=mk('div','pm-note');const b=mk('b',null,'📝 '+(n.u||k)+':');d.appendChild(b);d.appendChild(document.createTextNode(' '+n.t));d.onclick=ev=>{ev.stopPropagation();if(k===me)noteSheet(div);};nt.appendChild(d);});
    }
  }
  window.pmDecorate=function(div,m){
    const bub=div.querySelector('.pm-bubble');if(!bub||div._pmDone)return;
    div._pmDone=true;div._pm={id:m.id,sender:m.sender,text:m.text,image:m.image,audio:m.audio,video:m.video,reactions:m.reactions||{},notes:m.notes||{}};
    if(m.replyTo&&m.replyTo.id){
      const q=mk('div','pm-quote');q.appendChild(mk('b',null,m.replyTo.sender||''));q.appendChild(mk('span',null,m.replyTo.text||''));
      q.onclick=e=>{e.stopPropagation();scrollTo(m.replyTo.id);};
      bub.insertBefore(q,bub.firstChild);
    }
    const meta=bub.querySelector('.pm-meta');
    const nt=mk('div','pm-notes'),rx=mk('div','pm-rx');
    if(meta){bub.insertBefore(nt,meta);bub.appendChild(rx);}else{bub.appendChild(nt);bub.appendChild(rx);}
    const more=mk('button','pm-more');more.type='button';more.innerHTML='<i class="fas fa-chevron-down"></i>';more.title='Seçenekler';
    more.onclick=e=>{e.stopPropagation();openMenu(div,more.getBoundingClientRect());};bub.appendChild(more);
    const ic=mk('div','pm-swipe-ic');ic.innerHTML='<i class="fas fa-reply"></i>';div.insertBefore(ic,div.firstChild);div._ic=ic;
    bub.addEventListener('contextmenu',e=>{e.preventDefault();openMenu(div,{left:e.clientX,right:e.clientX,top:e.clientY,bottom:e.clientY});});
    attachTouch(div,bub);
    render(div);
  };
  window.pmRefresh=function(key,m){
    const div=document.getElementById('private_msg_'+key);if(!div||!div._pm)return;
    div._pm.reactions=m.reactions||{};div._pm.notes=m.notes||{};render(div);
  };

  function attachTouch(div,bub){
    let s=null,timer=0;
    function cancel(){clearTimeout(timer);timer=0;}
    bub.addEventListener('touchstart',e=>{
      s=null;if(e.touches.length!==1)return;
      if(e.target.closest&&e.target.closest('audio,video,a,button,.rx,.pm-note,.pm-quote'))return;
      const t=e.touches[0];s={x:t.clientX,y:t.clientY,lock:false,dx:0};
      cancel();timer=setTimeout(()=>{if(s&&!s.lock){const r=bub.getBoundingClientRect();s=null;try{navigator.vibrate&&navigator.vibrate(12);}catch(e){}openMenu(div,r);}},480);
    },{passive:true});
    bub.addEventListener('touchmove',e=>{
      if(!s)return;
      const t=e.touches[0],dx=t.clientX-s.x,dy=t.clientY-s.y;
      if(!s.lock){
        if(Math.abs(dx)>8||Math.abs(dy)>8)cancel();
        if(dx>12&&dx>Math.abs(dy)*1.5)s.lock=true;
        else if(Math.abs(dy)>12){s=null;return;}
        else return;
      }
      s.dx=Math.max(0,Math.min(dx,90));bub.style.transition='none';bub.style.transform='translateX('+s.dx+'px)';
      if(div._ic)div._ic.style.opacity=String(Math.min(1,s.dx/55));
      if(e.cancelable)e.preventDefault();
    },{passive:false});
    function end(){
      cancel();const d=s;s=null;
      bub.style.transition='transform .18s ease';bub.style.transform='';if(div._ic)div._ic.style.opacity='0';
      if(d&&d.lock&&d.dx>=55){try{navigator.vibrate&&navigator.vibrate(15);}catch(e){}setReply(div._pm);}
    }
    bub.addEventListener('touchend',end,{passive:true});bub.addEventListener('touchcancel',end,{passive:true});
  }

  function react(div,emoji){
    const r=msgRef(div._pm.id),me=meN();if(!r||!me)return;
    const k=me.toLowerCase().replace(/[.#$\[\]\/]/g,'_');
    const cur=(div._pm.reactions||{})[k],rr=r.child('reactions').child(k);
    div._pm.reactions=div._pm.reactions||{};
    if(cur&&cur.e===emoji){delete div._pm.reactions[k];rr.remove();}
    else{div._pm.reactions[k]={e:emoji,u:me};rr.set({e:emoji,u:me});}
    render(div);
  }

  function closeMenu(){if(menuEl){menuEl.remove();menuEl=null;}}
  function openMenu(div,rect){
    closeMenu();const m=div._pm,mine=m.sender===meN(),me=(meN()||'').toLowerCase().replace(/[.#$\[\]\/]/g,'_');
    menuEl=mk('div');menuEl.id='pmMenu';
    const row=mk('div','pm-emorow'),cur=(m.reactions||{})[me];
    EMO.forEach(e=>{const b=mk('button',cur&&cur.e===e?'sel':'',e);b.type='button';b.onclick=()=>{closeMenu();react(div,e);};row.appendChild(b);});
    menuEl.appendChild(row);
    function act(icon,label,fn,cls){const a=mk('div','pm-act'+(cls?' '+cls:''));a.innerHTML='<i class="fas '+icon+'"></i>';a.appendChild(document.createTextNode(label));a.onclick=()=>{closeMenu();fn();};menuEl.appendChild(a);}
    act('fa-reply','Yanıtla',()=>setReply(m));
    act('fa-note-sticky',(m.notes&&m.notes[me])?'Notumu düzenle':'Not ekle',()=>noteSheet(div));
    const txt=plain(m.text);if(txt)act('fa-copy','Kopyala',()=>{try{navigator.clipboard.writeText(txt);}catch(e){}});
    if(mine)act('fa-trash-can','Sil',()=>{try{deletePrivateMessage(m.id,currentPrivateChatId);}catch(e){}},'danger');
    document.body.appendChild(menuEl);
    const w=menuEl.offsetWidth,h=menuEl.offsetHeight,vw=innerWidth,vh=innerHeight;
    const x=Math.min(Math.max(8,(rect.left+rect.right)/2-w/2),vw-w-8);
    let y=rect.top-h-8;if(y<8)y=Math.min(rect.bottom+8,vh-h-8);
    menuEl.style.left=x+'px';menuEl.style.top=Math.max(8,y)+'px';
  }
  document.addEventListener('mousedown',e=>{if(menuEl&&!menuEl.contains(e.target))closeMenu();},true);
  document.addEventListener('touchstart',e=>{if(menuEl&&!menuEl.contains(e.target))closeMenu();},{capture:true,passive:true});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();closeNote();}});
  const pmBox=document.getElementById('privateMessages');
  if(pmBox)pmBox.addEventListener('scroll',closeMenu,{passive:true});

  function closeNote(){if(noteEl){noteEl.remove();noteEl=null;}}
  function noteSheet(div){
    closeNote();const m=div._pm,me=(meN()||'').toLowerCase().replace(/[.#$\[\]\/]/g,'_'),cur=(m.notes||{})[me];
    noteEl=mk('div');noteEl.id='pmNote';
    noteEl.innerHTML='<div class="nt"></div><textarea maxlength="140" placeholder="Bu mesaja not yaz..."></textarea><div class="nb"><button type="button" data-a="x">İptal</button>'+(cur?'<button type="button" data-a="d">Notu sil</button>':'')+'<button type="button" class="pri" data-a="s">Kaydet</button></div>';
    noteEl.querySelector('.nt').textContent='“'+preview(m).slice(0,60)+'”';
    const ta=noteEl.querySelector('textarea');ta.value=cur?cur.t:'';
    noteEl.onclick=e=>{
      const a=e.target.getAttribute&&e.target.getAttribute('data-a');if(!a)return;
      const r=msgRef(m.id),me2=meN();m.notes=m.notes||{};
      if(a==='s'){const t=ta.value.trim().slice(0,140);if(t&&r){m.notes[me]={u:me2,t,ts:Date.now()};r.child('notes').child(me).set({u:me2,t,ts:Date.now()});}else if(!t&&r){delete m.notes[me];r.child('notes').child(me).remove();}}
      if(a==='d'&&r){delete m.notes[me];r.child('notes').child(me).remove();}
      closeNote();render(div);
    };
    document.body.appendChild(noteEl);setTimeout(()=>{try{ta.focus();}catch(e){}},60);
  }
})();

(function(){
  const pm=document.getElementById('privateModal');if(!pm)return;
  const sh=document.getElementById('pmShield');
  function isOpen(){return pm.classList.contains('show');}
  let holdT=null,hidden=false;
  function show(msg,ms){
    if(!isOpen())return;
    const t=document.getElementById('pmShieldTxt');if(t&&msg)t.textContent=msg;
    sh.classList.add('show');clearTimeout(holdT);
    if(ms)holdT=setTimeout(()=>{if(!hidden)sh.classList.remove('show');},ms);
  }
  function wipeClipboard(){try{const p=navigator.clipboard&&navigator.clipboard.writeText('Özel sohbetlerde ekran görüntüsü alınamaz.');if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  let lastShot=0;
  function shot(e){
    if(!isOpen())return;
    if(e&&e.preventDefault)try{e.preventDefault();}catch(x){}
    const n=Date.now();if(n-lastShot<1500)return;lastShot=n;
    wipeClipboard();show('Ekran görüntüsü alınamaz. Bu sohbet gizlendi.',3000);
  }
  function isShotKey(e){
    if(e.key==='PrintScreen'||e.code==='PrintScreen')return true;
    const k=(e.key||'').toLowerCase();
    if(e.metaKey&&e.shiftKey&&(k==='s'||k==='3'||k==='4'||k==='5'||k==='6'))return true;
    if(e.ctrlKey&&e.shiftKey&&k==='s')return true;
    return false;
  }
  document.addEventListener('keydown',e=>{if(isShotKey(e))shot(e);},true);
  document.addEventListener('keyup',e=>{if(isShotKey(e))shot(e);},true);
  const touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
  function hide(){if(isOpen()){hidden=true;show('Gizliliği korumak için bu sohbet gizlendi.');}}
  function onBlur(){if(touch)return;if(document.hasFocus())return;hide();}
  function reveal(){hidden=false;clearTimeout(holdT);holdT=setTimeout(()=>{if(!hidden)sh.classList.remove('show');},350);}
  window.addEventListener('blur',()=>setTimeout(onBlur,60));
  window.addEventListener('focus',reveal);
  document.addEventListener('visibilitychange',()=>{document.hidden?hide():reveal();});
  pm.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.private-messages'))e.preventDefault();});
})();

(function(){
  const RX=/(^|[\s(])@([\p{L}\p{N}_.\-]{2,20})/gu;
  function nk(n){return (n||'').toLowerCase().replace(/[.#$\[\]\/]/g,'_');}
  window.mnDecorate=function(div){
    const t=div.querySelector('.message-text');if(!t||!/@/.test(t.textContent))return;
    const me=currentUser&&currentUser.name;if(!me)return;
    const w=document.createTreeWalker(t,NodeFilter.SHOW_TEXT,null),nodes=[];
    let n;while((n=w.nextNode()))nodes.push(n);
    nodes.forEach(tn=>{
      const s=tn.nodeValue;RX.lastIndex=0;if(!RX.test(s))return;RX.lastIndex=0;
      const frag=document.createDocumentFragment();let last=0,m;
      while((m=RX.exec(s))){
        const start=m.index+m[1].length;
        if(start>last)frag.appendChild(document.createTextNode(s.slice(last,start)));
        const sp=document.createElement('span');
        sp.style.cssText='color:var(--accent);font-weight:700;background:var(--accent-light);border-radius:6px;padding:0 3px;';
        sp.textContent='@'+m[2];frag.appendChild(sp);last=start+1+m[2].length;
      }
      if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
      tn.parentNode.replaceChild(frag,tn);
    });
  };
})();
