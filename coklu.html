<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popbox Çoklu Panel</title>
<style>
  :root { --bg:#0e0f14; --panel:#171923; --line:#2a2e3d; --text:#e8eaf2; --muted:#8a90a6; --accent:#ff4d8d; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:17px; margin:0 8px 0 0; }
  input, button, select { font:inherit; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  input { flex:1 1 260px; min-width:0; background:#0e0f14; }
  button, select { background:#202432; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a0510; font-weight:700; padding:8px 20px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #msg { flex-basis:100%; color:var(--muted); font-size:13px; min-height:18px; }
  #msg.err { color:#ff8a8a; }
  main { flex:1; min-height:0; overflow-y:auto; display:grid; gap:6px; padding:6px; align-content:start; }
  .slot { background:var(--panel); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden; }
  .slot.focus { grid-column:1 / -1; grid-row:span 2; }
  main.sq { grid-template-columns:repeat(4, minmax(0, 1fr)); grid-auto-rows:auto; }
  main.sq .slot { align-self:start; }
  main.sq .view { flex:none; height:0; padding-bottom:100%; }
  main.sq .slot.focus { grid-row:auto; }
  main.sq .slot.focus .view { padding-bottom:56.25%; }
  @media (max-width:700px) { main.sq { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .bar { display:flex; gap:6px; align-items:center; padding:5px 6px; border-bottom:1px solid var(--line); }
  .bar .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:var(--muted); }
  .bar button { padding:4px 9px; font-size:13px; }
  .view { flex:1; min-height:0; position:relative; background:#000; }
  .view iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .empty { padding:40px 20px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Popbox Çoklu Panel</h1>
  <input id="url" placeholder="YouTube linki veya video ID" aria-label="YouTube linki veya video ID" autocomplete="off">
  <button class="primary" id="add">EKLE</button>
  <select id="layout" aria-label="Düzen">
    <option value="auto">Kare, 4'lü sıra</option>
    <option value="row">Yan yana</option>
    <option value="col">Alt alta</option>
  </select>
  <button id="muteAll">Hepsini sustur</button>
  <button id="pauseAll">Hepsini durdur</button>
  <div id="msg">En fazla 10 farklı video. Eklenen video yeni kutu olarak açılır.</div>
</header>
<main id="grid"></main>

<script>
(function () {
  var MAX = 10;
  var items = []; // {uid, id, title, muted, focus}
  var uidCounter = 0;
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid');

  function say(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

  function parseId(s) {
    s = (s || '').trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    try {
      var u = new URL(s);
      if (u.hostname.indexOf('youtu.be') > -1) return u.pathname.slice(1, 12);
      var v = u.searchParams.get('v'); if (v) return v.slice(0, 11);
      var m = u.pathname.match(/\/(embed|live|shorts)\/([\w-]{11})/); if (m) return m[2];
    } catch (e) {}
    return null;
  }

  function save() {
    try { localStorage.setItem('popbox-panel-v2', JSON.stringify(items.map(function (x) { return { id: x.id, title: x.title }; }))); } catch (e) {}
  }

  function cmd(it, func) {
    var f = document.getElementById('f' + it.uid);
    if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: [] }), '*');
  }

  function fetchTitle(it) {
    fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + it.id))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.title) { it.title = d.title; save(); var el = document.getElementById('t' + it.uid); if (el) el.textContent = d.title; } })
      .catch(function () {});
  }

  function addItem(id, title) {
    var it = { uid: ++uidCounter, id: id, title: title || id, muted: true, focus: false };
    items.push(it);
    if (!title) fetchTitle(it);
    return it;
  }

  function add() {
    var id = parseId($('url').value);
    if (!id) { say('Geçerli bir YouTube linki veya video ID gir.', true); return; }
    if (items.some(function (x) { return x.id === id; })) { say('Bu video zaten açık. Her kutuda farklı bir video olmalı.', true); return; }
    if (items.length >= MAX) { say('Panel dolu: en fazla ' + MAX + ' video.', true); return; }
    addItem(id);
    $('url').value = '';
    say(items.length + ' / ' + MAX + ' video açık.');
    render(); save();
  }

  function render() {
    grid.innerHTML = '';
    var n = items.length, layout = $('layout').value;
    grid.className = layout === 'auto' ? 'sq' : '';
    if (layout === 'auto') {
      grid.style.gridTemplateColumns = '';
      grid.style.gridAutoRows = '';
    } else {
      var cols = layout === 'row' ? Math.max(n, 1) : 1;
      grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
      grid.style.gridAutoRows = 'minmax(240px, 1fr)';
    }

    if (!n) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'Henüz video yok. Yukarıdaki kutuya link yapıştırıp EKLE\'ye bas.';
      grid.appendChild(e); return;
    }

    items.forEach(function (it) {
      var el = document.createElement('section'); el.className = 'slot' + (it.focus ? ' focus' : '');
      var bar = document.createElement('div'); bar.className = 'bar';
      var t = document.createElement('div'); t.className = 't'; t.id = 't' + it.uid; t.textContent = it.title;
      var mute = document.createElement('button'); mute.textContent = it.muted ? 'Sesi aç' : 'Sustur';
      var big = document.createElement('button'); big.textContent = it.focus ? 'Küçült' : 'Büyüt';
      var del = document.createElement('button'); del.textContent = 'Kaldır';
      bar.append(t, mute, big, del);

      var view = document.createElement('div'); view.className = 'view';
      var f = document.createElement('iframe'); f.id = 'f' + it.uid;
      var origin = /^https?:$/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '';
      f.src = 'https://www.youtube.com/embed/' + it.id + '?enablejsapi=1&autoplay=1&playsinline=1&mute=' + (it.muted ? 1 : 0) + origin;
      f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      f.referrerPolicy = 'strict-origin-when-cross-origin';
      f.allowFullscreen = true;
      view.appendChild(f);

      mute.onclick = function () { it.muted = !it.muted; cmd(it, it.muted ? 'mute' : 'unMute'); mute.textContent = it.muted ? 'Sesi aç' : 'Sustur'; };
      big.onclick = function () { var was = it.focus; items.forEach(function (o) { o.focus = false; }); it.focus = !was; render(); };
      del.onclick = function () { items = items.filter(function (o) { return o !== it; }); say(items.length + ' / ' + MAX + ' video açık.'); render(); save(); };

      el.append(bar, view); grid.appendChild(el);
    });
  }

  $('add').onclick = add;
  $('url').onkeydown = function (e) { if (e.key === 'Enter') add(); };
  $('layout').onchange = render;
  $('muteAll').onclick = function () { items.forEach(function (it) { it.muted = true; cmd(it, 'mute'); }); render(); };
  $('pauseAll').onclick = function () { items.forEach(function (it) { cmd(it, 'pauseVideo'); }); };

  try {
    var saved = JSON.parse(localStorage.getItem('popbox-panel-v2') || '[]');
    if (Array.isArray(saved)) saved.slice(0, MAX).forEach(function (s) { if (s && s.id) addItem(s.id, s.title); });
  } catch (e) {}
  render();
  if (location.protocol === 'file:') say('Dosya bilgisayardan açıldığı için YouTube videoyu göstermeyebilir (Hata 153). GitHub Pages (https) üzerinden aç.', true);
})();
</script>
</body>
</html>
