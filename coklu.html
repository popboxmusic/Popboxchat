<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Çoklu Ekran Tarayıcı</title>
<style>
:root{--bg:#f2f3f5;--bar:#ffffff;--pane:#ffffff;--line:#d5d8de;--tx:#1b1e24;--mut:#5f6673;--ac:#1f6feb;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--bar:#171a21;--pane:#171a21;--line:#2a2f3a;--tx:#e6e8ec;--mut:#9099a8;--ac:#5b9cff;--on:#0b1220}}
:root[data-theme="dark"]{--bg:#0f1115;--bar:#171a21;--pane:#171a21;--line:#2a2f3a;--tx:#e6e8ec;--mut:#9099a8;--ac:#5b9cff;--on:#0b1220}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100%}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.sp{flex:1}
#bulk{display:none;background:var(--bar);border-bottom:1px solid var(--line);padding:8px 10px;gap:8px}
#bulk.open{display:flex;flex-wrap:wrap}
#bulk textarea{flex:1 1 320px;min-height:90px;resize:vertical}
.note{color:var(--mut);font-size:12px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line)}
#grid{flex:1;min-height:0;display:grid;gap:6px;padding:6px;overflow:auto}
.pane{background:var(--pane);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:180px;min-width:0;overflow:hidden}
.pane.max{position:fixed;inset:0;z-index:20;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;gap:4px;padding:4px;border-bottom:1px solid var(--line);align-items:center}
.num{min-width:22px;height:22px;display:grid;place-items:center;border-radius:5px;background:var(--ac);color:var(--on);font-weight:600;font-size:12px}
.bar input{flex:1;min-width:0;padding:4px 8px}
.bar button{padding:4px 8px}
iframe{flex:1;border:0;width:100%;background:#fff}
.empty{flex:1;display:grid;place-items:center;color:var(--mut);padding:12px;text-align:center}
@media (max-width:640px){#grid{grid-template-columns:1fr!important;grid-template-rows:none!important}}
</style>
</head>
<body>
<header>
  <strong>Çoklu ekran</strong>
  <label>Ekran sayısı
    <select id="count"></select>
  </label>
  <button id="bulkBtn">Toplu link ekle</button>
  <button id="reloadAll">Hepsini yenile</button>
  <button id="tileBtn" class="pri">Pencere ızgarası (YouTube için)</button>
  <input id="quick" type="text" placeholder="Link yaz, Enter: yeni pencere açılır" aria-label="Hızlı pencere linki" style="min-width:220px;flex:1 1 220px">
  <button id="clearAll">Hepsini temizle</button>
  <span class="sp"></span>
  <button id="themeBtn">Tema</button>
</header>
<div id="bulk">
  <textarea id="bulkText" placeholder="Her satıra bir link yaz. 1. satır 1. ekrana, 2. satır 2. ekrana açılır."></textarea>
  <button class="pri" id="bulkGo">Ekranlara aç</button>
</div>
<div class="note">Gizli kullanım için bu sayfayı tarayıcının gizli penceresinde aç (Ctrl+Shift+N). Bazı siteler (Google, YouTube, Instagram, bankalar) kendi güvenliği için çerçeve içinde açılmaz. Bunlar için ekrandaki “↗” ile yeni sekmede aç.</div>
<main id="grid"></main>

<script>
(function(){
  var grid=document.getElementById('grid'),sel=document.getElementById('count');
  var counts=[1,2,3,4,6,8,9,12,16],urls=[];
  counts.forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)});
  sel.value=4;

  function yt(u){try{var x=new URL(u),h=x.hostname.replace(/^(www|m|music)\./,''),id='';
    if(h==='youtu.be')id=x.pathname.slice(1);
    else if(h==='youtube.com'||h==='youtube-nocookie.com'){
      var m=x.pathname.match(/^\/(shorts|live|embed)\/([\w-]{6,})/);
      if(m)id=m[2];else if(x.pathname==='/watch')id=x.searchParams.get('v')||'';
      else if(x.pathname==='/playlist'&&x.searchParams.get('list'))return 'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(x.searchParams.get('list'))}
    if(!id)return u;
    var q='';if(x.searchParams.get('list'))q='?list='+encodeURIComponent(x.searchParams.get('list'));
    return 'https://www.youtube-nocookie.com/embed/'+id.split('&')[0]+q}catch(e){return u}}
  function norm(u){u=(u||'').trim();if(!u)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
    if(!/^https?:/i.test(u))return'';return yt(u)}
  function layout(n){var c=n<=1?1:n<=2?2:n<=4?2:n<=6?3:n<=9?3:4;var r=Math.ceil(n/c);
    grid.style.gridTemplateColumns='repeat('+c+',minmax(0,1fr))';
    grid.style.gridTemplateRows='repeat('+r+',minmax(180px,1fr))'}

  function build(){
    var n=+sel.value;layout(n);grid.innerHTML='';
    for(var i=0;i<n;i++)(function(i){
      var p=document.createElement('section');p.className='pane';
      var bar=document.createElement('div');bar.className='bar';
      var num=document.createElement('span');num.className='num';num.textContent=i+1;
      var inp=document.createElement('input');inp.type='text';inp.placeholder='Link yaz ve Enter’a bas';inp.value=urls[i]||'';
      inp.setAttribute('aria-label',(i+1)+'. ekran linki');
      var bGo=mk('Aç','Aç'),bRe=mk('⟳','Yenile'),bNew=mk('↗','Yeni sekmede aç'),bMax=mk('⤢','Tam ekran'),bX=mk('✕','Temizle');
      bar.append(num,inp,bGo,bRe,bNew,bMax,bX);
      var body=document.createElement('div');body.className='empty';body.textContent='Boş ekran. Bir link yaz.';
      p.append(bar,body);grid.appendChild(p);
      function load(){var u=norm(inp.value);urls[i]=u;inp.value=u;
        var f=document.createElement('iframe');
        f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
        f.setAttribute('allow','fullscreen; autoplay; clipboard-write');
        f.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation');
        f.title=(i+1)+'. ekran';
        if(u){f.src=u;p.replaceChild(f,p.lastChild)}else{body.className='empty';p.replaceChild(body,p.lastChild)}}
      inp.addEventListener('keydown',function(e){if(e.key==='Enter')load()});
      bGo.onclick=load;
      bRe.onclick=function(){if(urls[i])load()};
      bNew.onclick=function(){var u=norm(inp.value);if(u)window.open(u,'_blank','noopener,noreferrer')};
      bMax.onclick=function(){p.classList.toggle('max')};
      bX.onclick=function(){inp.value='';urls[i]='';load()};
      p._load=load;p._inp=inp;
      if(urls[i])load();
    })(i);
  }
  function mk(t,l){var b=document.createElement('button');b.textContent=t;b.title=l;b.setAttribute('aria-label',l);return b}

  sel.onchange=build;
  document.getElementById('bulkBtn').onclick=function(){document.getElementById('bulk').classList.toggle('open')};
  document.getElementById('bulkGo').onclick=function(){
    var lines=document.getElementById('bulkText').value.split(/\n+/).map(norm).filter(Boolean);
    if(lines.length>+sel.value){var best=counts.find(function(c){return c>=lines.length});sel.value=best||counts[counts.length-1]}
    urls=lines;build();document.getElementById('bulk').classList.remove('open')};
  document.getElementById('reloadAll').onclick=function(){Array.prototype.forEach.call(grid.children,function(p){if(p._inp&&p._inp.value)p._load()})};
  document.getElementById('clearAll').onclick=function(){urls=[];build()};
  document.getElementById('themeBtn').onclick=function(){var r=document.documentElement;
    var dark=r.getAttribute('data-theme')?r.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
    r.setAttribute('data-theme',dark?'light':'dark')};
  document.getElementById('tileBtn').onclick=function(){
    var n=+sel.value,c=n<=1?1:n<=4?2:n<=9?3:4,r=Math.ceil(n/c),W=screen.availWidth,H=screen.availHeight,
        w=Math.floor(W/c),h=Math.floor(H/r),L=screen.availLeft||0,T=screen.availTop||0,blocked=0,used=0;
    for(var i=0;i<n;i++){var u=urls[i];if(!u)continue;used++;
      var x=L+(i%c)*w,y=T+Math.floor(i/c)*h;
      var win=window.open(u,'ekran'+(i+1),'popup=yes,left='+x+',top='+y+',width='+w+',height='+h);
      if(!win)blocked++}
    if(!used)alert('Önce karelere link yaz.');
    else if(blocked)alert(blocked+' pencere engellendi. Adres çubuğundaki açılır pencere iznini “İzin ver” yapıp tekrar dene.')};
  var qi=0;
  document.getElementById('quick').addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var u=this.value.trim();if(!u)return;
    if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;
    if(!/^https?:/i.test(u))return;
    var n=+sel.value,c=n<=1?1:n<=4?2:n<=9?3:4,r=Math.ceil(n/c),W=screen.availWidth,H=screen.availHeight,
        w=Math.floor(W/c),h=Math.floor(H/r),L=screen.availLeft||0,T=screen.availTop||0,s=qi%n;
    var win=window.open(u,'hizli'+s,'popup=yes,left='+(L+(s%c)*w)+',top='+(T+Math.floor(s/c)*h)+',width='+w+',height='+h);
    if(!win){alert('Pencere engellendi. Adres çubuğundaki açılır pencere iznini “İzin ver” yapıp tekrar dene.');return}
    qi++;this.value=''});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=grid.querySelector('.max');if(m)m.classList.remove('max')}});
  build();
})();
</script>
</body>
</html>
