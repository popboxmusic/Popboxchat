<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popbox Oynatma Listesi</title>
<style>
  :root { --bg:#0e0f14; --panel:#171923; --line:#2a2e3d; --text:#e8eaf2; --muted:#8a90a6; --accent:#ff4d8d; color-scheme:dark; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:14px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .addbar { display:flex; gap:8px; }
  input, button { font:inherit; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px 14px; }
  input { flex:1; min-width:0; background:var(--panel); }
  button { background:#202432; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a0510; font-weight:700; padding:10px 22px; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  #msg { min-height:22px; margin:8px 0; color:var(--muted); font-size:13px; }
  #msg.err { color:#ff8a8a; }
  .stage { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .stage > div, .stage iframe { position:absolute; inset:0; width:100%; height:100%; }
  .ctrl { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0 16px; }
  #now { flex:1; min-width:160px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  li { display:flex; gap:10px; align-items:center; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px; }
  li.cur { border-color:var(--accent); }
  li img { width:96px; height:54px; object-fit:cover; border-radius:6px; background:#000; flex:none; }
  li .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li button { padding:6px 12px; }
  .count { color:var(--muted); font-size:13px; margin:0 0 8px; }
  .empty { color:var(--muted); padding:18px; text-align:center; border:1px dashed var(--line); border-radius:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Popbox Oynatma Listesi</h1>
  <div class="addbar">
    <input id="url" placeholder="YouTube linki veya video ID" aria-label="YouTube linki veya video ID" autocomplete="off">
    <button class="primary" id="add">EKLE</button>
  </div>
  <div id="msg">En fazla 10 farklı video eklenebilir. Videolar sırayla çalar.</div>

  <div class="stage"><div id="player"></div></div>
  <div class="ctrl">
    <button id="prev">Önceki</button>
    <button id="toggle">Duraklat</button>
    <button id="next">Sonraki</button>
    <button id="loop">Liste başa dönsün: Açık</button>
    <span id="now"></span>
  </div>

  <p class="count" id="count"></p>
  <ol id="list"></ol>
</div>

<script src="https://www.youtube.com/iframe_api" async></script>
<script>
(function () {
  var MAX = 10;
  var items = [];   // {id, title}
  var cur = -1, player = null, ready = false, pending = null, loopAll = true;
  var $ = function (id) { return document.getElementById(id); };

  function say(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

  function parseId(s) {
    s = (s || '').trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    try {
      var u = new URL(s);
      if (u.hostname.indexOf('youtu.be') > -1) return u.pathname.slice(1, 12);
      var v = u.searchParams.get('v'); if (v) return v.slice(0, 11);
      var m = u.pathname.match(/\/(embed|live|shorts)\/([\w-]{11})/); if (m) return m[2];
    } catch (e) {}
    return null;
  }

  function save() { try { localStorage.setItem('popbox-liste', JSON.stringify(items)); } catch (e) {} }

  function fetchTitle(item) {
    fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + item.id))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.title) { item.title = d.title; save(); render(); } })
      .catch(function () {});
  }

  function play(i) {
    if (i < 0 || i >= items.length) return;
    cur = i;
    if (ready) player.loadVideoById(items[i].id); else pending = i;
    render();
  }

  function next() {
    if (!items.length) return;
    if (cur + 1 < items.length) play(cur + 1);
    else if (loopAll) play(0);
  }

  function add() {
    var id = parseId($('url').value);
    if (!id) { say('Geçerli bir YouTube linki veya video ID gir.', true); return; }
    if (items.some(function (x) { return x.id === id; })) { say('Bu video listede zaten var. Her video listeye bir kez eklenir.', true); return; }
    if (items.length >= MAX) { say('Liste dolu: en fazla ' + MAX + ' video.', true); return; }
    var item = { id: id, title: id };
    items.push(item);
    $('url').value = '';
    say('Eklendi.');
    fetchTitle(item);
    save();
    if (cur === -1) play(items.length - 1); else render();
  }

  function remove(i) {
    var wasCur = (i === cur);
    items.splice(i, 1);
    if (!items.length) { cur = -1; if (ready) player.stopVideo(); }
    else if (wasCur) { cur = Math.min(i, items.length) - 1; next(); }
    else if (i < cur) cur--;
    save(); render();
  }

  function render() {
    var ol = $('list'); ol.innerHTML = '';
    $('count').textContent = items.length + ' / ' + MAX + ' video';
    if (!items.length) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'Henüz video yok. Yukarıdaki kutuya link yapıştırıp EKLE\'ye bas.';
      ol.appendChild(e);
    }
    items.forEach(function (it, i) {
      var li = document.createElement('li'); if (i === cur) li.className = 'cur';
      var img = document.createElement('img'); img.alt = ''; img.src = 'https://i.ytimg.com/vi/' + it.id + '/mqdefault.jpg';
      var t = document.createElement('div'); t.className = 't'; t.textContent = it.title;
      var p = document.createElement('button'); p.textContent = i === cur ? 'Çalıyor' : 'Oynat'; p.onclick = function () { play(i); };
      var d = document.createElement('button'); d.textContent = 'Sil'; d.onclick = function () { remove(i); };
      li.append(img, t, p, d); ol.appendChild(li);
    });
    $('now').textContent = cur >= 0 ? 'Şu an: ' + items[cur].title : '';
  }

  window.onYouTubeIframeAPIReady = function () {
    var vars = { playsinline: 1, rel: 0 };
    if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
    player = new YT.Player('player', {
      width: '100%', height: '100%', playerVars: vars,
      events: {
        onReady: function () { ready = true; if (pending !== null) { play(pending); pending = null; } },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED) next();
          $('toggle').textContent = e.data === YT.PlayerState.PLAYING ? 'Duraklat' : 'Oynat';
        },
        onError: function () {
          say('Bu video gömülü oynatılamıyor, sıradakine geçiliyor.', true);
          if (items.length > 1) setTimeout(next, 1200);
        }
      }
    });
  };

  $('add').onclick = add;
  $('url').onkeydown = function (e) { if (e.key === 'Enter') add(); };
  $('prev').onclick = function () { if (items.length) play(cur > 0 ? cur - 1 : items.length - 1); };
  $('next').onclick = function () { if (items.length) { if (cur + 1 < items.length) play(cur + 1); else play(0); } };
  $('toggle').onclick = function () {
    if (!ready || cur < 0) return;
    player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
  };
  $('loop').onclick = function () { loopAll = !loopAll; $('loop').textContent = 'Liste başa dönsün: ' + (loopAll ? 'Açık' : 'Kapalı'); };

  try {
    var saved = JSON.parse(localStorage.getItem('popbox-liste') || '[]');
    if (Array.isArray(saved)) saved.slice(0, MAX).forEach(function (s) { if (s && s.id) items.push({ id: s.id, title: s.title || s.id }); });
  } catch (e) {}
  render();
  if (location.protocol === 'file:') say('Dosya bilgisayardan açıldığı için YouTube videoyu göstermeyebilir. GitHub Pages (https) üzerinden aç.', true);
})();
</script>
</body>
</html>
