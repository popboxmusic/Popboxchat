<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CETCETY</title></head>
<body style="font-family:sans-serif;text-align:center;padding:40px"><p>Yönlendiriliyor…</p>
<script>
/* domain/@kanal → ana sayfa (GitHub Pages 404 yönlendirmesi) */
(function(){
  var segs=location.pathname.split('/'), i=-1;
  for(var k=0;k<segs.length;k++){ if(/^(@|%40)/.test(segs[k])){i=k;break;} }
  var base=location.origin+(i>=0?segs.slice(0,i).join('/'):segs.slice(0,-1).join('/'))+'/';
  if(i<0){ location.replace(base); return; }
  var name=decodeURIComponent(segs[i]).replace(/^@/,'');
  var q='?c='+encodeURIComponent(name)+(location.search?'&'+location.search.slice(1):'');
  location.replace(base+q+location.hash);
})();
</script></body></html>
