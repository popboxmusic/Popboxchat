<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Haberler</title>
<script>(function(){try{var t=localStorage.getItem('cetcety-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}})();</script>
<style>
:root{--bg:#FAF9F5;--bg2:#F5F4ED;--pn:#fff;--hv:#EAE7DC;--tx:#1F1E1D;--tx2:#3D3D3A;--mut:#73726C;--bd:#E6E3D8;--acc:#C96442;--lk:#9A4A2C}
:root[data-theme=dark]{--bg:#262624;--bg2:#1F1E1D;--pn:#30302E;--hv:#3A3935;--tx:#FAF9F5;--tx2:#C2C0B6;--mut:#9C9A92;--bd:#3E3D39;--acc:#D97757;--lk:#E8A58B}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:14px;padding:8px 18px;max-width:1340px;margin:auto}
.logo{font:500 24px Georgia,'Times New Roman',serif;white-space:nowrap}.logo b{color:var(--acc);font-weight:500}
.sr{flex:1;max-width:620px;margin:0 auto}
.sr input{width:100%;padding:11px 18px;border-radius:999px;border:0;background:var(--pn);color:var(--tx);font:inherit;outline:none;box-shadow:0 0 0 1px var(--bd)}
.sr input:focus{box-shadow:0 0 0 2px var(--acc)}
.ib{min-width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--mut);font-size:17px;padding:0 8px}.ib:hover{background:var(--hv);color:var(--tx)}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1340px;margin:auto;padding:0 18px;scrollbar-width:none;justify-content:center}
nav button{border:0;background:none;color:var(--tx2);padding:12px 16px;white-space:nowrap;border-bottom:3px solid transparent;border-radius:3px 3px 0 0}
nav button:hover{background:var(--hv)}nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{max-width:1160px;margin:auto;padding:22px 18px 60px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:6px}
.head h1{font:400 32px Georgia,serif}.head span{color:var(--mut)}
.cols{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:18px;margin-bottom:18px;align-items:start}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:20px;padding:18px 20px}
.pn>h2{font:400 20px Georgia,serif;color:var(--lk);padding-bottom:12px;border-bottom:1px solid var(--bd);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lead{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.big img,.big .ph{width:100%;aspect-ratio:16/10;border-radius:14px;object-fit:cover;display:block;margin-bottom:10px}
.big h3{font:500 21px/1.3 Georgia,serif;margin:6px 0}
.three{display:flex;flex-direction:column;gap:16px}
.st{display:block;border-radius:10px}.st:hover h3,.st:hover h4{text-decoration:underline}
.st h4{font-size:15.5px;font-weight:500;line-height:1.35;margin:4px 0}
.src{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--tx2)}.src img{width:16px;height:16px;border-radius:3px}
.tm{font-size:12.5px;color:var(--mut)}
.more{width:100%;margin-top:18px;padding:12px;border:0;border-radius:999px;background:var(--bg2);font-weight:600}.more:hover{background:var(--hv)}
.row{display:flex;gap:14px;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0;padding-bottom:0}
.row .tx{min-width:0}.row h4{font-size:16px;font-weight:500;line-height:1.35;margin:4px 0}
.row>img,.row>.ph,.row>a>img{width:96px;height:80px;border-radius:12px;object-fit:cover;flex:none}
.ph{display:grid;place-items:center;background:var(--bg2);color:var(--mut);font:600 26px Georgia,serif}
.play{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;padding:1px 9px;font-size:11.5px;margin-left:6px}
.list2{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:600;display:inline-block}
.btn.g{background:var(--bg2);color:var(--tx)}
.msg{padding:50px 10px;text-align:center;color:var(--mut)}
.art h1{font:500 34px/1.2 Georgia,serif;margin:10px 0}.art .hero{width:100%;max-height:480px;object-fit:cover;border-radius:16px;margin:14px 0}
.art p{font:18px/1.75 Georgia,serif;margin:0 0 18px;color:var(--tx2);white-space:pre-wrap}.art .lead2{font:19px/1.5 Georgia,serif;color:var(--mut);margin-bottom:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:14px;z-index:50;overflow:auto}.ov.on{display:flex}
.bx{background:var(--pn);border-radius:18px;width:min(900px,100%);max-height:94vh;overflow:auto}
.ed{padding:20px;display:flex;flex-direction:column;gap:12px}.ed label{font-size:13px;color:var(--mut);font-weight:600}
.ed input,.ed textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.ed textarea{min-height:230px;resize:vertical;line-height:1.55}.ed img{max-width:100%;max-height:200px;border-radius:12px}
.pl{aspect-ratio:16/9;background:#000}.pl iframe,.pl video{width:100%;height:100%;border:0}
@media(max-width:860px){.cols,.lead,.list2{grid-template-columns:1fr}.head h1{font-size:26px}nav{justify-content:flex-start}.logo{font-size:20px}}
</style>
</head>
<body>
<header>
 <div class="bar">
  <a class="logo" href="#hepsi">Haber<b>ler</b></a>
  <div class="sr"><input id="q" type="search" placeholder="Konu, kaynak veya kelime ara" autocomplete="off"></div>
  <button class="ib" id="au" title="Yazar girişi">✎</button>
  <button class="ib" id="rf" title="Yenile">⟳</button>
  <button class="ib" id="th" title="Gece / Gündüz">☾</button>
 </div>
 <nav id="nav"></nav>
</header>
<main id="app"></main>
<div class="ov" id="vm"><div class="bx"><div class="pl" id="pl"></div><div style="padding:12px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center"><b id="vt"></b><span><a class="btn" id="vl" target="_blank" rel="noopener">Habere git</a> <button class="ib" id="vx">✕</button></span></div></div></div>
<div class="ov" id="em"><div class="bx"><div class="ed">
 <h2 style="font:500 22px Georgia,serif">Yeni makale</h2>
 <label>Başlık</label><input id="et" maxlength="200">
 <label>Kısa özet (isteğe bağlı)</label><input id="es" maxlength="400">
 <label>Görsel</label><input id="ef" type="file" accept="image/*"><img id="ep" hidden>
 <label>İçerik (paragraflar arasında boş satır bırak)</label><textarea id="eb"></textarea>
 <div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><button class="btn g" id="eo">Yazar çıkışı</button><span><button class="btn g" id="ec">Vazgeç</button> <button class="btn" id="ey">Yayınla</button></span></div>
 <div id="er" style="color:var(--acc);font-size:13px"></div>
</div></div></div>

<script>
const W = 'https://haber-worker.kyazar07.workers.dev';   // Cloudflare worker adresin
const TABS = [['hepsi','Ana Sayfa'],['gundem','Türkiye'],['dunya','Dünya'],['world','World'],['ekonomi','İş'],['teknoloji','Bilim ve Teknoloji'],['magazin','Eğlence'],['spor','Spor'],['saglik','Sağlık'],['video','Video'],['yerel','Yerel']];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cat = 'hepsi', items = [], arts = [], artErr = '', more = false, token = '', cache = {};
try { token = localStorage.getItem('haber-admin') || ''; } catch (e) {}

const ago = t => { const d = (Date.now() - t) / 1000; return d < 60 ? 'şimdi' : d < 3600 ? Math.floor(d/60) + ' dakika önce' : d < 86400 ? Math.floor(d/3600) + ' saat önce' : Math.floor(d/86400) + ' gün önce'; };
const host = u => { try { return new URL(u).hostname; } catch (e) { return ''; } };
const ph = n => `<div class="ph">${esc((n || '?')[0])}</div>`;
const img = u => `<img src="${esc(u)}" loading="lazy" referrerpolicy="no-referrer" alt="">`;
const src = it => `<div class="src"><img src="https://www.google.com/s2/favicons?sz=32&domain=${esc(host(it.link))}" alt="">${esc(it.source)}${it.video ? '<span class="play">▶ Video</span>' : ''}</div>`;
const A = it => `href="${esc(it.link)}" target="_blank" rel="noopener noreferrer"${it.video ? ` data-v="${esc(it.video)}" data-t="${esc(it.title)}"` : ''}`;

// Görsel yüklenemezse (engellenmiş/bozuk) otomatik yer tutucuya çevir
document.addEventListener('error', e => {
  const t = e.target;
  if (!t || t.tagName !== 'IMG') return;
  if (t.closest('.src')) { t.style.visibility = 'hidden'; return; }
  const d = document.createElement('div'); d.className = 'ph'; d.textContent = '·'; t.replaceWith(d);
}, true);

const big = it => `<a class="st big" ${A(it)}>${it.image ? img(it.image) : ph(it.source)}${src(it)}<h3>${esc(it.title)}</h3><div class="tm">${ago(it.pubTs)}</div></a>`;
const small = it => `<a class="st" ${A(it)}>${src(it)}<h4>${esc(it.title)}</h4><div class="tm">${ago(it.pubTs)}</div></a>`;
const row = it => `<a class="row st" ${A(it)}><div class="tx">${src(it)}<h4>${esc(it.title)}</h4><div class="tm">${ago(it.pubTs)}</div></div>${it.image ? img(it.image) : ph(it.source)}</a>`;
const artRow = a => `<div class="row"><a class="st tx" href="#makale/${a.id}"><div class="src">✎ Editör</div><h4>${esc(a.title)}</h4><div class="tm">${esc(a.summary || '')} ${a.summary ? '·' : ''} ${ago(a.ts)}</div></a>${a.image ? `<a href="#makale/${a.id}"><img src="${W}/makale-gorsel/${a.id}" alt="" loading="lazy"></a>` : ''}${token ? `<button class="ib" title="Sil" data-del="${a.id}">🗑</button>` : ''}</div>`;

function artPanel() {
  let h = `<aside class="pn"><h2><span>Editörün makaleleri</span>${token ? '<button class="btn" id="nw">+ Yeni</button>' : ''}</h2>`;
  if (artErr) h += `<div class="tm">${token ? esc(artErr) : 'Henüz makale yok.'}</div>`;
  else if (!arts.length) h += '<div class="tm">Henüz makale yayınlanmadı.</div>';
  else h += arts.slice(0, 8).map(artRow).join('');
  return h + '</aside>';
}

function home() {
  const q = $('#q').value.trim().toLocaleLowerCase('tr');
  const l = items.filter(i => !q || (i.title + ' ' + i.source + ' ' + (i.description || '')).toLocaleLowerCase('tr').includes(q));
  const d = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
  const tab = TABS.find(t => t[0] === cat)[1];
  let h = `<div class="head"><h1>${q ? 'Arama sonuçları' : cat === 'hepsi' ? 'Özetler' : tab}</h1><span>${d}</span></div>`;
  if (!l.length) return h + `<div class="cols"><div class="msg">${items.length ? 'Sonuç bulunamadı.' : 'Bu bölümde şu an haber yok.'}</div>${artPanel()}</div>`;
  const bi = l.findIndex(i => i.image), b = l[bi >= 0 ? bi : 0];
  const rest = l.filter(i => i !== b), three = rest.slice(0, 3), others = rest.slice(3);
  h += `<div class="cols"><section class="pn"><h2><span>${q ? 'En uygun sonuçlar' : 'En çok okunan haberler'}</span></h2>
    <div class="lead">${big(b)}<div class="three">${three.map(small).join('')}</div></div>
    ${others.length ? `<button class="more" id="mo">${more ? 'Daha az göster' : 'Diğer başlıklar ve bakış açıları'}</button>` : ''}</section>${artPanel()}</div>`;
  if (others.length) h += `<section class="pn"><h2><span>Diğer haberler</span></h2><div class="list2">${others.slice(0, more ? 60 : 12).map(row).join('')}</div></section>`;
  return h;
}

async function article(id) {
  $('#app').innerHTML = '<div class="msg">Yükleniyor…</div>';
  try {
    const a = await (await fetch(`${W}/makale/${id}`)).json();
    if (a.error) throw new Error(a.error);
    document.title = a.title;
    $('#app').innerHTML = `<div class="art" style="max-width:760px;margin:auto"><a class="btn g" href="#hepsi">← Haberlere dön</a><h1>${esc(a.title)}</h1>
      <div class="tm">${new Date(a.ts).toLocaleString('tr-TR')} · Editör</div>
      ${a.summary ? `<p class="lead2">${esc(a.summary)}</p>` : ''}${a.image ? `<img class="hero" src="${W}/makale-gorsel/${a.id}" alt="">` : ''}
      ${esc(a.body).split(/\n\s*\n/).map(p => `<p>${p.trim()}</p>`).join('')}</div>`;
  } catch (e) { $('#app').innerHTML = `<div class="msg">Makale bulunamadı. <a class="btn g" href="#hepsi">Ana sayfa</a></div>`; }
  scrollTo(0, 0);
}

async function load(force) {
  if (!cache[cat] || force || Date.now() - cache[cat].t > 60000) {
    $('#app').innerHTML = '<div class="msg">Haberler yükleniyor…</div>';
    try {
      const r = await fetch(`${W}/haber?kategori=${cat}${force ? '&v=4' : ''}`), j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      cache[cat] = { t: Date.now(), items: j.items || [] };
    } catch (e) {
      $('#app').innerHTML = `<div class="msg">Haberler alınamadı (${esc(e.message || e)}).<br><br><button class="btn" id="rt">Tekrar dene</button></div>`;
      $('#rt').onclick = () => route(true); return;
    }
  }
  items = cache[cat].items;
}
function render() { document.title = 'Haberler'; $('#app').innerHTML = home(); }
async function loadArts() {
  try { const r = await fetch(`${W}/makaleler`), j = await r.json(); if (!r.ok) throw new Error(j.hint || j.error); arts = j.items || []; artErr = ''; }
  catch (e) { arts = []; artErr = 'Makale servisi hazır değil: ' + (e.message || e); }
}
function nav() { $('#nav').innerHTML = TABS.map(t => `<button data-c="${t[0]}" class="${t[0] === cat ? 'on' : ''}">${t[1]}</button>`).join(''); }

async function route(force) {
  const h = location.hash.slice(1);
  if (h.startsWith('makale/')) return article(h.slice(7));
  cat = TABS.some(t => t[0] === h) ? h : 'hepsi'; more = false; nav();
  await Promise.all([load(force === true), loadArts()]);
  if ($('#rt')) return;
  render();
}

/* ---- tıklamalar (event delegation): bağlantılar gerçek <a> olduğu için her zaman çalışır ---- */
document.addEventListener('click', e => {
  const t = e.target;
  const c = t.closest('[data-c]');
  if (c) { if (location.hash.slice(1) === c.dataset.c) route(); else location.hash = c.dataset.c; return; }
  const v = t.closest('[data-v]');
  if (v && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openVideo(v.dataset.v, v.dataset.t, v.href); return; }
  if (t.id === 'mo') { more = !more; render(); }
  if (t.id === 'nw') openEditor();
  const d = t.closest('[data-del]');
  if (d && confirm('Bu makale silinsin mi?')) api('DELETE', '/makale/' + d.dataset.del).then(async () => { await loadArts(); render(); }).catch(x => alert('Silinemedi: ' + x.message));
});
function openVideo(u, title, link) {
  $('#pl').innerHTML = /youtube\.com\/embed/.test(u) ? `<iframe src="${esc(u)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>` : `<video controls autoplay playsinline src="${esc(u)}"></video>`;
  $('#vt').textContent = title; $('#vl').href = link; $('#vm').classList.add('on');
}
const closeV = () => { $('#vm').classList.remove('on'); $('#pl').innerHTML = ''; };
$('#vx').onclick = closeV; $('#vm').onclick = e => { if (e.target.id === 'vm') closeV(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeV(); $('#em').classList.remove('on'); } });

/* ---- yazar paneli: sadece Worker'daki ADMIN_TOKEN'ı bilen kişi yazabilir ---- */
const api = (m, p, body) => fetch(W + p, { method: m, headers: { 'x-admin-token': token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined }).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; });
let imgData = '';
function openEditor() { $('#et').value = $('#es').value = $('#eb').value = ''; $('#er').textContent = ''; $('#ep').hidden = true; imgData = ''; $('#ef').value = ''; $('#em').classList.add('on'); }
$('#au').onclick = async () => {
  if (!token) {
    const t = prompt('Yazar şifresi (Worker\'daki ADMIN_TOKEN):'); if (!t) return;
    token = t;
    try { await api('GET', '/makale-yetki'); localStorage.setItem('haber-admin', t); }
    catch (e) { token = ''; alert('Şifre yanlış veya worker kurulu değil.'); return; }
    render();
  }
  openEditor();
};
$('#eo').onclick = () => { token = ''; try { localStorage.removeItem('haber-admin'); } catch (e) {} $('#em').classList.remove('on'); render(); };
$('#ec').onclick = () => $('#em').classList.remove('on');
$('#ef').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    imgData = c.toDataURL('image/jpeg', .82); $('#ep').src = imgData; $('#ep').hidden = false;
  }; im.src = fr.result; };
  fr.readAsDataURL(f);
};
$('#ey').onclick = async () => {
  $('#er').textContent = '';
  try {
    await api('POST', '/makale', { title: $('#et').value, summary: $('#es').value, body: $('#eb').value, image: imgData });
    $('#em').classList.remove('on'); await loadArts(); render();
  } catch (e) { $('#er').textContent = 'Yayınlanamadı: ' + e.message; }
};

/* ---- genel ---- */
function theme(t, save) { document.documentElement.setAttribute('data-theme', t); $('#th').textContent = t === 'dark' ? '☀' : '☾'; if (save) try { localStorage.setItem('cetcety-theme', t); } catch (e) {} }
$('#th').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
$('#rf').onclick = () => { cache = {}; route(true); };
$('#q').oninput = () => { if (location.hash.startsWith('#makale')) location.hash = '#hepsi'; else render(); };
addEventListener('hashchange', () => route());
theme(document.documentElement.dataset.theme, false);
route();
setInterval(() => { if (!document.hidden && !$('#q').value && !location.hash.startsWith('#makale') && !$('#em').classList.contains('on')) { cache = {}; route(true); } }, 180000);
</script>
</body>
</html>
