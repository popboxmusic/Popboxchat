<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Haberler</title>
<script>
(function(){try{var t=localStorage.getItem('cetcety-theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}})();
</script>
<style>
:root{--bg:#FAF9F5;--bg2:#F5F4ED;--card:#fff;--hover:#EAE7DC;--tx:#1F1E1D;--tx2:#3D3D3A;--mut:#73726C;--bd:#E6E3D8;--acc:#C96442;--sh:0 2px 8px rgba(31,30,29,.08)}
:root[data-theme=dark]{--bg:#262624;--bg2:#1F1E1D;--card:#30302E;--hover:#3A3935;--tx:#FAF9F5;--tx2:#C2C0B6;--mut:#9C9A92;--bd:#3E3D39;--acc:#D97757;--sh:0 2px 8px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 ui-sans-serif,-apple-system,'Segoe UI',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1280px;margin:auto}
.logo{font:500 22px Georgia,'Times New Roman',serif;letter-spacing:-.01em;white-space:nowrap}.logo b{color:var(--acc)}
.search{flex:1;max-width:560px;margin:auto}
.search input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;outline:none}
.search input:focus{box-shadow:0 0 0 3px rgba(201,100,66,.18)}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:16px;display:grid;place-items:center}
.ib:hover{background:var(--hover);color:var(--tx)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 16px 8px;max-width:1280px;margin:auto;scrollbar-width:none}
nav button{border:0;background:transparent;color:var(--mut);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit;white-space:nowrap}
nav button:hover{background:var(--hover);color:var(--tx)}
nav button.on{background:rgba(201,100,66,.14);color:var(--acc);font-weight:600}
main{max-width:1280px;margin:auto;padding:16px}
.top{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:20px}
.hero{position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--bd);min-height:340px;display:flex;align-items:flex-end;cursor:pointer}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:relative;padding:22px;width:100%;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.hero h2{font:500 26px/1.2 Georgia,serif;margin:6px 0}
.side{display:flex;flex-direction:column;gap:10px}
.mini{display:flex;gap:12px;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);cursor:pointer}
.mini:hover,.card:hover{background:var(--hover)}
.mini .th{width:96px;height:72px;flex:none;border-radius:8px;overflow:hidden}
.mini h3{font-size:14.5px;font-weight:600;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--sh)}
.card .th{aspect-ratio:16/9}
.card .bd{padding:12px 14px 14px}
.card h3{font-size:16px;font-weight:600;line-height:1.3;margin:4px 0 6px}
.card p{color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.th{position:relative;background:var(--bg2);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font:600 30px Georgia,serif;color:var(--mut);background:var(--bg2)}
.play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
.meta{font-size:12.5px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta b{color:var(--tx2);cursor:pointer}.meta b:hover{color:var(--acc)}
.hero .meta{color:#ddd}.hero .meta b{color:#fff}
.sec{font:500 20px Georgia,serif;margin:6px 0 12px}
.msg{padding:40px;text-align:center;color:var(--mut)}
.sk{height:240px;border-radius:14px;background:var(--bg2);animation:p 1.2s infinite alternate}@keyframes p{to{opacity:.5}}
#md{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
#md.on{display:flex}
#md .bx{width:min(960px,100%);background:var(--card);border-radius:14px;overflow:hidden}
#md .pl{aspect-ratio:16/9;background:#000}#md iframe,#md video{width:100%;height:100%;border:0}
#md .ft{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600}
@media(max-width:820px){.top{grid-template-columns:1fr}.logo{font-size:19px}.hero{min-height:260px}.hero h2{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#" onclick="go('hepsi');return false">Haber<b>ler</b></a>
    <div class="search"><input id="q" type="search" placeholder="Haberlerde ara…" autocomplete="off"></div>
    <button class="ib" id="rf" title="Yenile">⟳</button>
    <button class="ib" id="th" title="Gece / Gündüz">☾</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="md"><div class="bx"><div class="pl" id="pl"></div><div class="ft"><span id="mt" style="font-weight:600"></span><span><a class="btn" id="ml" target="_blank" rel="noopener">Habere git</a> <button class="ib" onclick="closeM()" style="display:inline-grid">✕</button></span></div></div></div>

<script>
const WORKER = 'https://haber-worker.kyazar07.workers.dev';   // Cloudflare worker adresin
const CATS = [['hepsi','Ana Sayfa'],['gundem','Gündem'],['dunya','Dünya'],['world','World (EN)'],['ekonomi','Ekonomi'],
  ['spor','Spor'],['teknoloji','Teknoloji'],['saglik','Sağlık'],['magazin','Magazin'],['kultur','Kültür'],['video','Video 🎬'],['yerel','Yerel']];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cat = (location.hash || '#hepsi').slice(1), items = [], src = '', timer;
if (!CATS.some(c => c[0] === cat)) cat = 'hepsi';
const store = {};

function ago(t){const d=(Date.now()-t)/1000;if(d<60)return'şimdi';if(d<3600)return Math.floor(d/60)+' dk önce';if(d<86400)return Math.floor(d/3600)+' sa önce';return Math.floor(d/86400)+' gün önce'}
function thumb(it, cls){
  const ph = `<div class="ph">${esc((it.source||'?')[0])}</div>`;
  const img = it.image ? `<img src="${esc(it.image)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='${ph.replace(/'/g,"\\'")}'">` : ph;
  return `<div class="th ${cls||''}">${img}${it.video?'<span class="play">▶ Video</span>':''}</div>`;
}
const meta = it => `<div class="meta"><b onclick="event.stopPropagation();setSrc('${esc(it.source).replace(/'/g,"\\'")}')">${esc(it.source)}</b><span>•</span><span>${ago(it.pubTs)}</span></div>`;

function render(){
  const q = $('#q').value.trim().toLocaleLowerCase('tr');
  let l = items.filter(i => (!src || i.source === src) && (!q || (i.title+' '+(i.description||'')+' '+i.source).toLocaleLowerCase('tr').includes(q)));
  const app = $('#app');
  if (!l.length) { app.innerHTML = `<div class="msg">${items.length ? 'Sonuç bulunamadı.' : 'Bu bölümde şu an haber yok.'}</div>`; return; }
  const hi = l.findIndex(i => i.image), hero = hi >= 0 ? l[hi] : null;
  if (hero) l = l.filter(i => i !== hero);
  const side = l.splice(0, hero ? 4 : 0);
  let h = src ? `<div class="sec">${esc(src)} <a class="meta" href="#" onclick="setSrc('');return false">✕ kaynağı kaldır</a></div>` : '';
  if (hero) h += `<div class="top"><div class="hero" onclick="open_(${items.indexOf(hero)})">${hero.image?`<img src="${esc(hero.image)}" referrerpolicy="no-referrer" onerror="this.remove()">`:''}<div class="ov">${meta(hero)}<h2>${esc(hero.title)}</h2>${hero.video?'<span class="play" style="position:static">▶ Video</span>':''}</div></div>
    <div class="side">${side.map(i=>`<div class="mini" onclick="open_(${items.indexOf(i)})">${thumb(i)}<div><h3>${esc(i.title)}</h3>${meta(i)}</div></div>`).join('')}</div></div>`;
  h += `<div class="sec">${hero ? 'Diğer haberler' : 'Haberler'}</div><div class="grid">` +
    l.map(i => `<div class="card" onclick="open_(${items.indexOf(i)})">${thumb(i)}<div class="bd">${meta(i)}<h3>${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:''}</div></div>`).join('') + '</div>';
  app.innerHTML = h;
}

async function load(force){
  $('#app').innerHTML = '<div class="grid">' + '<div class="sk"></div>'.repeat(8) + '</div>';
  try {
    if (!store[cat] || force || Date.now() - store[cat].t > 60000) {
      const r = await fetch(`${WORKER}/haber?kategori=${cat}` + (force ? '&v=4' : ''));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      store[cat] = { t: Date.now(), items: j.items || [] };
    }
    items = store[cat].items;
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="msg">Haberler alınamadı (${esc(e.message||e)}).<br><br><a class="btn" href="#" onclick="load(true);return false">Tekrar dene</a></div>`;
  }
}
function go(c){ cat = c; src = ''; location.hash = c; nav(); load(); window.scrollTo(0,0); }
function setSrc(s){ src = s; render(); window.scrollTo(0,0); }
function nav(){ $('#nav').innerHTML = CATS.map(c => `<button class="${c[0]===cat?'on':''}" onclick="go('${c[0]}')">${c[1]}</button>`).join(''); }

function open_(i){
  const it = items[i]; if (!it) return;
  if (!it.video) { window.open(it.link, '_blank', 'noopener'); return; }
  const v = it.video;
  $('#pl').innerHTML = /youtube\.com\/embed/.test(v)
    ? `<iframe src="${esc(v)}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
    : /\.m3u8/.test(v) ? `<video controls autoplay playsinline src="${esc(v)}"></video>` : `<video controls autoplay playsinline src="${esc(v)}"></video>`;
  $('#mt').textContent = it.title; $('#ml').href = it.link; $('#md').classList.add('on');
}
function closeM(){ $('#md').classList.remove('on'); $('#pl').innerHTML = ''; }
$('#md').onclick = e => { if (e.target.id === 'md') closeM(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeM(); });

function theme(t, save){
  document.documentElement.setAttribute('data-theme', t);
  $('#th').textContent = t === 'dark' ? '☀' : '☾';
  if (save) try { localStorage.setItem('cetcety-theme', t); } catch (e) {}
}
$('#th').onclick = () => theme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
$('#rf').onclick = () => load(true);
$('#q').oninput = render;
window.onhashchange = () => { const c = location.hash.slice(1); if (c && c !== cat && CATS.some(x => x[0] === c)) go(c); };

theme(document.documentElement.getAttribute('data-theme'), false);
nav(); load();
timer = setInterval(() => { if (!document.hidden && !$('#q').value) { store[cat] = null; items = []; fetch(`${WORKER}/haber?kategori=${cat}`).then(r => r.json()).then(j => { store[cat] = { t: Date.now(), items: j.items || [] }; items = store[cat].items; render(); }).catch(() => {}); } }, 120000);
</script>
</body>
</html>
