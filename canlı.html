<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>POP DAMAR Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15151d;color:#e8e8ee;font:13px system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:44px 1fr 270px;user-select:none}
button,input,select,textarea{font:inherit;color:#eee;background:#262637;border:1px solid #34344a;border-radius:6px;padding:5px 9px}button{cursor:pointer}button:hover{background:#34344d}button:disabled{opacity:.4}
header{display:flex;align-items:center;gap:8px;padding:0 12px;background:#0f0f16;border-bottom:1px solid #26263a}header b{margin-right:10px}header .sp{flex:1}#tc{font:600 15px ui-monospace,monospace;min-width:110px;text-align:center}
.pri{background:#7c4dff;border-color:#7c4dff}.pri:hover{background:#6a3cf0}
main{display:grid;grid-template-columns:270px 1fr 280px;min-height:0}
aside{background:#1b1b26;padding:10px;overflow:auto}#bin{border-right:1px solid #26263a}#insp{border-left:1px solid #26263a}
h4{margin:12px 0 6px;font-size:11px;color:#9aa4b2;text-transform:uppercase;letter-spacing:.06em}h4:first-child{margin-top:0}
#view{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0b10;min-width:0;padding:8px;gap:8px}
#cv{width:100%;max-height:100%;aspect-ratio:16/9;background:#000;border-radius:4px}
.mc{display:flex;gap:8px;align-items:center;margin:5px 0;padding:5px;background:#222232;border-radius:8px}.mc img,.mc .ph{width:64px;height:36px;object-fit:cover;border-radius:4px;background:#111;flex:none;display:flex;align-items:center;justify-content:center}
.mc span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.mc button{padding:2px 8px}
.ir{display:flex;align-items:center;gap:8px;margin:6px 0}.ir label{width:96px;color:#9aa4b2;font-size:12px}.ir input[type=range]{flex:1;padding:0}.ir input[type=color]{padding:0;height:26px;width:46px}.ir textarea,.ir select{flex:1}
#tl{background:#12121a;border-top:1px solid #26263a;display:flex;flex-direction:column;min-height:0}
#tb{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid #26263a}
#sc{flex:1;overflow:auto;position:relative}#in{position:relative;min-width:100%}
#ruler{height:24px;background:#1d1830;position:sticky;top:0;z-index:5;cursor:pointer}#ruler i{position:absolute;top:0;font-style:normal;font-size:11px;color:#bba9ff;border-left:1px solid #4a3d7a;padding-left:3px;height:24px}
.lane{position:relative;margin:4px 0;background:#181822;border-radius:4px}.lane>em{position:absolute;left:6px;top:3px;font-size:10px;color:#666;font-style:normal;pointer-events:none;z-index:1}
.clip{position:absolute;top:2px;bottom:2px;border-radius:5px;overflow:hidden;border:2px solid transparent;cursor:grab;display:flex;align-items:center;padding:0 8px;font-size:11px;white-space:nowrap;background-size:auto 100%}
.clip.V{background-color:#3a3070;background-repeat:repeat-x}.clip.T{background:#6b4c1e}.clip.A{background:#1f5a4a}.clip.on{border-color:#fff}
.clip b{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}.clip b.l{left:0}.clip b.r{right:0}.clip b:hover{background:rgba(255,255,255,.4)}.clip span{position:relative;text-shadow:0 1px 3px #000}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:8;pointer-events:none}#ph::before{content:'';position:absolute;top:0;left:-6px;width:14px;height:14px;border-radius:50%;background:#fff}
small{color:#8a8a98}
</style></head><body>
<header>
 <b>🎬 POP DAMAR Studio</b>
 <button id="undo" title="Geri al (Ctrl+Z)">↶</button><button id="redo" title="İleri al (Ctrl+Y)">↷</button>
 <div class="sp"></div>
 <button id="home">⏮</button><button id="play" class="pri" style="min-width:60px">▶</button><span id="tc">0:00.0 / 0:00.0</span>
 <div class="sp"></div>
 <button id="exp" class="pri">⬇ Dışa aktar (mp4)</button>
</header>
<main>
 <aside id="bin">
  <h4>Medya</h4>
  <button id="imp" style="width:100%">＋ Video / ses / resim içe aktar</button>
  <input type="file" id="file" multiple accept="video/*,audio/*,image/*" hidden>
  <div id="mlist"><small>Dosyaları buraya sürükleyip bırakabilirsin.</small></div>
  <h4>Metin</h4>
  <button data-tx="Başlık" style="width:100%;margin-bottom:5px">T Başlık ekle</button>
  <button data-tx="Alt yazı" style="width:100%">T Alt yazı ekle</button>
  <h4>Sözler (LRC / metin)</h4>
  <textarea id="lrc" rows="5" style="width:100%" placeholder="[00:05.00] ilk satır&#10;[00:09.50] ikinci satır"></textarea>
  <button id="lrcgo" style="width:100%;margin-top:5px">Söz satırlarını metin klibi yap</button>
 </aside>
 <section id="view"><canvas id="cv" width="1280" height="720"></canvas></section>
 <aside id="insp"><small>Bir klip seç: konum, ölçek, opaklık, ses, filtre ve metin ayarları burada çıkar.</small></aside>
</main>
<section id="tl">
 <div id="tb">
  <button id="split" title="Oynatma çizgisinden böl (S)">✂ Böl</button><button id="del" title="Sil (Delete)">🗑 Sil</button><button id="dup" title="Çoğalt (Ctrl+D)">⧉ Çoğalt</button>
  <span style="flex:1"></span><button id="zo">−</button><button id="zi">＋</button><button id="zf">Sığdır</button>
  <small id="st" style="margin-left:10px"></small>
 </div>
 <div id="sc"><div id="in"><div id="ruler"></div><div id="lanes"></div><div id="ph"></div></div></div>
</section>
<script>
const $=s=>document.querySelector(s),W=1280,H=720,cx=$('#cv').getContext('2d');
let media={},clips=[],sel=null,t=0,playing=false,base=0,t0=0,pps=50,uid=1,undo=[],redo=[],exporting=null,els={},ac,master,an,dest;
const LANES=[['V','Video / resim',62],['T','Metin',38],['A','Ses / müzik',46]];
const fmt=x=>{x=Math.max(0,x);const m=Math.floor(x/60);return m+':'+(x-m*60).toFixed(1).padStart(4,'0')};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),end=()=>Math.max(0,...clips.map(c=>c.start+c.dur)),act=c=>t>=c.start&&t<c.start+c.dur;
function audio(){if(ac)return;ac=new AudioContext();master=ac.createGain();an=ac.createAnalyser();dest=ac.createMediaStreamDestination();master.connect(an);an.connect(ac.destination);an.connect(dest)}
function snap(){undo.push(JSON.stringify(clips));if(undo.length>60)undo.shift();redo=[]}
function restore(j){clips=JSON.parse(j);sel=null;clips.forEach(mkEl);build();insp()}
$('#undo').onclick=()=>{if(undo.length){redo.push(JSON.stringify(clips));restore(undo.pop())}};
$('#redo').onclick=()=>{if(redo.length){undo.push(JSON.stringify(clips));restore(redo.pop())}};

/* ---------- medya ---------- */
$('#imp').onclick=()=>$('#file').click();$('#file').onchange=e=>addFiles(e.target.files);
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();addFiles(e.dataTransfer.files)});
function addFiles(fs){[...fs].forEach(f=>{const kind=f.type.startsWith('video')?'video':f.type.startsWith('audio')?'audio':f.type.startsWith('image')?'image':null;if(!kind)return;
 const m={id:'m'+uid++,name:f.name,kind,url:URL.createObjectURL(f),dur:5,thumb:''};media[m.id]=m;
 if(kind==='image'){const i=new Image();i.onload=()=>{m.thumb=m.url;mlist()};i.src=m.url}
 else{const e=document.createElement(kind==='video'?'video':'audio');e.preload='metadata';e.onloadedmetadata=()=>{m.dur=e.duration||5;if(kind==='video')e.currentTime=Math.min(1,m.dur/3);else mlist()};
  e.onseeked=()=>{const c=document.createElement('canvas');c.width=128;c.height=72;c.getContext('2d').drawImage(e,0,0,128,72);m.thumb=c.toDataURL('image/jpeg',.6);mlist()};e.src=m.url}
 mlist()})}
function mlist(){const b=$('#mlist');b.innerHTML='';Object.values(media).forEach(m=>{const d=document.createElement('div');d.className='mc';
 d.innerHTML=(m.thumb?`<img src="${m.thumb}">`:`<div class="ph">${m.kind==='audio'?'♪':'…'}</div>`)+`<span title="${m.name}">${m.name}<br><small>${m.kind==='image'?'resim':fmt(m.dur)}</small></span>`;
 const bt=document.createElement('button');bt.textContent='＋';bt.title='Oynatma çizgisine ekle';bt.onclick=()=>addClip(m);d.appendChild(bt);b.appendChild(d)});
 if(!Object.keys(media).length)b.innerHTML='<small>Dosyaları buraya sürükleyip bırakabilirsin.</small>'}
function base0(tr){return{id:'c'+uid++,tr,start:t,in:0,dur:5,vol:1,op:1,sc:1,x:0,y:0,rot:0,fi:0,fo:0,fx:{br:1,co:1,sa:1,bl:0,gr:0}}}
function addClip(m){snap();const c=base0(m.kind==='audio'?'A':'V');c.mid=m.id;c.dur=m.kind==='image'?5:m.dur;if(m.kind!=='audio'&&m.kind!=='image'||true)Object.assign(c,{});clips.push(c);mkEl(c);sel=c.id;build();insp()}
function addText(txt,o){snap();const c=Object.assign(base0('T'),{dur:3,txt,size:72,col:'#ffffff',bg:'#000000',bga:0,anim:'fade',y:.5,font:'Inter,system-ui,sans-serif',bold:1},o||{});clips.push(c);sel=c.id;build();insp()}
document.querySelectorAll('[data-tx]').forEach(b=>b.onclick=()=>addText(b.dataset.tx,b.dataset.tx==='Alt yazı'?{size:44,y:.88,bga:.5}:{}));
$('#lrcgo').onclick=()=>{const L=$('#lrc').value.split('\n').map(l=>{const m=/^\s*\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/.exec(l);return m?{s:+m[1]*60+parseFloat(m[2]),x:m[3].trim()}:null}).filter(o=>o&&o.x);
 if(!L.length){$('#st').textContent='[dk:sn.xx] biçiminde zaman damgalı satır bulunamadı';return}snap();
 L.forEach((o,i)=>{const c=Object.assign(base0('T'),{start:o.s,dur:Math.max(.5,(L[i+1]?L[i+1].s:o.s+4)-o.s),txt:o.x,size:56,col:'#ffffff',bg:'#000000',bga:0,anim:'fade',y:.84,font:'Inter,system-ui,sans-serif',bold:1});clips.push(c)});build();$('#st').textContent=L.length+' söz klibi eklendi'};
function mkEl(c){if(c.tr==='T'||els[c.id])return;const m=media[c.mid];if(!m)return;let e;
 if(m.kind==='image'){e=new Image();e.src=m.url}else{audio();e=document.createElement(m.kind==='audio'?'audio':'video');e.src=m.url;e.preload='auto';e.playsInline=true;const s=ac.createMediaElementSource(e),g=ac.createGain();s.connect(g);g.connect(master);e._g=g}els[c.id]=e}

/* ---------- oynatma ---------- */
function play(){if(playing){pause();return}audio();ac.resume();if(t>=end()-.05)t=0;playing=true;base=t;t0=performance.now();$('#play').textContent='⏸'}
function pause(){playing=false;$('#play').textContent='▶'}
$('#play').onclick=play;$('#home').onclick=()=>seek(0);
function seek(x){t=clamp(x,0,Math.max(end(),.1));if(playing){base=t;t0=performance.now()}}
function sync(){for(const c of clips){const e=els[c.id];if(!e||e.tagName==='IMG')continue;const on=act(c),want=c.in+(t-c.start);
 if(e._g){const k=c.fi>0?(t-c.start)/c.fi:1,k2=c.fo>0?(c.start+c.dur-t)/c.fo:1;e._g.gain.value=on?c.vol*clamp(Math.min(k,k2),0,1):0}
 if(on){if(playing){if(Math.abs(e.currentTime-want)>.3)e.currentTime=want;if(e.paused)e.play().catch(()=>{})}else{e.pause();if(Math.abs(e.currentTime-want)>.04)e.currentTime=want}}else if(!e.paused)e.pause()}}
function draw(){cx.fillStyle='#000';cx.fillRect(0,0,W,H);
 const vs=clips.filter(c=>c.tr==='V'&&act(c)).sort((a,b)=>a.start-b.start);
 for(const c of vs){const e=els[c.id];if(!e||(e.tagName==='VIDEO'&&e.readyState<2))continue;const w0=e.videoWidth||e.naturalWidth,h0=e.videoHeight||e.naturalHeight;if(!w0)continue;
  let a=c.op;const k=c.fi>0?(t-c.start)/c.fi:1,k2=c.fo>0?(c.start+c.dur-t)/c.fo:1;a*=clamp(Math.min(k,k2),0,1);
  const pv=clips.filter(p=>p!==c&&p.tr==='V'&&p.start<c.start&&p.start+p.dur>c.start);   // üst üste binen klipler otomatik karışır
  if(pv.length){const o=Math.min(Math.max(...pv.map(p=>p.start+p.dur))-c.start,c.dur);if(o>0&&t-c.start<o)a*=(t-c.start)/o}
  cx.save();cx.globalAlpha=clamp(a,0,1);cx.filter=`brightness(${c.fx.br}) contrast(${c.fx.co}) saturate(${c.fx.sa}) blur(${c.fx.bl}px) grayscale(${c.fx.gr})`;
  const s=Math.max(W/w0,H/h0)*c.sc;cx.translate(W/2+c.x*W,H/2+c.y*H);cx.rotate(c.rot*Math.PI/180);cx.drawImage(e,-w0*s/2,-h0*s/2,w0*s,h0*s);cx.restore()}
 for(const c of clips.filter(c=>c.tr==='T'&&act(c))){const p=t-c.start,r=c.dur-p;let a=c.op,dy=0,txt=c.txt;
  if(c.anim==='fade')a*=clamp(Math.min(p,r)/.5,0,1);else if(c.anim==='up'){a*=clamp(p/.4,0,1);dy=(1-clamp(p/.4,0,1))*40}else if(c.anim==='type')txt=txt.slice(0,Math.ceil(txt.length*clamp(p/Math.min(2,c.dur*.6),0,1)));
  cx.save();cx.globalAlpha=clamp(a,0,1);cx.font=`${c.bold?700:400} ${c.size}px ${c.font}`;cx.textAlign='center';cx.textBaseline='middle';const ls=txt.split('\n'),lh=c.size*1.25,y0=H*c.y+dy-(ls.length-1)*lh/2;
  if(c.bga>0){const w=Math.max(...ls.map(l=>cx.measureText(l).width))+50;cx.globalAlpha=clamp(a,0,1)*c.bga;cx.fillStyle=c.bg;cx.fillRect(W/2+c.x*W-w/2,y0-lh/2-8,w,lh*ls.length+16);cx.globalAlpha=clamp(a,0,1)}
  cx.shadowColor='rgba(0,0,0,.6)';cx.shadowBlur=14;cx.fillStyle=c.col;ls.forEach((l,i)=>cx.fillText(l,W/2+c.x*W,y0+i*lh));cx.restore()}}
function loop(){if(playing){t=base+(performance.now()-t0)/1000;if(t>=end()){t=end();pause();if(exporting)finishExp()}}
 sync();draw();$('#tc').textContent=fmt(t)+' / '+fmt(end());$('#ph').style.left=t*pps+'px';requestAnimationFrame(loop)}

/* ---------- zaman çizelgesi ---------- */
function build(){const L=$('#lanes');L.innerHTML='';const tot=Math.max(end()+10,30);$('#in').style.width=Math.max(tot*pps,$('#sc').clientWidth)+'px';
 const R=$('#ruler');R.innerHTML='';const step=[1,2,5,10,15,30,60,120,300].find(s=>s*pps>=70)||300;for(let s=0;s<=tot;s+=step){const i=document.createElement('i');i.style.left=s*pps+'px';i.textContent=fmt(s).slice(0,-2);R.appendChild(i)}
 LANES.forEach(([k,name,h])=>{const ln=document.createElement('div');ln.className='lane';ln.style.height=h+'px';ln.dataset.k=k;ln.innerHTML='<em>'+name+'</em>';
  clips.filter(c=>c.tr===k).forEach(c=>{const d=document.createElement('div'),m=media[c.mid];d.className='clip '+k+(c.id===sel?' on':'');d.style.left=c.start*pps+'px';d.style.width=Math.max(8,c.dur*pps)+'px';
   if(k==='V'&&m&&m.thumb){d.style.backgroundImage=`url(${m.thumb})`}
   d.innerHTML='<b class="l"></b><span>'+(k==='T'?c.txt.split('\n')[0]:m?m.name:'')+'</span><b class="r"></b>';d.onpointerdown=ev=>dragStart(ev,c);ln.appendChild(d)});L.appendChild(ln)});
 $('#ph').style.height=($('#ruler').offsetHeight+L.offsetHeight)+'px'}
function dragStart(ev,c){ev.stopPropagation();ev.preventDefault();audio();const z=ev.target.classList.contains('l')?'l':ev.target.classList.contains('r')?'r':'m',x0=ev.clientX,s0=c.start,i0=c.in,d0=c.dur,m=media[c.mid];let moved=false;
 if(sel!==c.id){sel=c.id;insp()}snap();
 const mv=e=>{moved=true;let dx=(e.clientX-x0)/pps;const edges=[t,...clips.filter(o=>o!==c).flatMap(o=>[o.start,o.start+o.dur])],sn=v=>{for(const g of edges)if(Math.abs(g-v)*pps<8)return g;return v};
  if(z==='m'){let v=Math.max(0,s0+dx),a=sn(v),b=sn(v+d0)-d0;c.start=Math.abs(a-v)<=Math.abs(b+d0-(v+d0))&&Math.abs(a-v)*pps<8?a:Math.abs(b-v)*pps<8?Math.max(0,b):v}
  else if(z==='l'){let ns=sn(s0+dx);ns=clamp(ns,Math.max(0,m&&c.tr!=='T'&&m.kind!=='image'?s0-i0:0),s0+d0-.2);const d=ns-s0;c.start=ns;c.dur=d0-d;if(c.tr!=='T'&&m&&m.kind!=='image')c.in=i0+d}
  else{let nd=sn(s0+d0+dx)-s0;nd=Math.max(.2,nd);if(c.tr!=='T'&&m&&m.kind!=='image')nd=Math.min(nd,m.dur-c.in);c.dur=nd}build()},
  up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);if(!moved)undo.pop();else{seek(t)}insp()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up)}
$('#ruler').onpointerdown=ev=>{const f=e=>seek((e.clientX-$('#ruler').getBoundingClientRect().left)/pps);f(ev);const mv=e=>f(e),up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)};
$('#lanes').onpointerdown=ev=>{if(ev.target.classList.contains('lane')){seek((ev.clientX-$('#ruler').getBoundingClientRect().left)/pps);sel=null;build();insp()}};
function zoom(f){pps=clamp(pps*f,4,400);build()}$('#zi').onclick=()=>zoom(1.4);$('#zo').onclick=()=>zoom(1/1.4);$('#zf').onclick=()=>{pps=clamp(($('#sc').clientWidth-30)/Math.max(end(),5),4,400);build()};
$('#split').onclick=splitAt;function splitAt(){const c=clips.find(c=>c.id===sel&&act(c))||clips.find(c=>act(c)&&c.tr==='V')||clips.find(act);if(!c||t-c.start<.1||c.start+c.dur-t<.1)return;snap();
 const d=t-c.start,n=JSON.parse(JSON.stringify(c));n.id='c'+uid++;n.start=t;n.dur=c.dur-d;n.fi=0;c.fo=0;if(c.tr!=='T')n.in=c.in+d;c.dur=d;clips.push(n);mkEl(n);sel=n.id;build();insp()}
$('#del').onclick=delSel;function delSel(){const c=clips.find(c=>c.id===sel);if(!c)return;snap();clips=clips.filter(o=>o!==c);if(els[c.id]){els[c.id].pause&&els[c.id].pause();delete els[c.id]}sel=null;build();insp()}
$('#dup').onclick=dupSel;function dupSel(){const c=clips.find(c=>c.id===sel);if(!c)return;snap();const n=JSON.parse(JSON.stringify(c));n.id='c'+uid++;n.start=c.start+c.dur;clips.push(n);mkEl(n);sel=n.id;build();insp()}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(k===' '){e.preventDefault();play()}else if(k==='s'&&!e.ctrlKey)splitAt();else if(k==='delete'||k==='backspace'){e.preventDefault();delSel()}
 else if(k==='z'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#undo').click()}else if(k==='y'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('#redo').click()}else if(k==='d'&&(e.ctrlKey||e.metaKey)){e.preventDefault();dupSel()}
 else if(k==='arrowleft'){seek(t-(e.shiftKey?1:1/30))}else if(k==='arrowright'){seek(t+(e.shiftKey?1:1/30))}else if(k==='home')seek(0)});

/* ---------- özellikler paneli ---------- */
function insp(){const B=$('#insp');const c=clips.find(c=>c.id===sel);if(!c){B.innerHTML='<small>Bir klip seç: konum, ölçek, opaklık, ses, filtre ve metin ayarları burada çıkar.</small>';return}B.innerHTML='';
 const row=(lab,el)=>{const d=document.createElement('div');d.className='ir';d.innerHTML='<label>'+lab+'</label>';d.appendChild(el);B.appendChild(d)};
 const rng=(lab,get,set,a,b,st)=>{const i=document.createElement('input');i.type='range';i.min=a;i.max=b;i.step=st;i.value=get();i.oninput=()=>{set(+i.value)};i.onchange=()=>{};i.onpointerdown=()=>snap();row(lab,i)};
 const h=document.createElement('h4');h.textContent=c.tr==='T'?'Metin':c.tr==='A'?'Ses klibi':'Video / resim';B.appendChild(h);
 if(c.tr==='T'){const ta=document.createElement('textarea');ta.rows=3;ta.value=c.txt;ta.onfocus=()=>snap();ta.oninput=()=>{c.txt=ta.value;build()};row('Metin',ta);
  rng('Boyut',()=>c.size,v=>c.size=v,20,200,1);rng('Dikey konum',()=>c.y,v=>c.y=v,.05,.95,.01);rng('Yatay konum',()=>c.x,v=>c.x=v,-.4,.4,.01);
  const col=document.createElement('input');col.type='color';col.value=c.col;col.oninput=()=>c.col=col.value;col.onfocus=()=>snap();row('Renk',col);
  const bg=document.createElement('input');bg.type='color';bg.value=c.bg;bg.oninput=()=>c.bg=bg.value;bg.onfocus=()=>snap();row('Kutu rengi',bg);rng('Kutu opaklığı',()=>c.bga,v=>c.bga=v,0,1,.05);
