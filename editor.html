<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Atölyesi — Hızlı Birleştirici</title>
<style>
  :root{
    --bg:#faf8f4; --panel:#fff; --ink:#26231f; --muted:#7a746b; --line:#e6e1d8; --soft:#f1ede5;
    --accent:#c96442; --accent-ink:#fff; --accent-soft:rgba(201,100,66,.14); --danger:#b3372b;
    --radius:16px; --shadow:0 6px 22px rgba(38,35,31,.08);
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171614;--panel:#201f1c;--ink:#f1ede5;--muted:#a39c91;--line:#34312c;--soft:#2a2824;--accent:#e07a56;--accent-soft:rgba(224,122,86,.18);--shadow:0 6px 22px rgba(0,0,0,.4)}}
  :root[data-theme="dark"]{--bg:#171614;--panel:#201f1c;--ink:#f1ede5;--muted:#a39c91;--line:#34312c;--soft:#2a2824;--accent:#e07a56;--accent-soft:rgba(224,122,86,.18);--shadow:0 6px 22px rgba(0,0,0,.4)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
  button,input,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  header.top h1{font-size:22px;margin:0;font-weight:800}
  .btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;color:inherit}
  .btn:hover{border-color:var(--accent)}
  .btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 12px;font-weight:700}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;background:var(--soft);cursor:pointer}
  .drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
  .drop b{display:block;font-size:16px}
  .drop span{color:var(--muted);font-size:13.5px}
  .field{margin-bottom:12px}
  .field label,.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;font-weight:600;margin-bottom:5px}
  .field select,.field input[type=text],.field input[type=number]{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-height:40px}
  .field input[type=range]{width:100%;accent-color:var(--accent)}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg input{position:absolute;opacity:0}
  .seg label{margin:0;border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:600;font-size:13.5px;background:var(--bg);display:inline-flex;align-items:center}
  .seg input:checked + label{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  [hidden]{display:none!important}
  .fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
  .fx input{position:absolute;opacity:0}
  .fx label{border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:13.5px;background:var(--bg);display:flex;flex-direction:column;gap:1px;min-height:52px}
  .fx label span{font-weight:400;color:var(--muted);font-size:12px}
  .fx input:checked + label{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .stage{position:sticky;top:12px}
  .screen{background:#000;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 auto;max-height:64vh;width:100%;box-shadow:var(--shadow)}
  .screen canvas{display:block;max-width:100%;max-height:64vh;width:auto;height:auto}
  .bar{display:flex;align-items:center;gap:10px;margin-top:12px}
  .bar input[type=range]{flex:1;accent-color:var(--accent)}
  .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:96px;text-align:right}
  .status{font-size:13.5px;color:var(--muted);min-height:20px;margin-top:8px}
  .status.err{color:var(--danger)}
  .progress{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px;display:none}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
  .note{font-size:13px;background:var(--soft);border-radius:12px;padding:10px 12px;color:var(--muted);margin-top:10px}
  .clip{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);margin-bottom:10px}
  .clip .hd{display:flex;gap:10px;align-items:center}
  .clip .hd img{width:64px;height:44px;object-fit:cover;border-radius:8px;background:#000}
  .clip .hd .nm{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .clip .hd .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .clip .hd .ac button{min-width:34px;min-height:34px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-weight:700}
  .clip .fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:10px}
  .clip .fl label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
  .clip .fl select,.clip .fl input[type=number]{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:6px 0}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;margin-left:6px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}.stage{position:static;order:-1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Video Atölyesi <span class="tag">Hızlı</span></h1><p>En fazla 5 video · kare atlamayan, sesli birleştirme</p></div>
    <button class="btn sm" id="themeBtn" type="button">Gece / Gündüz</button>
  </header>

  <div class="grid">
    <div class="col">
      <section class="card">
        <h2>1. Videolar (maks 5)</h2>
        <div class="drop" id="drop" tabindex="0" role="button">
          <b>Videoları buraya bırak ya da seç</b>
          <span>MP4, MOV, WebM</span>
        </div>
        <input type="file" id="file" accept="video/*" multiple hidden>
        <div id="clipList" style="margin-top:12px"></div>
        <div class="empty" id="emptyMsg">Henüz video yok.</div>
        <div class="status" id="status" role="status"></div>
      </section>

      <section class="card">
        <h2>2. Biçim</h2>
        <div class="field"><div class="lbl">Boyut</div>
          <div class="seg">
            <input type="radio" name="size" id="s1" value="720x1280" checked><label for="s1">9:16</label>
            <input type="radio" name="size" id="s2" value="1080x1920"><label for="s2">9:16 HD</label>
            <input type="radio" name="size" id="s3" value="1280x720"><label for="s3">16:9</label>
            <input type="radio" name="size" id="s4" value="1920x1080"><label for="s4">16:9 HD</label>
          </div></div>
        <div class="field"><div class="lbl">Yerleşim</div>
          <div class="seg">
            <input type="radio" name="fit" id="f1" value="blur" checked><label for="f1">Bulanık arka plan</label>
            <input type="radio" name="fit" id="f2" value="cover"><label for="f2">Doldur (kırp)</label>
            <input type="radio" name="fit" id="f3" value="contain"><label for="f3">Sığdır (siyah)</label>
          </div></div>
        <div class="field"><label for="fps">Kare Hızı</label><select id="fps">
          <option value="24">24 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select></div>
      </section>

      <section class="card">
        <h2>3. Efektler (isteğe bağlı)</h2>
        <div class="fx" id="fxList">
          <input type="checkbox" id="x_beat" data-fx="beat"><label for="x_beat">Ritim zoom<span>Vuruşla yakınlaşma</span></label>
          <input type="checkbox" id="x_vig" data-fx="vig"><label for="x_vig">Vinyet<span>Kenarları karart</span></label>
          <input type="checkbox" id="x_grain" data-fx="grain"><label for="x_grain">Film greni<span>Analog tanecik</span></label>
        </div>
        <div class="row2" style="margin-top:12px">
          <div class="field"><label for="fxI">Şiddet <output id="fxIOut">70%</output></label><input type="range" id="fxI" min="10" max="100" value="70"></div>
          <div class="field"><label for="bpm">BPM</label><input type="number" id="bpm" min="60" max="200" value="120"></div>
        </div>
      </section>

      <section class="card">
        <h2>4. Oluştur</h2>
        <div class="field"><div class="lbl">Kalite</div>
          <div class="seg">
            <input type="radio" name="q" id="q1" value="3000000"><label for="q1">Normal</label>
            <input type="radio" name="q" id="q2" value="6000000" checked><label for="q2">Yüksek</label>
          </div></div>
        <div style="display:flex;gap:8px">
          <button class="btn pri" id="makeBtn" type="button" disabled>Videoyu oluştur</button>
          <button class="btn" id="stopBtn" type="button" hidden>Durdur</button>
        </div>
        <div class="progress" id="prog"><i id="progI"></i></div>
        <div class="status" id="exStatus"></div>
        <div id="result" hidden style="margin-top:10px"></div>
      </section>
    </div>

    <aside class="stage">
      <div class="screen"><canvas id="cv" width="720" height="1280"></canvas></div>
      <div class="bar">
        <button class="btn sm" id="playBtn" type="button" disabled>▶ Oynat</button>
        <input type="range" id="seek" min="0" max="1000" value="0" disabled>
        <span class="time" id="timeOut">0:00 / 0:00</span>
      </div>
    </aside>
  </div>
</div>

<!-- Harici MP4 Muxer kütüphanesi -->
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d');
var S={w:720,h:1280,fit:'blur',fps:30,fx:{},fxI:.7,bpm:120,q:6000000,origVol:1};
var clips=[],uid=0,playing=false,T=0,T0=0,tStart=0,dirty=true,activeId=null,MAX=5;

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rnd(seed){var x=Math.sin(seed*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function mmss(t){t=Math.max(0,Math.floor(t));var m=Math.floor(t/60),s=t%60;return m+':'+('0'+s).slice(-2)}
function setStatus(m,err){var s=$('status');s.textContent=m;s.className='status'+(err?' err':'')}
function exStatus(m,err){var s=$('exStatus');s.textContent=m;s.className='status'+(err?' err':'')}
var FILT=(function(){try{var c=document.createElement('canvas').getContext('2d');c.filter='blur(2px)';return c.filter==='blur(2px)'}catch(e){return false}})();

function makeVideo(file){
  var v=document.createElement('video');v.playsInline=true;v.preload='auto';v.muted=true;v.setAttribute('playsinline','');
  v.src=URL.createObjectURL(file);
  v.addEventListener('seeked',function(){dirty=true});
  return {v:v,url:v.src};
}
function loadMeta(v){return new Promise(function(res,rej){
  if(v.readyState>=1&&v.duration)return res();
  v.onloadedmetadata=function(){res()};v.onerror=function(){rej()};
});}
function thumbOf(v,dur){
  return new Promise(function(res){
    var done=false,fin=function(){if(done)return;done=true;v.removeEventListener('seeked',fin);
      try{var c=document.createElement('canvas');c.width=128;c.height=88;var x=c.getContext('2d'),vw=v.videoWidth||16,vh=v.videoHeight||9,s=Math.max(128/vw,88/vh);x.drawImage(v,(128-vw*s)/2,(88-vh*s)/2,vw*s,vh*s);var u=c.toDataURL('image/jpeg',.7);try{v.currentTime=0}catch(e){}res(u)}catch(e){res('')}};
    v.addEventListener('seeked',fin);try{v.currentTime=Math.min(1,dur/2)}catch(e){fin()}setTimeout(fin,2500);
  });
}
async function addFiles(files){
  var list=[].filter.call(files,function(f){return /^video\//.test(f.type)||/\.(mp4|mov|m4v|webm)$/i.test(f.name)});
  if(!list.length){setStatus('Video seçmedin.',true);return}
  if(list.length+clips.length>MAX){
    setStatus('En fazla '+MAX+' video.',true);list=list.slice(0,MAX-clips.length);
  }
  setStatus('Açılıyor…');var failed=0;
  list.sort(function(a,b){return a.name.localeCompare(b.name,'tr',{numeric:true})});
  for(var i=0;i<list.length;i++){
    var f=list[i],m=makeVideo(f);
    try{await loadMeta(m.v)}catch(e){failed++;continue}
    var d=m.v.duration;if(!isFinite(d)||d<=0){failed++;continue}
    var th=await thumbOf(m.v,d);
    clips.push({id:++uid,name:f.name,url:m.url,v:m.v,dur:d,thumb:th,in:0,out:d,speed:1,look:'none',fit:'global'});
  }
  renderClips();afterChange();
  setStatus(clips.length+' video · '+mmss(total())+(failed?' · '+failed+' açılamadı':''),!!failed);
}
function clipLen(c){return Math.max(0.2,(c.out-c.in)/c.speed)}
function total(){var s=0;clips.forEach(function(c){s+=clipLen(c)});return s}
function locate(t){
  var acc=0;
  for(var i=0;i<clips.length;i++){var L=clipLen(clips[i]);if(t<acc+L||i===clips.length-1)return {i:i,local:clamp(t-acc,0,L),start:acc,len:L};acc+=L}
  return null;
}
function afterChange(){
  var has=clips.length>0;
  $('playBtn').disabled=!has;$('seek').disabled=!has;$('makeBtn').disabled=!has;
  $('emptyMsg').style.display=has?'none':'block';
  T=clamp(T,0,total());activeId=null;readSettings();syncMedia(true);dirty=true;updateUI();
}
function opts(arr,sel){return arr.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>'}).join('')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function renderClips(){
  var box=$('clipList');box.innerHTML='';
  clips.forEach(function(c,i){
    var d=document.createElement('div');d.className='clip';d.dataset.id=c.id;
    d.innerHTML='<div class="hd"><img alt="" src="'+(c.thumb||'')+'"><div class="nm">'+(i+1)+'. '+esc(c.name)+'<small>'+mmss(c.dur)+'</small></div>'
     +'<div class="ac"><button data-a="up"'+(i===0?' disabled':'')+'>↑</button><button data-a="dn"'+(i===clips.length-1?' disabled':'')+'>↓</button><button data-a="del">✕</button></div></div>'
     +'<div class="fl"><div><label>Başlangıç</label><input type="number" data-k="in" min="0" step="0.1" value="'+c.in.toFixed(1)+'"></div>'
     +'<div><label>Bitiş</label><input type="number" data-k="out" min="0" step="0.1" value="'+c.out.toFixed(1)+'"></div>'
     +'<div><label>Hız</label><select data-k="speed">'+opts([['0.5','0.5x'],['1','1x'],['1.5','1.5x'],['2','2x']],String(c.speed))+'</select></div>'
     +'<div><label>Renk</label><select data-k="look">'+opts([['none','Doğal'],['bw','S/B'],['warm','Sıcak']],c.look)+'</select></div></div>';
    box.appendChild(d);
  });
}
$('clipList').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var row=b.closest('.clip'),id=+row.dataset.id,i=clips.findIndex(function(c){return c.id===id}),a=b.dataset.a;
  if(a==='del'){clips.splice(i,1)[0].v.pause()}
  else if(a==='up'&&i>0){var t=clips[i];clips[i]=clips[i-1];clips[i-1]=t}
  else if(a==='dn'&&i<clips.length-1){var t=clips[i];clips[i]=clips[i+1];clips[i+1]=t}
  renderClips();pause();afterChange();
});
$('clipList').addEventListener('change',function(e){
  var el=e.target,k=el.dataset.k;if(!k)return;
  var c=clips.find(function(x){return x.id===+el.closest('.clip').dataset.id});if(!c)return;
  if(k==='in'){c.in=clamp(+el.value||0,0,c.dur-0.2);if(c.out<=c.in+0.2)c.out=Math.min(c.dur,c.in+0.2);}
  else if(k==='out')c.out=clamp(+el.value||c.dur,c.in+0.2,c.dur);
  else if(k==='speed')c.speed=+el.value;
  else c[k]=el.value;
  if(k==='in'||k==='out'){el.closest('.clip').querySelector('[data-k=in]').value=c.in.toFixed(1);el.closest('.clip').querySelector('[data-k=out]').value=c.out.toFixed(1)}
  activeId=null;syncMedia(true);dirty=true;updateUI();
});

function readSettings(){
  var sz=document.querySelector('input[name=size]:checked').value.split('x');
  var nw=+sz[0],nh=+sz[1];
  if(cv.width!==nw||cv.height!==nh){cv.width=nw;cv.height=nh}
  S.w=nw;S.h=nh;
  S.fit=document.querySelector('input[name=fit]:checked').value;
  S.fps=+$('fps').value;
  document.querySelectorAll('#fxList input').forEach(function(el){S.fx[el.dataset.fx]=el.checked});
  S.fxI=+$('fxI').value/100;S.bpm=clamp(+$('bpm').value||120,40,240);
  S.q=+document.querySelector('input[name=q]:checked').value;
  $('fxIOut').textContent=Math.round(S.fxI*100)+'%';
}

function seekV(v,t){try{v.currentTime=clamp(t,0,(v.duration||1e9)-0.02)}catch(e){}}
function syncMedia(force){
  var L=locate(T);
  if(L){
    var c=clips[L.i],want=c.in+L.local*c.speed;
    if(activeId!==c.id||force){
      clips.forEach(function(x){if(x.id!==c.id&&!x.v.paused)x.v.pause()});
      activeId=c.id;c.v.playbackRate=c.speed;
      if(!(Math.abs(c.v.currentTime-want)<0.4))seekV(c.v,want);
    }else if(playing&&Math.abs(c.v.currentTime-want)>0.45&&!c.v.seeking){seekV(c.v,want)}
    c.v.playbackRate=c.speed;
    if(playing){if(c.v.paused&&!c.v.seeking){var p=c.v.play();if(p&&p.catch)p.catch(function(){})}}
    else if(!c.v.paused)c.v.pause();
  }
}
function play(){
  if(!clips.length)return;
  if(T>=total()-0.05)T=0;
  playing=true;T0=T;tStart=performance.now();readSettings();syncMedia(true);
  $('playBtn').textContent='❚❚ Durdur';dirty=true;
}
function pause(){
  playing=false;clips.forEach(function(c){try{c.v.pause()}catch(e){}});
  $('playBtn').textContent='▶ Oynat';dirty=true;
}

var bgc=document.createElement('canvas'),cache={};
function beatPulse(t){return Math.pow(1-((t*S.bpm/60)%1),3)}
function drawVid(v,x,y,w,h,mode,k,filter){
  var vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh||v.readyState<2)return false;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  if(mode==='blur'&&Math.abs(vw/vh-w/h)>0.03){
    var bw=48,bh=Math.max(8,Math.round(48*h/w));
    if(bgc.width!==bw||bgc.height!==bh){bgc.width=bw;bgc.height=bh}
    var bx=bgc.getContext('2d'),s0=Math.max(bw/vw,bh/vh);bx.drawImage(v,(bw-vw*s0)/2,(bh-vh*s0)/2,vw*s0,vh*s0);
    ctx.imageSmoothingQuality='high';if(FILT)ctx.filter='blur(10px)';
    ctx.drawImage(bgc,x-w*0.05,y-h*0.05,w*1.1,h*1.1);ctx.filter='none';
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x,y,w,h);
    mode='contain';
  }
  var sc=(mode==='cover'?Math.max(w/vw,h/vh):Math.min(w/vw,h/vh))*k,dw=vw*sc,dh=vh*sc;
  if(FILT&&filter)ctx.filter=filter;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(v,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  ctx.filter='none';ctx.restore();return true;
}
var LOOKS={none:'',warm:'sepia(.25) saturate(1.3) hue-rotate(-12deg) brightness(1.05)',bw:'grayscale(1) contrast(1.12)'};
function drawFrame(t){
  var W=S.w,H=S.h,u=Math.min(W,H);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  var L=locate(t);
  if(!L){
    ctx.fillStyle='#1d1b18';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='600 '+Math.round(u*0.045)+'px Roboto,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Video ekleyince burada görünür',W/2,H/2);return;
  }
  var c=clips[L.i];
  var k=1;
  if(S.fx.beat)k*=1+0.05*S.fxI*beatPulse(t);
  drawVid(c.v,0,0,W,H,c.fit==='global'?S.fit:c.fit,k,LOOKS[c.look]||'');
  drawFx(t);
}
function drawFx(t){
  var W=S.w,H=S.h,u=Math.min(W,H),I=S.fxI,F=S.fx;
  if(F.grain){
    var gi=Math.floor(t*12)%4,tile=cache['grain'+gi];
    if(!tile){tile=document.createElement('canvas');tile.width=192;tile.height=192;var c=tile.getContext('2d'),im=c.createImageData(192,192),d=im.data;for(var p=0;p<d.length;p+=4){var v=Math.random()*255;d[p]=d[p+1]=d[p+2]=v;d[p+3]=Math.random()*70}c.putImageData(im,0,0);cache['grain'+gi]=tile}
    ctx.save();ctx.globalAlpha=0.55*I+0.15;var ox=-rnd(gi*3+1)*192,oy=-rnd(gi*5+2)*192;
    for(var gy=oy;gy<H;gy+=192)for(var gx=ox;gx<W;gx+=192)ctx.drawImage(tile,gx,gy);ctx.restore();
  }
  if(F.vig){var vg=ctx.createRadialGradient(W/2,H/2,u*0.3,W/2,H/2,Math.max(W,H)*0.72);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+(0.35+0.5*I).toFixed(2)+')');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
  if(F.beat){var pb=beatPulse(t);ctx.fillStyle='rgba(255,255,255,'+(0.13*I*pb).toFixed(3)+')';ctx.fillRect(0,0,W,H)}
}

function updateUI(){
  var tot=total();$('timeOut').textContent=mmss(T)+' / '+mmss(tot);
  if(document.activeElement!==$('seek'))$('seek').value=tot?Math.round(T/tot*1000):0;
}
function loop(){
  requestAnimationFrame(loop);
  if(playing){
    T=T0+(performance.now()-tStart)/1000;
    var tot=total();
    if(T>=tot){T=tot;pause()}
    syncMedia(false);
  }
  if(playing||dirty){drawFrame(T);dirty=false;updateUI()}
}

/* ---------- DIŞA AKTARMA (BELLEK DOSTU) ---------- */
var stopFlag=false,exporting=false;

async function captureAndEncode(){
  var W=S.w, H=S.h, fps=S.fps, tot=total();
  var MuxerCtor = window.Mp4Muxer && (window.Mp4Muxer.Muxer || window.Mp4Muxer);
  
  // KRİTİK: fastStart: 'fragmented' bellek hatasını önler.
  var muxer = new MuxerCtor({
    target: new window.Mp4Muxer.ArrayBufferTarget(),
    video: {codec:'avc', width:W, height:H},
    fastStart: 'fragmented' 
  });

  var frameCount = 0;
  var enc = new VideoEncoder({
    output: function(chunk, meta){ muxer.addVideoChunk(chunk, meta) },
    error: function(e){ console.error(e); stopFlag=true; }
  });
  
  var conf = {codec:'avc1.42E01E', width:W, height:H, framerate:fps, bitrate:S.q};
  var cands = ['avc1.640028','avc1.42E01E'];
  for(var i=0; i<cands.length; i++){
    var c2 = {codec:cands[i], width:W, height:H, framerate:fps, bitrate:S.q};
    if(await isCodecSupported(c2)){ conf=c2; break; }
  }
  enc.configure(conf);

  for(var ci=0; ci<clips.length && !stopFlag; ci++){
    var c = clips[ci];
    var frames = Math.max(1, Math.round(clipLen(c)*fps));
    var baseAcc = 0;
    for(var k=0; k<ci; k++) baseAcc += clipLen(clips[k]);

    await waitReady(c.v);
    
    await new Promise(function(res){
      var d=false; var f=function(){if(d)return;d=true;c.v.removeEventListener('seeked',f);res()};
      c.v.addEventListener('seeked',f); c.v.currentTime = c.in; setTimeout(f, 1000);
    });

    c.v.muted = true;
    var p = c.v.play(); if(p) await p.catch(function(){});
    c.v.playbackRate = c.speed;

    for(var fi=0; fi<frames && !stopFlag; fi++){
      var target = c.in + (fi/fps) * c.speed;
      while(c.v.currentTime < target && !stopFlag){
        await new Promise(function(r){ requestAnimationFrame(r) });
      }

      T = baseAcc + fi/fps;
      drawFrame(T);

      var vf = new VideoFrame(cv, { timestamp: Math.round((frameCount/fps)*1e6), duration: Math.round(1e6/fps) });
      enc.encode(vf, { keyFrame: (frameCount % fps === 0) });
      vf.close();
      frameCount++;
      
      if(frameCount % 5 === 0){
        updateExportProgress(T, tot);
        while(enc.encodeQueueSize > 6) await new Promise(function(r){ setTimeout(r, 5) });
      }
    }
    c.v.pause();
  }

  while(enc.encodeQueueSize > 0) await new Promise(function(r){ setTimeout(r, 10) });
  await enc.flush();
  enc.close();
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}

function waitReady(v){return new Promise(function(res){var n=0;(function chk(){if(v.readyState>=2&&!v.seeking||++n>100)return res();setTimeout(chk,40)})()})}
function isCodecSupported(conf){
  if(!('VideoEncoder' in window))return false;
  try{return VideoEncoder.isConfigSupported(conf).then(function(r){return r.supported})}catch(e){return false}
}
function updateExportProgress(cur,tot){
  var p=tot?cur/tot:0;$('progI').style.width=Math.round(clamp(p,0,1)*100)+'%';
  exStatus('Kodlanıyor… %'+Math.round(clamp(p,0,1)*100)+' · '+mmss(cur)+' / '+mmss(tot));
}

async function makeVideoOut(){
  if(exporting||!clips.length)return;
  if(!('VideoEncoder' in window)){
    exStatus('Tarayıcı WebCodecs desteklemiyor.',true); return;
  }
  pause(); readSettings();
  exporting=true; stopFlag=false;
  $('makeBtn').disabled=true; $('stopBtn').hidden=false; $('prog').style.display='block'; $('progI').style.width='0';
  $('result').hidden=true; $('result').innerHTML='';
  exStatus('Başladı…');
  var t0=performance.now();
  try{
    var blob=await captureAndEncode();
    var secs=((performance.now()-t0)/1000).toFixed(1);
    var url=URL.createObjectURL(blob), mb=(blob.size/1048576).toFixed(1);
    var box=$('result'); box.hidden=false;
    
    box.innerHTML='<video controls playsinline style="width:100%;max-height:50vh;border-radius:12px" src="'+url+'"></video>'
      +'<div style="margin:8px 0;font-size:13px;color:var(--muted)">MP4 · '+mb+' MB · '+mmss(total())+' · '+secs+' sn</div>'
      +'<a class="btn pri" id="downloadLink" download="cetcety_video.mp4" href="'+url+'">İndir</a>';
      
    setTimeout(function(){
        var link = document.getElementById('downloadLink');
        if(link) link.click();
    }, 500);

    exStatus('Hazır ('+secs+' sn).');
  }catch(e){
    exStatus('Hata: '+(e&&e.message||e),true);
  }finally{
    exporting=false;$('makeBtn').disabled=!clips.length;$('stopBtn').hidden=true;$('prog').style.display='none';
    T=0;activeId=null;syncMedia(true);dirty=true;
  }
}

$('drop').addEventListener('click',function(){$('file').click()});
$('file').addEventListener('change',function(){addFiles(this.files);this.value=''});
$('playBtn').addEventListener('click',function(){playing?pause():play()});
$('seek').addEventListener('input',function(){
  if(exporting)return;T=+this.value/1000*total();
  if(playing){T0=T;tStart=performance.now();syncMedia(true)}else syncMedia(true);
  dirty=true;updateUI();
});
$('makeBtn').addEventListener('click',makeVideoOut);
$('stopBtn').addEventListener('click',function(){stopFlag=true;exStatus('Durduruluyor…')});
document.addEventListener('input',function(e){
  if(exporting)return; if(e.target.type==='file')return;
  readSettings(); if(!playing)syncMedia(true); dirty=true;
});
$('themeBtn').addEventListener('click',function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'});

readSettings();
requestAnimationFrame(loop);
})();
</script>
