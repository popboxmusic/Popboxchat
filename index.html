  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useCallback } = React;

    // --- Supabase ---
    const SUPABASE_URL = "https://zggtfbfjdcxvyfhvnegt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpnZ3RmYmZqZGN4dnlmaHZuZWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MDk3ODMsImV4cCI6MjEwNjQ4NTc4M30.j4MzTtiu_HJCM538aJIzi-HDHdmEbqWefWeREHETF-o";

    // --- Constants ---

    const CATEGORY_COLORS = {
      Genel: '#3b82f6', Radyo: '#f59e0b', Spor: '#10b981', Haber: '#ef4444', Sinema: '#8b5cf6',

    const Eye = (p) => React.createElement(Svg, p, [

      React.createElement('circle', { key: 2, cx: 12, cy: 12, r: 3 }),

    const VolumeX = (p) => React.createElement(Svg, p, [
      React.createElement('path', { key: 1, d: 'M11 5 6 9H2v6h4l5 4V5Z' }),
      React.createElement('path', { key: 2, d: 'm22 9-6 6M16 9l6 6' }),

    const Volume2 = (p) => React.createElement(Svg, p, [

    ]);
    const X = (p) => React.createElement(Svg, p, React.createElement('path', { d: 'M18 6 6 18M6 6l12 12' }));
    const ChevronDown = (p) => React.createElement(Svg, p, React.createElement('path', { d: 'm6 9 6 6 6-6' }));
    const Settings = (p) => React.createElement(Svg, p, [
      React.createElement('path', { key: 1, d: 'M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z' }),
      React.createElement('circle', { key: 2, cx: 12, cy: 12, r: 3 }),
    ]);
    const Search = (p) => React.createElement(Svg, p, [
      React.createElement('circle', { key: 1, cx: 11, cy: 11, r: 8 }),
      React.createElement('path', { key: 2, d: 'm21 21-4.3-4.3' }),
    ]);
    const Newspaper = (p) => React.createElement(Svg, p, [
      React.createElement('path', { key: 1, d: 'M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2' }),
      React.createElement('path', { key: 2, d: 'M18 14h-8M15 18h-5M10 6h8v4h-8V6Z' }),
    ]);
    const Users = (p) => React.createElement(Svg, p, [
      React.createElement('path', { key: 1, d: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2' }),
      React.createElement('circle', { key: 2, cx: 9, cy: 7, r: 4 }),
      React.createElement('path', { key: 3, d: 'M22 21v-2a4 4 0 0 0-3-3.87' }),
      React.createElement('path', { key: 4, d: 'M16 3.13a4 4 0 0 1 0 7.75' }),
    ]);
    const Crown = (p) => React.createElement(Svg, p, [
      React.createElement('path', { key: 1, d: 'M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z' }),
      React.createElement('path', { key: 2, d: 'M5 21h14' }),
    ]);
    const ArrowRight = (p) => React.createElement(Svg, p, React.createElement('path', { d: 'M5 12h14M12 5l7 7-7 7' }));
    const MoreVertical = (p) => React.createElement(Svg, p, [
      React.createElement('circle', { key: 1, cx: 12, cy: 5, r: 1 }),
      React.createElement('circle', { key: 2, cx: 12, cy: 12, r: 1 }),
      React.createElement('circle', { key: 3, cx: 12, cy: 19, r: 1 }),
    ]);
    const MessageSquare = (p) => React.createElement(Svg, p, React.createElement('path', { d: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z' }));

    const CATEGORY_ICON_MAP = { Genel: Hash, Radyo: Radio, Spor: Trophy, Haber: Newspaper, Sinema: Film };

    // --- Helper components ---
    function Modal({ children, onClose, title }) {
      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 modal-overlay" onClick={onClose}>
          <div className="bg-[#2b2d31] rounded-xl shadow-2xl w-full max-w-md border border-white/10 modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between px-5 py-4 border-b border-white/10">
              <h2 className="font-semibold text-sm">{title}</h2>
              <button onClick={onClose} className="p-1 hover:bg-white/10 rounded-md transition-colors"><X size={18} /></button>
            </div>
            <div className="p-5">{children}</div>
          </div>
        </div>
      );
    }

    function Field({ label, children }) {
      return (
        <div>
          <label className="block text-xs font-medium text-gray-400 uppercase tracking-wide mb-1.5">{label}</label>
          {children}
        </div>
      );
    }

    // --- Main App ---
    function App() {
      const [channels, setChannels] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [activeCategory, setActiveCategory] = useState('Genel');
      const [searchQuery, setSearchQuery] = useState('');
      const [showHidden, setShowHidden] = useState(true);
      const [modalType, setModalType] = useState(null);
      const [selectedChannel, setSelectedChannel] = useState(null);
      const [newName, setNewName] = useState('');
      const [newOwner, setNewOwner] = useState('');
      const [newCategory, setNewCategory] = useState('Genel');
      const [newDescription, setNewDescription] = useState('');
      const [transferOwner, setTransferOwner] = useState('');
      const [openMenuId, setOpenMenuId] = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      const fetchChannels = useCallback(async () => {
        setLoading(true);
        const { data, error: fetchError } = await supabase.from('channels').select('*').order('category').order('position');
        if (fetchError) {
          setError('Kanallar yüklenemedi');
        } else {
          setChannels(data);
        }
        setLoading(false);
      }, []);

      useEffect(() => { fetchChannels(); }, [fetchChannels]);

      useEffect(() => {
        const handleClick = () => setOpenMenuId(null);
        window.addEventListener('click', handleClick);
        return () => window.removeEventListener('click', handleClick);
      }, []);

      const filteredChannels = channels.filter((ch) => {
        if (!showHidden && ch.hidden) return false;
        if (searchQuery && !ch.name.toLowerCase().includes(searchQuery.toLowerCase()) && !ch.owner.toLowerCase().includes(searchQuery.toLowerCase())) return false;
        return true;
      });

      const channelsByCategory = CATEGORIES.map((cat) => ({
        category: cat,
        items: filteredChannels.filter((ch) => ch.category === cat),
      }));

      const activeChannels = filteredChannels.filter((ch) => ch.category === activeCategory);

      const handleCreate = async () => {
        if (!newName.trim()) return;
        const { error: insertError } = await supabase.from('channels').insert({
          name: newName.trim().toLowerCase().replace(/\s+/g, '-'),
          category: newCategory,
          owner: newOwner.trim() || 'Yönetici',
          description: newDescription.trim() || null,
        });
        if (insertError) {
          setError('Kanal oluşturulamadı');
        } else {
          setNewName(''); setNewOwner(''); setNewDescription('');
          setModalType(null); setError(null);
          fetchChannels();
        }
      };

      const handleDelete = async (id) => {
        const { error: deleteError } = await supabase.from('channels').delete().eq('id', id);
        if (deleteError) { setError('Kanal silinemedi'); } else { fetchChannels(); }
      };

      const handleToggleHidden = async (ch) => {
        const { error: updateError } = await supabase.from('channels').update({ hidden: !ch.hidden }).eq('id', ch.id);
        if (updateError) { setError('Görünürlük değiştirilemedi'); } else { fetchChannels(); }
      };

      const handleToggleMuted = async (ch) => {
        const { error: updateError } = await supabase.from('channels').update({ muted: !ch.muted }).eq('id', ch.id);
        if (updateError) { setError('Sessiz durumu değiştirilemedi'); } else { fetchChannels(); }
      };

      const handleTransfer = async () => {
        if (!selectedChannel || !transferOwner.trim()) return;
        const { error: updateError } = await supabase.from('channels').update({ owner: transferOwner.trim() }).eq('id', selectedChannel.id);
        if (updateError) { setError('Sahip değiştirilemedi'); }
        else { setTransferOwner(''); setSelectedChannel(null); setModalType(null); fetchChannels(); }
      };

      const openTransfer = (ch) => {
        setSelectedChannel(ch); setTransferOwner(ch.owner); setModalType('transfer'); setOpenMenuId(null);
      };

      const openCreate = () => { setNewCategory(activeCategory); setModalType('create'); };

      const totalChannels = channels.length;
      const hiddenCount = channels.filter((ch) => ch.hidden).length;
      const mutedCount = channels.filter((ch) => ch.muted).length;

      return (
        <div className="h-screen bg-[#1e1f22] text-gray-100 flex overflow-hidden">
          {/* Mobile toggle */}
          <button onClick={() => setSidebarOpen(!sidebarOpen)}
            className="lg:hidden fixed top-4 left-4 z-50 p-2 bg-[#2b2d31] rounded-lg shadow-lg">
            {sidebarOpen ? <X size={20} /> : <ChevronDown size={20} className="rotate-90" />}
          </button>

          {/* Sidebar */}
          <aside className={`${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 fixed lg:relative z-40 w-72 h-full bg-[#2b2d31] flex flex-col transition-transform duration-300 ease-in-out`}>
            {/* Header */}
            <div className="h-12 px-4 flex items-center justify-between border-b border-black/30 shadow-sm">
              <div className="flex items-center gap-2">
                <div className="w-7 h-7 rounded-full bg-gradient-to-br from-blue-500 to-emerald-500 flex items-center justify-center">
                  <MessageSquare size={16} className="text-white" />
                </div>
                <span className="font-semibold text-sm">Kanal Yöneticisi</span>
              </div>
              <button onClick={openCreate} className="p-1.5 hover:bg-white/10 rounded-md transition-colors" title="Yeni Kanal">
                <Plus size={18} />
              </button>
            </div>

            {/* Search */}
            <div className="px-3 py-2">
              <div className="relative">
                <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400" />
                <input type="text" placeholder="Kanal ara..." value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full bg-[#1e1f22] text-sm rounded-md pl-8 pr-3 py-1.5 outline-none placeholder-gray-500 focus:ring-1 focus:ring-blue-500" />
              </div>
            </div>

            {/* Filter */}
            <div className="px-3 pb-2 flex items-center gap-2">
              <button onClick={() => setShowHidden(!showHidden)}
                className={`flex items-center gap-1.5 text-xs px-2 py-1 rounded-md transition-colors ${showHidden ? 'bg-blue-500/20 text-blue-300' : 'bg-white/5 text-gray-400'}`}>
                {showHidden ? <Eye size={12} /> : <EyeOff size={12} />} Gizli kanallar
              </button>
            </div>

            {/* Categories */}
            <div className="flex-1 overflow-y-auto px-2 pb-4 scrollbar-thin">
              {channelsByCategory.map(({ category, items }) => {
                const Icon = CATEGORY_ICON_MAP[category] || Hash;
                const color = CATEGORY_COLORS[category] || '#888';
                const isActive = activeCategory === category;
                return (
                  <div key={category} className="mb-1">
                    <button onClick={() => { setActiveCategory(category); setSidebarOpen(false); }}
                      className={`w-full flex items-center gap-2 px-2 py-1.5 rounded-md group transition-all ${isActive ? 'bg-white/10' : 'hover:bg-white/5'}`}>
                      <Icon size={16} style={{ color }} />
                      <span className={`text-xs font-semibold uppercase tracking-wide flex-1 text-left ${isActive ? 'text-gray-100' : 'text-gray-400'}`}>{category}</span>
                      <span className="text-[10px] text-gray-500 bg-white/5 px-1.5 rounded-full">{items.length}</span>
                    </button>

                    {isActive && (
                      <div className="mt-0.5 space-y-0.5">
                        {items.length === 0 && <p className="text-xs text-gray-500 px-4 py-2 italic">Kanal yok</p>}
                        {items.map((ch) => (
                          <div key={ch.id} className="flex items-center gap-1.5 px-2 py-1.5 rounded-md hover:bg-white/5 group transition-colors relative">
                            {ch.hidden && <EyeOff size={14} className="text-gray-500 flex-shrink-0" />}
                            {ch.muted && <VolumeX size={14} className="text-gray-500 flex-shrink-0" />}
                            {!ch.hidden && !ch.muted && <Hash size={14} className="text-gray-500 flex-shrink-0" />}
                            <span className={`text-sm flex-1 truncate ${ch.hidden ? 'text-gray-500' : 'text-gray-300'}`}>{ch.name}</span>
                            <button onClick={(e) => { e.stopPropagation(); setOpenMenuId(openMenuId === ch.id ? null : ch.id); }}
                              className="opacity-0 group-hover:opacity-100 p-0.5 hover:bg-white/10 rounded transition-all">
                              <MoreVertical size={14} />
                            </button>

                            {openMenuId === ch.id && (
                              <div className="absolute right-0 top-full mt-1 z-30 w-44 bg-[#111214] rounded-lg shadow-xl border border-white/10 py-1" onClick={(e) => e.stopPropagation()}>
                                <button onClick={() => { handleToggleHidden(ch); setOpenMenuId(null); }}
                                  className="w-full flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-white/5 transition-colors">
                                  {ch.hidden ? <Eye size={14} /> : <EyeOff size={14} />} {ch.hidden ? 'Göster' : 'Gizle'}
                                </button>
                                <button onClick={() => { handleToggleMuted(ch); setOpenMenuId(null); }}
                                  className="w-full flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-white/5 transition-colors">
                                  {ch.muted ? <Volume2 size={14} /> : <VolumeX size={14} />} {ch.muted ? 'Sesi Aç' : 'Sessize Al'}
                                </button>
                                <button onClick={() => openTransfer(ch)}
                                  className="w-full flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-white/5 transition-colors">
                                  <UserCog size={14} /> Sahibi Değiştir
                                </button>
                                <div className="my-1 border-t border-white/10" />
                                <button onClick={() => { handleDelete(ch.id); setOpenMenuId(null); }}
                                  className="w-full flex items-center gap-2 px-3 py-1.5 text-sm text-red-400 hover:bg-red-500/10 transition-colors">
                                  <Trash2 size={14} /> Kanalı Sil
                                </button>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Stats */}
            <div className="px-3 py-2 bg-[#232428] border-t border-black/30 flex items-center justify-between text-xs text-gray-400">
              <div className="flex items-center gap-3">
                <span className="flex items-center gap-1"><Hash size={12} /> {totalChannels}</span>
                <span className="flex items-center gap-1"><EyeOff size={12} /> {hiddenCount}</span>
                <span className="flex items-center gap-1"><VolumeX size={12} /> {mutedCount}</span>
              </div>
              <Settings size={14} className="text-gray-500" />
            </div>
          </aside>

          {/* Mobile overlay */}
          {sidebarOpen && <div className="lg:hidden fixed inset-0 bg-black/50 z-30" onClick={() => setSidebarOpen(false)} />}

          {/* Main */}
          <main className="flex-1 flex flex-col min-w-0">
            <header className="h-12 px-4 flex items-center justify-between border-b border-black/30 shadow-sm bg-[#2b2d31]">
              <div className="flex items-center gap-2">
                {(() => {
                  const Icon = CATEGORY_ICON_MAP[activeCategory] || Hash;
                  const color = CATEGORY_COLORS[activeCategory] || '#888';
                  return <Icon size={20} style={{ color }} />;
                })()}
                <h1 className="font-semibold text-sm">{activeCategory} Kanalları</h1>
                <span className="text-xs text-gray-500 ml-2">{activeChannels.length} kanal</span>
              </div>
              <button onClick={openCreate} className="flex items-center gap-1.5 text-sm px-3 py-1.5 bg-blue-600 hover:bg-blue-700 rounded-md transition-colors">
                <Plus size={16} /> <span className="hidden sm:inline">Kanal Aç</span>
              </button>
            </header>

            <div className="flex-1 overflow-y-auto p-4 lg:p-6">
              {loading && (
                <div className="flex items-center justify-center h-64">
                  <div className="animate-spin rounded-full h-8 w-8 border-2 border-gray-600 border-t-blue-500" />
                </div>
              )}

              {error && (
                <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-4 mb-4 text-red-400 text-sm flex items-center justify-between">
                  <span>{error}</span>
                  <button onClick={() => setError(null)} className="hover:text-red-300"><X size={16} /></button>
                </div>
              )}

              {!loading && activeChannels.length === 0 && (
                <div className="flex flex-col items-center justify-center h-64 text-gray-500">
                  <Hash size={48} className="mb-4 opacity-30" />
                  <p className="text-sm">Bu kategoride henüz kanal yok</p>
                  <button onClick={openCreate} className="mt-4 flex items-center gap-1.5 text-sm px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md transition-colors text-white">
                    <Plus size={16} /> İlk Kanalı Oluştur
                  </button>
                </div>
              )}

              {!loading && activeChannels.length > 0 && (
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                  {activeChannels.map((ch) => {
                    const Icon = CATEGORY_ICON_MAP[ch.category] || Hash;
                    const color = CATEGORY_COLORS[ch.category] || '#888';
                    return (
                      <div key={ch.id} className={`bg-[#2b2d31] rounded-xl p-4 border border-white/5 hover:border-white/10 transition-all group ${ch.hidden ? 'opacity-60' : ''}`}>
                        <div className="flex items-start justify-between mb-3">
                          <div className="flex items-center gap-2.5">
                            <div className="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0" style={{ backgroundColor: color + '20' }}>
                              <Icon size={18} style={{ color }} />
                            </div>
                            <div className="min-w-0">
                              <h3 className="font-semibold text-sm truncate">{ch.name}</h3>
                              <p className="text-xs text-gray-500 truncate">{ch.category}</p>
                            </div>
                          </div>
                          <div className="flex items-center gap-1">
                            {ch.hidden && <span className="p-1 bg-white/5 rounded-md" title="Gizli"><EyeOff size={12} className="text-gray-400" /></span>}
                            {ch.muted && <span className="p-1 bg-white/5 rounded-md" title="Sessiz"><VolumeX size={12} className="text-gray-400" /></span>}
                          </div>
                        </div>

                        {ch.description && <p className="text-xs text-gray-400 mb-3 line-clamp-2">{ch.description}</p>}

                        <div className="flex items-center gap-1.5 mb-3">
                          <Crown size={12} className="text-amber-500" />
                          <span className="text-xs text-gray-400 truncate">{ch.owner}</span>
                        </div>

                        <div className="flex items-center gap-1.5 flex-wrap">
                          <button onClick={() => handleToggleHidden(ch)} className="flex items-center gap-1 text-xs px-2 py-1.5 bg-white/5 hover:bg-white/10 rounded-md transition-colors">
                            {ch.hidden ? <Eye size={12} /> : <EyeOff size={12} />} {ch.hidden ? 'Aç' : 'Gizle'}
                          </button>
                          <button onClick={() => handleToggleMuted(ch)} className="flex items-center gap-1 text-xs px-2 py-1.5 bg-white/5 hover:bg-white/10 rounded-md transition-colors">
                            {ch.muted ? <Volume2 size={12} /> : <VolumeX size={12} />} {ch.muted ? 'Aç' : 'Kapat'}
                          </button>
                          <button onClick={() => openTransfer(ch)} className="flex items-center gap-1 text-xs px-2 py-1.5 bg-white/5 hover:bg-white/10 rounded-md transition-colors">
                            <UserCog size={12} /> Devir
                          </button>
                          <button onClick={() => handleDelete(ch.id)} className="flex items-center gap-1 text-xs px-2 py-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-md transition-colors ml-auto">
                            <Trash2 size={12} /> Sil
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </main>

          {/* Create Modal */}
          {modalType === 'create' && (
            <Modal onClose={() => setModalType(null)} title="Yeni Kanal Aç">
              <div className="space-y-4">
                <Field label="Kanal Adı">
                  <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="örn: genel-sohbet" className="modal-input" autoFocus />
                </Field>
                <Field label="Kategori">
                  <select value={newCategory} onChange={(e) => setNewCategory(e.target.value)} className="modal-input">
                    {CATEGORIES.map((cat) => <option key={cat} value={cat} className="bg-[#1e1f22]">{cat}</option>)}
                  </select>
                </Field>
                <Field label="Sahip (Owner)">
                  <input type="text" value={newOwner} onChange={(e) => setNewOwner(e.target.value)} placeholder="örn: Yönetici" className="modal-input" />
                </Field>
                <Field label="Açıklama (opsiyonel)">
                  <input type="text" value={newDescription} onChange={(e) => setNewDescription(e.target.value)} placeholder="Kanal açıklaması" className="modal-input" />
                </Field>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setModalType(null)} className="px-4 py-2 text-sm bg-white/5 hover:bg-white/10 rounded-md transition-colors">İptal</button>
                  <button onClick={handleCreate} disabled={!newName.trim()} className="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-md transition-colors flex items-center gap-1.5">
                    <Plus size={14} /> Oluştur
                  </button>
                </div>
              </div>
            </Modal>
          )}

          {/* Transfer Modal */}
          {modalType === 'transfer' && selectedChannel && (
            <Modal onClose={() => { setModalType(null); setSelectedChannel(null); }} title="Kanal Sahibini Değiştir">
              <div className="space-y-4">
                <div className="bg-white/5 rounded-lg p-3 flex items-center gap-3">
                  <Crown size={18} className="text-amber-500" />
                  <div>
                    <p className="text-sm font-medium">{selectedChannel.name}</p>
                    <p className="text-xs text-gray-500">Mevcut sahip: {selectedChannel.owner}</p>
                  </div>
                </div>
                <Field label="Yeni Sahip">
                  <input type="text" value={transferOwner} onChange={(e) => setTransferOwner(e.target.value)} placeholder="Yeni sahip adı" className="modal-input" autoFocus />
                </Field>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => { setModalType(null); setSelectedChannel(null); }} className="px-4 py-2 text-sm bg-white/5 hover:bg-white/10 rounded-md transition-colors">İptal</button>
                  <button onClick={handleTransfer} disabled={!transferOwner.trim()} className="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-md transition-colors flex items-center gap-1.5">
                    <ArrowRight size={14} /> Devret
                  </button>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(React.StrictMode, null, React.createElement(App)));
  </script>
</body>
</html>
